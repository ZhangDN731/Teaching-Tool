<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教学工具合辑</title>
    <style>
        :root {
            --cyber-cyan: #22e5ff;
            --cyber-violet: #b040ff;
            --cyber-magenta: #ff3fb8;
            --bg-main: #0c101c;
            --bg-deep: #070a13;
            --glass-dark: rgba(18, 24, 42, 0.65);
            --glass-border-light: rgba(34, 229, 255, 0.22);
            --text-primary: #e6edff;
            --text-secondary: #94a3c2;
            --glow-soft-cyan: 0 0 14px rgba(34, 229, 255, 0.35), 0 0 28px rgba(34, 229, 255, 0.15);
            --glow-soft-violet: 0 0 14px rgba(176, 64, 255, 0.35), 0 0 28px rgba(176, 64, 255, 0.15);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            padding: 0;
            background:
                radial-gradient(circle at 10% 15%, rgba(34, 229, 255, 0.12), transparent 32%),
                radial-gradient(circle at 90% 20%, rgba(176, 64, 255, 0.12), transparent 32%),
                radial-gradient(circle at 45% 85%, rgba(255, 63, 184, 0.08), transparent 35%),
                linear-gradient(180deg, var(--bg-deep), var(--bg-main));
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(34, 229, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(34, 229, 255, 0.04) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 1;
        }

        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.3;
            z-index: -1;
            pointer-events: none;
        }
        .bg-orb.a { width: 460px; height: 460px; background: var(--cyber-cyan); top:-160px; left:-120px; }
        .bg-orb.b { width: 420px; height: 420px; background: var(--cyber-violet); bottom:-140px; right:-100px; }

        .mouseLightContainer {
            position: absolute;
            inset:0;
            pointer-events:none;
            z-index:2;
            overflow:hidden;
            opacity:0;
            transition:opacity 0.24s;
        }
        .mouseLight{
            position:absolute;
            width:300px;height:300px;
            border-radius:50%;
            background:radial-gradient(circle, rgba(34,229,255,0.25), rgba(176,64,255,0.12), transparent 70%);
            transform:translate(-50%,-50%);
            will-change:left,top;
        }

        header {
            width:100%;
            padding:2.6rem 1rem;
            text-align:center;
            background: rgba(12,16,28,0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom:1px solid var(--glass-border-light);
            box-shadow: var(--glow-soft-cyan);
            position:relative;
            z-index:3;
        }

        header::before{
            content:"";
            position:absolute;
            width:100%;height:2px;
            top:0;left:0;
            background:linear-gradient(90deg,transparent,var(--cyber-cyan),var(--cyber-violet),transparent);
        }

        h1 {
            margin:0;
            font-size: clamp(1.8rem,3vw,2.6rem);
            letter-spacing: 1px;
            color:#ffffff;
            text-shadow: 0 0 10px rgba(34,229,255,0.45);
        }
        .subtitle {
            font-size: clamp(0.92rem,1.7vw,1.05rem);
            color:var(--text-secondary);
            margin-top:0.7rem;
            max-width:740px;
            margin-inline:auto;
            line-height:1.6;
        }

        main {
            width:92%;
            max-width:1220px;
            padding:2.4rem 1rem;
            position:relative;
            z-index:2;
        }

        .card-container{
            display:flex;
            flex-wrap:wrap;
            justify-content:center;
            gap:26px;
        }

        .card {
            width:270px;
            background:var(--glass-dark);
            backdrop-filter: blur(22px) saturate(160%);
            -webkit-backdrop-filter: blur(22px) saturate(160%);
            border:1px solid var(--glass-border-light);
            border-radius:18px;
            padding:1.9rem 1.4rem;
            text-align:center;
            position:relative;
            overflow:hidden;
            transition: transform 0.32s ease, box-shadow 0.32s ease, border-color 0.32s ease;
        }

        .card::before{
            content:"";
            position:absolute;
            top:0;left:0;
            width:100%;height:3px;
            background:linear-gradient(90deg,var(--cyber-cyan),var(--cyber-violet));
        }

        .card:hover{
            transform: translateY(-8px);
            border-color:rgba(176,64,255,0.4);
            box-shadow: var(--glow-soft-cyan), var(--glow-soft-violet);
        }

        .card h3{
            margin:0;
            font-size:1.26rem;
            color:#fff;
        }
        .card p{
            color:var(--text-secondary);
            font-size:0.9rem;
            margin:0.8rem 0 1.3rem;
            line-height:1.55;
        }

        .card-link{
            display:inline-block;
            width:84%;
            padding:0.86rem 1rem;
            border-radius:12px;
            border:1px solid var(--cyber-cyan);
            background:transparent;
            color:var(--cyber-cyan);
            text-decoration:none;
            font-weight:600;
            font-size:0.94rem;
            transition: all 0.26s ease;
        }
        .card-link:hover{
            background:linear-gradient(90deg, rgba(34,229,255,0.18),rgba(176,64,255,0.18));
            color:#fff;
            box-shadow: var(--glow-soft-cyan);
            border-color:var(--cyber-violet);
        }
        .card-link.disabled{
            border-color:#444c63;
            color:#707c9c;
            cursor:not-allowed;
            box-shadow:none;
            background:transparent;
        }

        .collapse-wrap{
            margin-top:2.6rem;
        }
        .collapse-btn{
            width:100%;
            background:var(--glass-dark);
            backdrop-filter: blur(22px) saturate(160%);
            -webkit-backdrop-filter: blur(22px) saturate(160%);
            border:1px solid var(--glass-border-light);
            color:var(--cyber-cyan);
            padding:1.15rem 1.3rem;
            border-radius:16px;
            font-size:1.04rem;
            font-weight:600;
            text-align:left;
            cursor:pointer;
            transition: 0.26s;
        }
        .collapse-btn::after{
            content:" ▼";
            float:right;
        }
        .collapse-btn.open::after{
            content:" ▲";
        }
        .collapse-btn:hover{
            border-color:rgba(176,64,255,0.4);
            box-shadow:var(--glow-soft-cyan);
        }

        .collapse-content{
            display:none;
            flex-wrap:wrap;
            justify-content:center;
            gap:26px;
            padding-top:26px;
            animation:fadeUp 0.35s ease;
        }
        .collapse-content.show{
            display:flex;
        }
        @keyframes fadeUp{
            from{opacity:0;transform:translateY(-10px);}
            to{opacity:1;transform:translateY(0);}
        }

        footer{
            margin-top:auto;
            width:100%;
            padding:1.2rem;
            text-align:center;
            color:var(--text-secondary);
            font-size:0.88rem;
            border-top:1px solid var(--glass-border-light);
            background:rgba(12,16,28,0.65);
            backdrop-filter: blur(14px);
        }
        #footer-info{
            margin-top:0.4rem;
            font-size:0.8rem;
        }

        @media(max-width:768px){
            .card{
                width:100%;
                max-width:340px;
            }
        }
    </style>
</head>
<body>

    <footer id="footer">

        <div id="footer-info">
            <span id="ip-address">IP地址获取中...</span> |
            <span id="visit-time">访问时间获取中...</span>
        </div>
    </footer>

    <script>
        const toggleBtn = document.getElementById('toggleBtn');
        const collapseBox = document.getElementById('collapseBox');
        toggleBtn.addEventListener('click', ()=>{
            collapseBox.classList.toggle('show');
            toggleBtn.classList.toggle('open');
        });

        const glowZones = [
            {element:document.getElementById('header'),container:document.getElementById('headerLightContainer'),light:document.getElementById('headerLight')},
            {element:document.getElementById('cardContainer'),container:document.getElementById('cardLightContainer'),light:document.getElementById('cardLight')},
            {element:document.getElementById('footer'),container:document.getElementById('footerLightContainer'),light:document.getElementById('footerLight')}
        ];
        let currentActiveZone=null;

        function handleMouseMove(e){
            let newActiveZone=null;
            for(const z of glowZones){
                const rect=z.element.getBoundingClientRect();
                if(e.clientX>=rect.left&&e.clientX<=rect.right&&e.clientY>=rect.top&&e.clientY<=rect.bottom){
                    newActiveZone=z;break;
                }
            }
            if(newActiveZone!==currentActiveZone){
                if(currentActiveZone) currentActiveZone.container.style.opacity='0';
                if(newActiveZone) newActiveZone.container.style.opacity='1';
                currentActiveZone=newActiveZone;
            }
            if(currentActiveZone){
                const cr=currentActiveZone.container.getBoundingClientRect();
                currentActiveZone.light.style.left=(e.clientX - cr.left)+"px";
                currentActiveZone.light.style.top=(e.clientY - cr.top)+"px";
            }
        }
        document.addEventListener('mousemove',handleMouseMove);
        document.addEventListener('mouseleave',()=>{
            if(currentActiveZone){currentActiveZone.container.style.opacity='0';currentActiveZone=null;}
        });

        document.addEventListener('DOMContentLoaded',async()=>{
            const ipSpan=document.getElementById('ip-address');
            const timeSpan=document.getElementById('visit-time');
            const now=new Date();
            timeSpan.textContent=`访问时间: ${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
            try{
                const res=await fetch('https://api.ipify.org?format=json');
                const d=await res.json();
                ipSpan.textContent=`IP地址: ${d.ip}`;
            }catch(err){
                ipSpan.textContent="IP地址: 获取失败";
            }
        })
    </script>
