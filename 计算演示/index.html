      if (c === '"' || c === "'") {
        const q = c; let j = i + 1, buf = '';
        while (j < s.length && s[j] !== q) { buf += s[j]; j++; }
        if (j >= s.length) throw new Error('字符串引号不配对');
        toks.push({ t: 'str', v: buf }); i = j + 1; continue;
      }
      let m = s.slice(i).match(/^\d+(\.\d+)?/);
      if (m) { toks.push({ t: 'num', v: parseFloat(m[0]) }); i += m[0].length; continue; }
      m = s.slice(i).match(/^[A-Za-z_][A-Za-z0-9_]*/);
      if (m) { toks.push({ t: 'id', v: m[0] }); i += m[0].length; continue; }
      const two = s.slice(i, i + 2);
      if (['//', '**', '==', '!=', '<=', '>='].includes(two)) { toks.push({ t: 'op', v: two }); i += 2; continue; }
      if ('+-*/%<>(),'.includes(c)) { toks.push({ t: 'op', v: c }); i++; continue; }
      throw new Error(`无法识别的符号：${c}`);
    }
    return toks;
  },
  evalExpr(src, vars) {
    const toks = this._tokenize(src);
    if (!toks.length) throw new Error('表达式为空');
    let p = 0;
    const peek = () => toks[p];
    const next = () => toks[p++];
    const eat = op => { const k = peek(); if (k && k.t === 'op' && k.v === op) { p++; return true; } return false; };

    const parseOr = () => {
      let v = parseAnd();
      while (peek() && peek().t === 'id' && peek().v === 'or') { next(); v = this.truthy(v) || this.truthy(parseAnd()); }
      return v;
    };
    const parseAnd = () => {
      let v = parseNot();
      while (peek() && peek().t === 'id' && peek().v === 'and') { next(); v = this.truthy(v) && this.truthy(parseNot()); }
      return v;
    };
    const parseNot = () => {
      if (peek() && peek().t === 'id' && peek().v === 'not') { next(); return !this.truthy(parseNot()); }
      return parseCmp();
    };
    const parseCmp = () => {
      let v = parseAdd();
      while (peek() && peek().t === 'op' && ['==', '!=', '>', '<', '>=', '<='].includes(peek().v)) {
        const op = next().v; const r = parseAdd(); v = this._cmp(v, op, r);
      }
      return v;
    };
    const parseAdd = () => {
      let v = parseMul();
      while (peek() && peek().t === 'op' && (peek().v === '+' || peek().v === '-')) {
        const op = next().v; const r = parseMul(); v = op === '+' ? v + r : v - r;
      }
      return v;
    };
    const parseMul = () => {
      let v = parseUnary();
      while (peek() && peek().t === 'op' && ['*', '/', '//', '%', '**'].includes(peek().v)) {
        const op = next().v; const r = parseUnary(); v = this._arith(v, op, r);
      }
      return v;
    };
    const parseUnary = () => {
      if (peek() && peek().t === 'op' && (peek().v === '-' || peek().v === '+')) {
        const op = next().v; const v = parseUnary(); return op === '-' ? -v : v;
      }
      return parseAtom();
    };
    const parseAtom = () => {
      const k = next();
      if (!k) throw new Error('表达式不完整，请检查括号与运算符');
      if (k.t === 'num') return k.v;
      if (k.t === 'str') return k.v;
      if (k.t === 'id') {
        if (k.v === 'True') return true;
        if (k.v === 'False') return false;
        if (k.v === 'None') return null;
        if (eat('(')) {
          if (!eat(')')) { parseOr(); while (eat(',')) parseOr(); if (!eat(')')) throw new Error('括号不匹配'); }
          throw new Error(`不支持的函数调用：${k.v}()`);
        }
        if (k.v in vars) return vars[k.v];
        throw new Error(`变量 ${k.v} 未定义`);
      }
      if (k.t === 'op' && k.v === '(') { const v = parseOr(); if (!eat(')')) throw new Error('括号不匹配'); return v; }
      throw new Error('表达式中存在无法识别的符号');
    };

    const root = parseOr();
    if (p < toks.length) throw new Error('表达式格式不正确');
    return root;
  },
  /* 把表达式中的变量替换为当前值，生成可读的代入文本，如 a + b → 5 + 3 */
  substExpr(src, vars) {
    return this._tokenize(src).map(k => {
      if (k.t === 'id' && k.v in vars) return this.fmtVal(vars[k.v]);
      if (k.t === 'str') return `'${k.v}'`;
      return k.v;
    }).join(' ');
  },
  evalRange(args, vars) {
    let start = 0, stop = 0, step = 1;
    if (args.length === 1) stop = this.evalExpr(args[0], vars);
    else if (args.length === 2) { start = this.evalExpr(args[0], vars); stop = this.evalExpr(args[1], vars); }
    else if (args.length === 3) { start = this.evalExpr(args[0], vars); stop = this.evalExpr(args[1], vars); step = this.evalExpr(args[2], vars); }
    else throw new Error('range 参数个数应为 1~3 个');
    const arr = [];
    if (step > 0) { for (let v = start; v < stop; v += step) arr.push(v); }
    else { for (let v = start; v > stop; v += step) arr.push(v); }
    return arr;
  },
  /* 按顶层逗号拆分 print 参数（忽略字符串与括号内的逗号） */
  splitArgs(s) {
    const out = []; let depth = 0, buf = '', q = null;
    for (let i = 0; i < s.length; i++) {
      const c = s[i];
      if (q) { buf += c; if (c === q) q = null; continue; }
      if (c === '"' || c === "'") { q = c; buf += c; continue; }
      if (c === '(' || c === '[') depth++;
      if (c === ')' || c === ']') depth--;
      if (c === ',' && depth === 0) { out.push(buf.trim()); buf = ''; continue; }
      buf += c;
    }
    if (buf.trim()) out.push(buf.trim());
    return out;
  },

  /* ==================== 代码高亮 ==================== */
  highlightLine(text) {
    let out = ''; const s = text; let i = 0; let q = null;
    while (i < s.length) {
      const c = s[i];
      if (!q && c === '#') { out += `<span class="cm">${esc(s.slice(i))}</span>`; break; }
      if (c === ' ' || c === '\t') { out += c; i++; continue; }
      if (c === '"' || c === "'") {
        q = c; let j = i + 1, buf = '';
        while (j < s.length && s[j] !== q) { buf += s[j]; j++; }
        out += `<span class="str">${q}${esc(buf)}${q}</span>`; q = null; i = j + 1; continue;
      }
      if (/[0-9]/.test(c)) {
        let j = i, num = '';
        while (j < s.length && /[0-9.]/.test(s[j])) { num += s[j]; j++; }
        out += `<span class="num">${num}</span>`; i = j; continue;
      }
      if (/[A-Za-z_]/.test(c)) {
        let j = i, id = '';
        while (j < s.length && /[A-Za-z0-9_]/.test(s[j])) { id += s[j]; j++; }
        if (id === 'print' || id === 'range') out += `<span class="fn">${id}</span>`;
        else if (['if', 'elif', 'else', 'for', 'in', 'while', 'and', 'or', 'not', 'True', 'False', 'None'].includes(id)) out += `<span class="kw">${id}</span>`;
        else out += esc(id);
        i = j; continue;
      }
      out += esc(c); i++;
    }
    return out;
  },

  /* ==================== 轻量解释器：把代码编译为步骤快照 ==================== */
  buildRun(code) {
    const self = this;
    if (!code || !code.trim()) throw new Error('代码框为空：请先输入 Python 代码，或点击预设示例按钮。');
    const rawLines = code.split(/\r?\n/);
    const stripInlineComment = line => {
      let q = null;
      for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (q) { if (c === q) q = null; continue; }
        if (c === '"' || c === "'") { q = c; continue; }
        if (c === '#') return line.slice(0, i);
      }
      return line;
    };
    const meta = rawLines.map((raw, idx) => {
      const cleaned = stripInlineComment(raw);
      const text = cleaned.trim();
      const lead = raw.match(/^[ \t]*/)[0];
      const indent = lead.replace(/\t/g, '    ').length;
      return { raw, text, indent, idx, blank: text === '', comment: raw.trim().startsWith('#') };
    });
    const execLines = meta.filter(m => !m.blank && !m.comment);
    if (!execLines.length) throw new Error('代码中没有可执行语句。');

    /* ---------- 解析为带缩进层级的语句树 ---------- */
    let pi = 0;
    function parseBlock(minIndent) {
      const out = [];
      while (pi < execLines.length && execLines[pi].indent > minIndent) {
        const ln = execLines[pi];
        const t = ln.text;
        if (/^if\b/.test(t)) out.push(parseIf(ln));
        else if (/^for\b/.test(t)) out.push(parseFor(ln));
        else if (/^while\b/.test(t)) out.push(parseWhile(ln));
        else { out.push({ kind: 'stmt', line: ln }); pi++; }
      }
      return out;
    }
    function parseIf(header) {
      const cond = header.text.replace(/^if\s+/, '').replace(/:\s*$/, '').trim();
      if (!cond) throw new Error(`第 ${header.idx + 1} 行：if 后缺少条件表达式`);
      const branches = [{ cond, line: header, body: [] }];
      pi++;
      branches[0].body = parseBlock(header.indent);
      while (pi < execLines.length && execLines[pi].indent === header.indent) {
        const t = execLines[pi].text;
        if (/^elif\b/.test(t)) {
          const c = t.replace(/^elif\s+/, '').replace(/:\s*$/, '').trim();
          const l = execLines[pi];
          pi++;
          branches.push({ cond: c, line: l, body: parseBlock(l.indent) });
        } else if (/^else\s*:?\s*$/.test(t)) {
          const l = execLines[pi];
          pi++;
          branches.push({ cond: null, line: l, body: parseBlock(l.indent) });
          break;
        } else break;
      }
      return { kind: 'if', branches };
    }
    function parseFor(header) {
      const m = header.text.match(/^for\s+([A-Za-z_]\w*)\s+in\s+range\s*\(([^)]*)\)\s*:?\s*$/);
      if (!m) throw new Error(`第 ${header.idx + 1} 行：for 语句格式应为 for 变量 in range(起, 止):`);
      pi++;
      const body = parseBlock(header.indent);
      return { kind: 'for', line: header, var: m[1], args: m[2].split(',').map(x => x.trim()).filter(Boolean), body };
    }
    function parseWhile(header) {
      const cond = header.text.replace(/^while\s+/, '').replace(/:\s*$/, '').trim();
      if (!cond) throw new Error(`第 ${header.idx + 1} 行：while 后缺少条件表达式`);
      pi++;
      const body = parseBlock(header.indent);
      return { kind: 'while', line: header, cond, body };
    }
    const tree = parseBlock(-1);
    if (pi < execLines.length) throw new Error(`第 ${execLines[pi].idx + 1} 行：缩进层级有误，请检查代码块缩进`);

    /* ---------- 执行并录制步骤快照 ---------- */
    const vars = {};
    const out = [];
    const done = new Set();
    const skip = new Set();
    const steps = [];
    let prevSnapVars = {};
    const sameVal = (a, b) => (typeof a === 'object' ? JSON.stringify(a) === JSON.stringify(b) : a === b);

    const snapshot = extra => {
      const hot = [], fresh = [];
      Object.keys(vars).forEach(k => {
        if (!(k in prevSnapVars)) fresh.push(k);
        else if (!sameVal(prevSnapVars[k], vars[k])) hot.push(k);
      });
      const s = Object.assign({
        cur: -1, done: [...done], skip: [...skip],
        vars: JSON.parse(JSON.stringify(vars)), hot, fresh,
        out: [...out], cond: null, loop: null, desc: ''
      }, extra);
      prevSnapVars = JSON.parse(JSON.stringify(vars));
      steps.push(s);
    };

    function skipStmt(st) {
      skip.add(st.line.idx);
      if (st.body) st.body.forEach(skipStmt);
    }
    function execBlock(stmts) { stmts.forEach(execStmt); }
    function execStmt(st) {
      if (st.kind === 'if') execIf(st);
      else if (st.kind === 'for') execFor(st);
      else if (st.kind === 'while') execWhile(st);
      else execSimple(st.line);
    }

    function execSimple(line) {
      const t = line.text;
      /* print 输出语句 */
      const pm = t.match(/^print\s*\((.*)\)\s*$/s);
      if (pm) {
        const vals = self.splitArgs(pm[1]).map(p => self.evalExpr(p, vars));
        const text = vals.map(v => self.rawVal(v)).join(' ');
        out.push(text);
        done.add(line.idx);
        snapshot({ cur: line.idx, desc: `第 ${line.idx + 1} 行：调用 print 输出 <b class="c-op">${esc(text)}</b>。` });
        return;
      }
      /* 复合赋值 += -= *= /= */
      const am = t.match(/^([A-Za-z_]\w*)\s*(\+=|-=|\*=|\/=)\s*(.+)$/);
      if (am) {
        const name = am[1], op = am[2], rhs = am[3];
        if (!(name in vars)) throw new Error(`第 ${line.idx + 1} 行：变量 ${name} 尚未赋值，不能使用 ${op}`);
        const old = vars[name], rv = self.evalExpr(rhs, vars);
        let nv;
        if (op === '+=') nv = old + rv;
        else if (op === '-=') nv = old - rv;
        else if (op === '*=') nv = old * rv;
        else nv = old / rv;
        vars[name] = nv;
        done.add(line.idx);
        snapshot({
          cur: line.idx,
          desc: `第 ${line.idx + 1} 行：<b class="c-op">${esc(name)} ${op} ${esc(rhs)}</b>，即 ${esc(name)} = ${esc(self.fmtVal(old))} ${op.slice(0, 1)} ${esc(self.fmtVal(rv))} = <b class="c-op">${esc(self.fmtVal(nv))}</b>。`
        });
        return;
      }
      /* 普通赋值 = */
      const sm = t.match(/^([A-Za-z_]\w*)\s*=\s*(.+)$/);
      if (sm) {
        const name = sm[1], rhs = sm[2];
        const val = self.evalExpr(rhs, vars);
        const isSimple = !/[+\-*/%()]/.test(rhs);
        const subst = isSimple ? null : self.substExpr(rhs, vars);
        vars[name] = val;
        done.add(line.idx);
        const desc = isSimple
          ? `第 ${line.idx + 1} 行：赋值 <b class="c-op">${esc(name)} = ${esc(self.fmtVal(val))}</b>。`
          : `第 ${line.idx + 1} 行：计算 <b class="c-op">${esc(name)} = ${esc(rhs)} = ${esc(subst)} = ${esc(self.fmtVal(val))}</b>。`;
        snapshot({ cur: line.idx, desc });
        return;
      }
      /* 裸表达式（仅做语法校验） */
      self.evalExpr(t, vars);
      done.add(line.idx);
      snapshot({ cur: line.idx, desc: `第 ${line.idx + 1} 行：执行语句 <b class="c-op">${esc(t)}</b>。` });
    }

    function execIf(st) {
      let chosen = -1;
      st.branches.forEach((br, bi) => {
        if (chosen >= 0) { skipStmt({ line: br.line, body: br.body }); return; }
        if (br.cond === null) {
          done.add(br.line.idx);
          snapshot({ cur: br.line.idx, desc: `前面条件均不成立，进入 else 分支。` });
          chosen = bi;
          execBlock(br.body);
          return;
        }
        const ev = self.evalExpr(br.cond, vars);
        const truth = self.truthy(ev);
        const sub = self.substExpr(br.cond, vars);
        if (truth) {
          done.add(br.line.idx);
          snapshot({
            cur: br.line.idx,
            cond: `${sub} = ${self.tf(truth)}`,
            desc: `第 ${br.line.idx + 1} 行：判断条件 <b class="c-op">${esc(br.cond)}</b> → ${esc(sub)} = <b class="c-op">${self.tf(truth)}</b>，条件成立，执行该分支。`
          });
          chosen = bi;
          execBlock(br.body);
        } else {
          skip.add(br.line.idx);
          br.body.forEach(skipStmt);
          snapshot({
            cur: br.line.idx,
            cond: `${sub} = ${self.tf(truth)}`,
            desc: `第 ${br.line.idx + 1} 行：判断条件 <b class="c-op">${esc(br.cond)}</b> → ${esc(sub)} = <b class="c-op">${self.tf(truth)}</b>，条件不成立，跳过该分支。`
          });
        }
      });
    }

    function execFor(st) {
      const arr = self.evalRange(st.args, vars);
      const total = arr.length;
      arr.forEach((v, k) => {
        vars[st.var] = v;
        done.add(st.line.idx);
        snapshot({
          cur: st.line.idx,
          loop: `第 ${k + 1}/${total} 轮 · 循环变量 ${st.var} = ${self.fmtVal(v)}`,
          desc: `第 ${st.line.idx + 1} 行：进入第 ${k + 1}/${total} 轮循环，<b class="c-op">${esc(st.var)} = ${esc(self.fmtVal(v))}</b>。`
        });
        execBlock(st.body);
      });
      if (total === 0) {
        done.add(st.line.idx);
        snapshot({ cur: st.line.idx, loop: 'range 为空，循环体执行 0 轮', desc: `range 序列为空，循环体不执行。` });
      }
    }

    function execWhile(st) {
      let iter = 0;
      for (;;) {
        if (iter > 100) throw new Error('while 循环已超过 100 轮，可能是死循环，演示已终止，请检查循环条件。');
        const ev = self.evalExpr(st.cond, vars);
        const truth = self.truthy(ev);
        const sub = self.substExpr(st.cond, vars);
        done.add(st.line.idx);
        snapshot({
          cur: st.line.idx,
          cond: `${sub} = ${self.tf(truth)}`,
          desc: truth
            ? `第 ${st.line.idx + 1} 行：条件 <b class="c-op">${esc(st.cond)}</b> → ${esc(sub)} = <b class="c-op">True</b>，进入循环体。`
            : `第 ${st.line.idx + 1} 行：条件 <b class="c-op">${esc(st.cond)}</b> → ${esc(sub)} = <b class="c-op">False</b>，退出循环。`
        });
        if (!truth) break;
        execBlock(st.body);
        iter++;
      }
    }

    execBlock(tree);
    snapshot({ cur: -1, desc: `程序执行完毕：共输出 ${out.length} 行结果，变量状态已全部记录在左侧监控面板。` });
    return { meta, steps };
  },

  /* ==================== 画布渲染 ==================== */
  _labelMap: {
    seq: '顺序结构 · 逐行执行',
    if: '分支结构 · if-elif-else 判断',
    for: 'for 循环 · range 遍历',
    while: 'while 循环 · 条件循环'
  },
  codeBlock(meta, snap) {
    const doneSet = snap.done, skipSet = snap.skip;
    return meta.map(m => {
      if (m.blank) return `<div class="l" style="padding:0 8px;opacity:.35"> </div>`;
      let cls = '', style = 'padding:0 8px';
      if (snap.cur === m.idx) cls = 'cur';
      else if (doneSet.indexOf(m.idx) >= 0) cls = 'done';
      else if (skipSet.indexOf(m.idx) >= 0) style = 'padding:0 8px;opacity:.3';
      const body = m.comment ? `<span class="cm">${esc(m.raw)}</span>` : this.highlightLine(m.raw);
      return `<div class="l ${cls}" style="${style}">${body}</div>`;
    }).join('');
  },
  varPanel(vars, hot, fresh) {
    const keys = Object.keys(vars);
    if (!keys.length) return `<div class="ps-empty">（尚未执行，暂无变量）</div>`;
    return keys.map(k => {
      const v = vars[k];
      const cls = hot.indexOf(k) >= 0 ? 'hot' : (fresh.indexOf(k) >= 0 ? 'var-new' : '');
      return `<div class="var-pill ${cls}">
        <span class="vp-name">${esc(k)}</span>
        <span class="vp-eq">=</span>
        <span class="vp-val">${this.fmtVal(v)}</span>
        <span class="vp-type">${this.typeOf(v)}</span>
      </div>`;
    }).join('');
  },
  consoleOut(out) {
    if (!out.length) return `<span style="opacity:.4">（暂无输出）</span>`;
    return out.map(l => `<div class="cl write-in">${esc(l)}</div>`).join('');
  },
  renderStep(i) {
    const run = this._run;
    const s = run.steps[i];
    const label = this._labelMap[this.currentSub] || 'Python 程序执行';
    $('#stage').innerHTML = `<div class="pystruct-wrap">
      <div class="stage-hd" style="margin-bottom:4px"><span>${label}</span><span class="state">第 ${i + 1}/${run.steps.length} 步</span></div>
      <div class="code-block ps-code">${this.codeBlock(run.meta, s)}</div>
      ${s.cond ? `<div class="ps-banner"><span class="ps-cond">条件：${esc(s.cond)}</span></div>` : ''}
      ${s.loop ? `<div class="ps-banner"><span class="ps-loop">${esc(s.loop)}</span></div>` : ''}
      <div class="ps-cols">
        <div class="ps-panel">
          <div class="zone-label">变量监控面板（实时）</div>
          <div class="var-rack">${this.varPanel(s.vars, s.hot, s.fresh)}</div>
        </div>
        <div class="ps-panel">
          <div class="zone-label">控制台输出</div>
          <div class="console ps-console">${this.consoleOut(s.out)}</div>
        </div>
      </div>
    </div>`;
  },
  initStage() {
    const code = this._code || this.PRESETS[this.currentSub] || this.PRESETS.seq;
    this._code = code;
    const meta = code.split(/\r?\n/).map((raw, idx) => ({
      raw, text: raw.trim(), idx, blank: raw.trim() === '', comment: raw.trim().startsWith('#')
    }));
    const label = this._labelMap[this.currentSub] || 'Python 程序执行';
    $('#stage').innerHTML = `<div class="pystruct-wrap">
      <div class="stage-hd" style="margin-bottom:4px"><span>${label}</span><span class="state">准备就绪</span></div>
      <div class="code-block ps-code">${meta.map(m =>
        `<div class="l" style="padding:0 8px">${m.blank ? ' ' : this.highlightLine(m.raw)}</div>`).join('')}</div>
      <div class="ps-cols">
        <div class="ps-panel">
          <div class="zone-label">变量监控面板（实时）</div>
          <div class="var-rack"><div class="ps-empty">（点击「下一步」或「自动演示」开始执行）</div></div>
        </div>
        <div class="ps-panel">
          <div class="zone-label">控制台输出</div>

  /* ---------- 核心操作 ---------- */
  doOp(opId){
    const meta=this.meta();

    const input=$('#ds-val');

      if(!raw){

      const before=this._data.length;

      this._stepNo++;

      const before=this._data.length+1, after=this._data.length;

  /* ================= 自定义构建状态 ================= */
  ensureState() {

  findNode(id) { return this._t.nodes.find(n => n.id === id); },
  nodeByLabel(lbl) { return this._t.nodes.find(n => n.label === lbl); },
  newNode(label) {
    const n = { id: this._t.nextId++, label, left: null, right: null, parent: null, x: 0, y: 0, depth: 0 };
    this._t.nodes.push(n);
    return n;

  layout() {
    const t = this._t;
    if (!t.rootId) { t.nodes.forEach(n => { n.x = 400; n.y = 260; }); return; }
    const assign = (id, depth, minX, maxX) => {
      const n = this.findNode(id);
      if (!n) return;
      n.depth = depth;
      n.x = (minX + maxX) / 2;
      n.y = 70 + depth * 145;
      if (n.left != null)  assign(n.left,  depth + 1, minX, n.x);
      if (n.right != null) assign(n.right, depth + 1, n.x, maxX);
    };
    assign(t.rootId, 0, 70, 730);
  },
  preset() {
    const t = this._t;
    const mk = label => { const n = this.newNode(label); return n.id; };
    const A = mk('A'), B = mk('B'), C = mk('C'), D = mk('D'), E = mk('E');
    t.rootId = A;
    const link = (p, c, side) => {
      const pn = this.findNode(p), cn = this.findNode(c);
      cn.parent = p;
      if (side === 'L') pn.left = c; else pn.right = c;
    };
    link(A, B, 'L'); link(A, C, 'R'); link(B, D, 'L'); link(B, E, 'R');
    t.selected = null;
    this.layout();
  },

    this._t = { nodes: [], rootId: null, selected: null, nextId: 1 };

  roleText(id, side) {
    const n = this.findNode(id);
    if (id === this._t.rootId) return '根节点';
    const p = this.findNode(n.parent);
    const leaf = (n.left == null && n.right == null);
    return `${p.label} 的${side === 'L' ? '左' : '右'}子节点${leaf ? '（叶子）' : ''}`;
  },

  /* ================= 遍历事件（由当前结构实际计算） ================= */
  genRecursiveEvents(kind) {
    const visited = [], events = [];
    const walk = (id, parentId, side) => {
      if (id == null) return;
      const n = this.findNode(id);
      if (kind === 'pre')  { visited.push(id); events.push({ curId: id, parentId, side, visited: [...visited] }); }
      walk(n.left, id, 'L');
      if (kind === 'in')   { visited.push(id); events.push({ curId: id, parentId, side, visited: [...visited] }); }
      walk(n.right, id, 'R');
      if (kind === 'post') { visited.push(id); events.push({ curId: id, parentId, side, visited: [...visited] }); }
    };
    walk(this._t.rootId, null, null);
    return events;
  },
  genLevelEvents() {
    const visited = [], queue = [this._t.rootId], events = [];
    while (queue.length) {
      const cur = queue.shift();
      visited.push(cur);
      const n = this.findNode(cur), newly = [];
      if (n.left != null)  { queue.push(n.left);  newly.push(n.left); }
      if (n.right != null) { queue.push(n.right); newly.push(n.right); }
      events.push({ curId: cur, parentId: n.parent, side: null, visited: [...visited], queue: [...queue], newly });
    }
    return events;
  },

  /* ================= 遍历模式画布 ================= */
  renderWalk(opts) {
    const meta = this.subMeta();
    const visited = opts.visited || [], curId = opts.curId, done = !!opts.done;
    const queue = opts.queue || [], vis = new Set(visited);
    const t = this._t;

    let head = `<div class="stage-hd" style="margin-bottom:4px;line-height:1.2;font-size:clamp(12px,1.6vw,14px)">
      <span>二叉树 · ${meta.name}</span><span class="state">${vis.size}/${t.nodes.length}</span></div>`;
    head += `<div class="step-title" style="margin-bottom:4px;padding:3px 10px;line-height:1.3">
      <span class="st-dot"></span>${done ? '遍历完成' : '节点访问状态'}</div>`;
    let svg = `<div class="svg-box" style="margin-bottom:0;display:flex;justify-content:center;background:var(--surface-2);flex:1;min-height:0;overflow:hidden">
      <svg viewBox="0 0 800 520" preserveAspectRatio="xMidYMid meet" style="width:100%;height:100%">`;

    t.nodes.forEach(n => {
      [n.left, n.right].forEach(c => {
        if (c == null) return;
        const m = this.findNode(c);
        const both = vis.has(n.id) && vis.has(c);
        svg += `<line x1="${n.x}" y1="${n.y}" x2="${m.x}" y2="${m.y}"
          stroke="${both ? '#22C55E' : '#E2E8F0'}" stroke-width="3" stroke-linecap="round"/>`;
      });
    });

    t.nodes.forEach(n => {
      let state = 'un';
      if (curId === n.id) state = 'cur';
      else if (vis.has(n.id)) state = 'done';
      else if (queue.includes(n.id)) state = 'queued';
      const st = {
        un:     { f: '#F1F5F9', s: '#CBD5E1', t: '#64748B' },
        cur:    { f: '#F59E0B', s: '#D97706', t: '#fff' },
        done:   { f: '#22C55E', s: '#16A34A', t: '#fff' },
        queued: { f: '#E0F2FE', s: '#38BDF8', t: '#0369A1' }
      }[state];
      if (state === 'cur')
        svg += `<circle cx="${n.x}" cy="${n.y}" r="36" fill="#F59E0B" opacity="0.15" style="animation:pop .3s ease-out"/>`;
      svg += `<circle cx="${n.x}" cy="${n.y}" r="26" fill="${st.f}" stroke="${st.s}" stroke-width="3"/>`;
      svg += `<text x="${n.x}" y="${n.y + 7}" text-anchor="middle" font-size="clamp(13px,1.8vw,17px)" font-weight="700" fill="${st.t}">${esc(n.label)}</text>`;
    });
    svg += `</svg></div>`;

    let side = '';
    if (!done) {
      side += `<div class="exp-inline" style="margin:0 0 6px;padding:6px 10px;line-height:1.5">`;
      if (curId == null) {
        side += `<span class="op">规则</span><span class="term done">${this.typeChars(meta.rule)}</span><span class="caret pen"></span>`;
      } else {
        const node = this.findNode(curId);
        side += `<span class="op">当前</span><span class="term cur">访问 ${esc(node.label)}</span>`;
        if (opts.role) side += `<span class="op">· ${opts.role}</span>`;
        if (opts.extra) side += `<span class="op">→</span><span class="term done">${opts.extra}</span>`;
      }
      side += `</div>`;
    }

    side += `<div class="zone-label">访问序列</div><div class="order-rack" style="margin-bottom:6px;flex-wrap:wrap">`;
    if (visited.length === 0) {
      side += `<span style="color:#CBD5E1;font-size:clamp(12px,1.6vw,14px)">（尚未访问）</span>`;
    } else {
      visited.forEach((id, i) => {
        const n = this.findNode(id);
        const cls = done ? 'chip-done' : (id === curId ? 'chip-cur' : 'chip-done');
        side += `<span class="order-chip ${cls} write-in" style="animation-delay:${i * 0.08}s">${esc(n.label)}</span>`;
      });
    }
    side += `</div>`;

    if (meta.kind === 'level') {
      side += `<div class="zone-label">队列（队首 → 队尾）</div>
        <div class="queue-area" style="min-height:24px;padding:4px 8px;gap:5px;overflow:visible;margin-bottom:6px;flex-wrap:wrap">`;
      if (queue.length === 0) side += `<span style="color:#94A3B8;font-size:clamp(12px,1.5vw,14px)">（空队列）</span>`;
      else queue.forEach((id, i) => {
        const n = this.findNode(id);
        side += `<span class="chip cy write-in" style="padding:clamp(5px,1vw,8px) clamp(11px,1.6vw,14px);font-size:clamp(13px,1.7vw,15px);animation-delay:${i * 0.08}s">${esc(n.label)}</span>`;
      });
      side += `</div>`;
    }

    side += `<div class="legend" style="margin-top:2px;line-height:1.6;font-size:clamp(12.5px,1.6vw,14.5px)">
      <span style="color:#94A3B8">● 未访问</span>　<span style="color:#F59E0B">● 当前</span>
      <span style="color:#22C55E">● 已访问</span>${meta.kind === 'level' ? '　<span style="color:#38BDF8">● 排队中</span>' : ''}
    </div>`;

    if (done) {
      const seq = visited.map(v => this.findNode(v).label).join(' · ');
      side += `<div class="write-result" style="margin-top:8px;padding:clamp(8px,1.4vw,12px) clamp(14px,2vw,18px);line-height:1.5;font-size:clamp(15px,2.1vw,19px)">${meta.name}结果：[${seq}]</div>`;
    }

    $('#stage').innerHTML = `<div class="tree-stage" style="display:flex;flex-direction:column;height:100%">
      ${head}
      <div style="display:flex;gap:clamp(10px,1.6vw,16px);flex:1;min-height:0;align-items:stretch">
        <div style="flex:1.5 1 0;min-width:0;display:flex;flex-direction:column">${svg}</div>
        <div style="flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:center">${side}</div>
      </div>
    </div>`;
  },

  /* ================= 步骤生成 ================= */
  genRecursiveSteps(kind) {
    const meta = this.subMeta();
    const events = this.genRecursiveEvents(kind);
    const steps = [];
    steps.push({
      desc: `本次演示<b>${meta.name}</b>（<b>${meta.rule}</b>）：按规则递归遍历左、右子树，点击「下一步」逐个访问节点。`,
      draw: () => { this.renderWalk({ visited: [], curId: null, queue: [], done: false }); }
    });
    events.forEach(snap => {
      const labels = snap.visited.map(v => this.findNode(v).label);
      const node = this.findNode(snap.curId);
      const role = this.roleText(snap.curId, snap.side);
      steps.push({
        desc: `<b>${meta.name}</b>（${meta.rule}）：访问${role} <b class="c-op">${esc(node.label)}</b>，当前访问序列：[${labels.join(', ')}]`,
        draw: () => { this.renderWalk({ visited: snap.visited, curId: snap.curId, queue: [], done: false, role }); }
      });
    });
    const finalIds = [...events[events.length - 1].visited];
    steps.push({
      desc: `${meta.name}完成，最终访问序列：<b class="c-op">[${finalIds.map(v => this.findNode(v).label).join(', ')}]</b>`,
      draw: () => { this.renderWalk({ visited: finalIds, curId: null, queue: [], done: true }); }
    });
    return steps;
  },
  genLevelSteps() {
    const meta = this.subMeta();
    const events = this.genLevelEvents();
    const steps = [];
    steps.push({
      desc: `本次演示<b>${meta.name}</b>：借助<b>队列</b>从上到下、从左到右逐层访问，先访问根节点 <b class="c-op">${esc(this.findNode(this._t.rootId).label)}</b>。`,
      draw: () => { this.renderWalk({ visited: [], curId: null, queue: [], done: false }); }
    });
    events.forEach((ev, i) => {
      const snap = ev;
      const node = this.findNode(snap.curId);
      const labels = snap.visited.map(v => this.findNode(v).label).join(', ');
      const newlyLabels = snap.newly.map(id => this.findNode(id).label).join('、');
      const queueLabels = snap.queue.map(id => this.findNode(id).label).join(' · ');
      steps.push({
        desc: `<b>${meta.name}</b>：取出队首${i === 0 ? '（起点）' : ''} <b class="c-op">${esc(node.label)}</b>${snap.newly.length ? `，将其未访问子节点 ${newlyLabels} 依次入队` : ''}，队列：[${queueLabels || '空'}]，访问序列：[${labels}]`,
        draw: () => { this.renderWalk({ visited: snap.visited, curId: snap.curId, queue: snap.queue, done: false, extra: newlyLabels ? `入队 ${newlyLabels}` : null }); }
      });
    });
    const finalIds = [...events[events.length - 1].visited];
    steps.push({
      desc: `层序遍历完成，最终访问序列：<b class="c-op">[${finalIds.map(v => this.findNode(v).label).join(', ')}]</b>`,
      draw: () => { this.renderWalk({ visited: finalIds, curId: null, queue: [], done: true }); }
    });
    return steps;
  },

  initStage() {
    if (!this._t || !this._t.rootId) { this.renderBuildStage(); return; }
    this.renderWalk({ visited: [], curId: null, queue: [], done: false });
    $('#stage').innerHTML += `<div class="annot" style="text-align:center;margin-top:8px;line-height:1.6">
      使用 <b>${this.subMeta().rule}</b>；点击「自动演示」或「下一步」开始遍历</div>`;
  },

  generate() {
    this.ensureState();
    const t = this._t;
    if (!t.rootId || t.nodes.length === 0) { this.steps = []; return; }
    if (this.currentSub === 'level') this.steps = this.genLevelSteps();
    else this.steps = this.genRecursiveSteps(this.currentSub);
  },

  afterSettings() {
    this.ensureState();
    const msg = (txt, ok) => {
      const m = $('#tr-msg');
      if (m) { m.textContent = txt; m.className = 'chk ' + (ok ? 'good' : 'bad'); }
    };
    const val = id => { const el = $(id); return el ? el.value.trim() : ''; };
    const clear = id => { const el = $(id); if (el) el.value = ''; };
    const t = this._t;

    const rootBtn = $('#tr-root');
    if (rootBtn) rootBtn.onclick = () => {
      const label = val('#tr-label');
      if (!label) { msg('请先输入节点名称', false); return; }
      if (t.rootId) { msg('已存在根节点：请先清空画布，或选中节点后「添加子节点」', false); return; }
      if (this.nodeByLabel(label)) { msg(`节点「${label}」已存在，名称不能重复`, false); return; }
      const n = this.newNode(label);
      t.rootId = n.id; t.selected = n.id;
      this.afterEdit();
      msg(`根节点「${label}」已创建`, true);
    };

    const childBtn = $('#tr-child');
    if (childBtn) childBtn.onclick = () => {
      const label = val('#tr-label');
      if (t.selected == null) { msg('请先在画布上点击选中一个父节点', false); return; }
      const p = this.findNode(t.selected);
      if (!p) { t.selected = null; msg('请重新选中父节点', false); return; }
      if (!label) { msg('请先输入子节点名称', false); return; }
      if (this.nodeByLabel(label)) { msg(`节点「${label}」已存在，名称不能重复`, false); return; }
      let slot = null;
      if (p.left == null) slot = 'L'; else if (p.right == null) slot = 'R';
      if (!slot) { msg(`节点「${p.label}」左右子均已满，无法再添加`, false); return; }
      const c = this.newNode(label);
      c.parent = p.id;
      if (slot === 'L') p.left = c.id; else p.right = c.id;
      t.selected = p.id;
      this.afterEdit();
      clear('#tr-label');
      msg(`已添加：${p.label} → ${c.label}（${slot === 'L' ? '左子' : '右子'}）`, true);
    };

    const pairBtn = $('#tr-pair');
    if (pairBtn) pairBtn.onclick = () => {
      const pl = val('#tr-p'), cl = val('#tr-c');
      if (!pl || !cl) { msg('请填写父节点和子节点名称', false); return; }
      const p = this.nodeByLabel(pl);
      if (!p) { msg(`未找到父节点「${pl}」`, false); return; }
      if (this.nodeByLabel(cl)) { msg(`节点「${cl}」已存在，名称不能重复`, false); return; }
      let slot = null;
      if (p.left == null) slot = 'L'; else if (p.right == null) slot = 'R';
      if (!slot) { msg(`节点「${pl}」左右子均已满`, false); return; }
      const c = this.newNode(cl);
      c.parent = p.id;
      if (slot === 'L') p.left = c.id; else p.right = c.id;
      t.selected = c.id;
      this.afterEdit();
      msg(`已添加：${p.label} → ${c.label}`, true);
    };

    const presetBtn = $('#tr-preset');
    if (presetBtn) presetBtn.onclick = () => {
      this.clearTree(); this.ensureState(); this.preset();
      this.afterEdit();
      msg('已载入示例二叉树：A(B(D,E),C)', true);
    };
    const clearBtn = $('#tr-clear');
    if (clearBtn) clearBtn.onclick = () => {
      this.clearTree(); this.afterEdit();
      msg('画布已清空，可重新构建', true);
    };
    const startBtn = $('#tr-start');
    if (startBtn) startBtn.onclick = () => {
      if (!t.rootId) { msg('请先添加根节点，或点击「示例二叉树」', false); return; }
      msg('开始遍历：点击「下一步」逐个访问节点', true);
      Engine.regenerate();
    };

    this.renderBuildStage();
  }
};

  theory() {

  /* ================= 自定义构建状态 ================= */
  ensureState() {
    if (!this._g) {
      this._g = { nodes: [], edges: [], sel: [], start: null, end: null };
      this.preset();
    }
  },
  node(id) { return this._g.nodes.find(n => n.id === id); },
  nodeByLabel(lbl) { return this._g.nodes.find(n => n.id === lbl); },
  edgeBetween(a, b) {
    if (!a || !b) return null;
    return this._g.edges.find(e => (e.a === a && e.b === b) || (e.a === b && e.b === a)) || null;
  },
  adjMap() {
    const m = {};
    this._g.nodes.forEach(n => m[n.id] = []);
    this._g.edges.forEach(e => { m[e.a].push(e.b); m[e.b].push(e.a); });
    return m;
  },
  autoPos() {
    const n = this._g.nodes.length;
    const ang = (-90 + n * 137.5) * Math.PI / 180;
    const x = 400 + 280 * Math.cos(ang);
    const y = 260 + 175 * Math.sin(ang);
    return { x: Math.max(60, Math.min(740, x)), y: Math.max(60, Math.min(460, y)) };
  },
  preset() {
    const g = this._g;
    g.nodes = [

      { id: 'C', x: 610, y: 270 },
      { id: 'D', x: 400, y: 450 }
    ];
    g.edges = [
      { a: 'A', b: 'B', w: 1, key: 'A-B' },
      { a: 'A', b: 'C', w: 2, key: 'A-C' },
      { a: 'B', b: 'D', w: 3, key: 'B-D' },
      { a: 'C', b: 'D', w: 1, key: 'C-D' }
    ];
    g.sel = []; g.start = 'A'; g.end = 'D';
  },
  clearGraph() {

  },
  populateSelects() {

    };
    fill('#gf-start', g.start);
    fill('#gf-end', g.end);
  },
  afterEdit() {

  subMeta() {
    return {
      bfs:  { name: '广度优先 BFS', rule: '队列 · 逐层扩展', ds: '队列', dsLabel: '队列（队首 → 队尾）', opVerb: '出队', kind: 'bfs' },
      dfs:  { name: '深度优先 DFS', rule: '栈 · 一路深入再回溯', ds: '栈', dsLabel: '栈（栈底 → 栈顶）', opVerb: '弹栈', kind: 'dfs' },
      path: { name: '最短路径 Dijkstra', rule: '权重 · 逐步松弛', ds: null, dsLabel: '', opVerb: '确定距离', kind: 'path' }
    }[this.currentSub];
  },
  typeChars(text) {
    return [...String(text)].map((ch, i) => `<span class="char-in" style="animation-delay:${i * 0.05}s">${esc(ch)}</span>`).join('');
  },

  /* ================= 搜索事件（由当前结构实际计算） ================= */
  genBfsEvents() {
    const g = this._g, start = g.start || g.nodes[0].id;
    const visited = [], seen = new Set([start]), queue = [{ id: start, from: null }], events = [];
    const adj = this.adjMap();
    while (queue.length) {
      const { id: cur, from } = queue.shift();
      visited.push(cur);
      const newly = [];
      adj[cur].forEach(nb => {
        if (!seen.has(nb)) { seen.add(nb); queue.push({ id: nb, from: cur }); newly.push(nb); }
      });
      events.push({ curId: cur, visited: [...visited], waiting: queue.map(q => q.id), newly, edge: from ? [from, cur] : null });
    }
    return events;
  },
  genDfsEvents() {
    const g = this._g, start = g.start || g.nodes[0].id;
    const visited = [], seen = new Set(), stack = [{ id: start, from: null }], events = [];
    const adj = this.adjMap();
    while (stack.length) {
      const { id: cur, from } = stack.pop();
      if (seen.has(cur)) continue;
      seen.add(cur);
      visited.push(cur);
      const newly = [];
      [...adj[cur]].reverse().forEach(nb => {
        if (!seen.has(nb)) { stack.push({ id: nb, from: cur }); newly.push(nb); }
      });
      events.push({ curId: cur, visited: [...visited], waiting: stack.map(q => q.id), newly, edge: from ? [from, cur] : null });
    }
    return events;
  },
  genDijkstraEvents() {
    const g = this._g, start = g.start, end = g.end;
    const adj = this.adjMap();
    const dist = {}, prev = {}, visited = [], done = new Set();
    g.nodes.forEach(n => dist[n.id] = Infinity);
    dist[start] = 0;
    const events = [{ type: 'init', visited: [], curId: null, waiting: [], dist: Object.assign({}, dist), edge: null, relaxed: [] }];
    while (true) {
      let u = null;
      g.nodes.forEach(n => {
        if (!done.has(n.id) && dist[n.id] < Infinity && (u == null || dist[n.id] < dist[u])) u = n.id;
      });
      if (u == null) break;
      done.add(u); visited.push(u);
      const relaxed = [];
      adj[u].forEach(v => {
        if (done.has(v)) return;
        const e = this.edgeBetween(u, v);
        const w = e && e.w != null && e.w !== '' ? Number(e.w) : 1;
        if (dist[u] + w < dist[v]) { dist[v] = dist[u] + w; prev[v] = u; relaxed.push({ v, d: dist[v] }); }
      });
      events.push({ type: 'visit', curId: u, visited: [...visited], waiting: [], dist: Object.assign({}, dist), edge: prev[u] ? [prev[u], u] : null, relaxed });
      if (u === end) break;
    }
    const path = [];
    if (dist[end] !== Infinity) {
      let cur = end;
      while (cur != null) { path.unshift(cur); cur = prev[cur]; }
    }
    events.push({ type: 'done', visited: [...visited], curId: null, waiting: [], dist: Object.assign({}, dist), edge: null, relaxed: [], path, total: dist[end] });
    return events;
  },

  /* ================= 构建模式画布 ================= */
  clientToSvg(ev) {
    const svg = $('#stage svg'); if (!svg) return { x: 0, y: 0 };
    const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
    const ctm = svg.getScreenCTM(); if (!ctm) return { x: 0, y: 0 };
    const p = pt.matrixTransform(ctm.inverse());
    return { x: p.x, y: p.y };
  },
  refreshBuildCoords() {
    const g = this._g;
    g.nodes.forEach(n => {
      const c = $(`#stage circle[data-node="${n.id}"]`);
      const tx = $(`#stage text[data-node="${n.id}"]`);
      if (c) { c.setAttribute('cx', n.x); c.setAttribute('cy', n.y); }
      if (tx) { tx.setAttribute('x', n.x); tx.setAttribute('y', n.y + 7); }
    });
    g.edges.forEach(e => {
      const a = this.node(e.a), b = this.node(e.b);
      const line = $(`#stage line[data-edge="${e.key}"]`);
      if (line) { line.setAttribute('x1', a.x); line.setAttribute('y1', a.y); line.setAttribute('x2', b.x); line.setAttribute('y2', b.y); }
      const gEl = $(`#stage g[data-w="${e.key}"]`);
      if (gEl) gEl.setAttribute('transform', `translate(${(a.x + b.x) / 2},${(a.y + b.y) / 2})`);
    });
  },
  renderBuildStage() {
    const g = this._g;
    let html = `<div class="stage-hd" style="margin-bottom:6px;line-height:1.2;font-size:clamp(12px,1.6vw,14px)">
      <span>自定义无向图 · 构建中</span><span class="state">${g.nodes.length} 个顶点 · ${g.edges.length} 条边</span></div>`;
    html += `<div class="step-title" style="margin-bottom:8px;padding:4px 10px;line-height:1.3">
      <span class="st-dot"></span>依次点击两个顶点选中端点，再点击「连接选中两顶点」；可拖拽顶点调整位置</div>`;
    html += `<div class="svg-box" style="margin-bottom:8px;display:flex;justify-content:center;background:var(--surface-2)">
      <svg viewBox="0 0 800 520" preserveAspectRatio="xMidYMid meet" style="width:100%">`;

    g.edges.forEach(e => {
      const a = this.node(e.a), b = this.node(e.b);
      html += `<line data-edge="${e.key}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>`;
      if (e.w != null && e.w !== '') {
        const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
        html += `<g data-w="${e.key}" transform="translate(${mx},${my})">
          <rect x="-20" y="-15" width="40" height="26" rx="10" fill="#fff" stroke="#CBD5E1" stroke-width="1.5"/>
          <text text-anchor="middle" y="4" font-size="clamp(12px,1.5vw,14px)" font-weight="700" fill="#334155">${esc(e.w)}</text></g>`;
      }
    });

    if (g.nodes.length === 0) {
      html += `<text x="400" y="260" text-anchor="middle" fill="#94A3B8" font-size="20" font-weight="600">画布为空：在上方输入名称，点击「添加顶点」开始构建</text>`;
    }

    g.nodes.forEach(n => {
      const selIdx = g.sel.indexOf(n.id);
      if (selIdx === 0) html += `<circle cx="${n.x}" cy="${n.y}" r="36" fill="none" stroke="#4F6BFF" stroke-width="3" stroke-dasharray="7 6" opacity=".65"/>`;
      if (selIdx === 1) html += `<circle cx="${n.x}" cy="${n.y}" r="36" fill="none" stroke="#8B5CF6" stroke-width="3" stroke-dasharray="7 6" opacity=".65"/>`;
      if (g.start === n.id) html += `<text x="${n.x}" y="${n.y - 40}" text-anchor="middle" font-size="13" font-weight="700" fill="#4F6BFF">起点</text>`;
      html += `<circle class="g-node" data-node="${n.id}" cx="${n.x}" cy="${n.y}" r="26"
        fill="#fff" stroke="${selIdx >= 0 ? '#4F6BFF' : '#CBD5E1'}" stroke-width="3" style="cursor:grab"/>`;
      html += `<text data-node="${n.id}" x="${n.x}" y="${n.y + 7}" text-anchor="middle" font-size="clamp(13px,1.8vw,17px)" font-weight="700" fill="#334155" style="pointer-events:none">${esc(n.id)}</text>`;
    });
    html += `</svg></div>`;

    let info = '尚未选中端点；依次点击两个顶点即可连边。';
    if (g.sel.length === 1) info = `已选端点一：<b style="color:#4F6BFF">${esc(g.sel[0])}</b>，请再点击第二个顶点。`;
    else if (g.sel.length === 2) info = `已选端点：<b style="color:#4F6BFF">${esc(g.sel[0])}</b> — <b style="color:#8B5CF6">${esc(g.sel[1])}</b>，点击「连接选中两顶点」。`;
    html += `<div class="annot" style="text-align:center;margin-bottom:6px;line-height:1.6">${info}</div>`;
    html += `<div class="zone-label">访问序列</div>
      <div class="order-rack"><span style="color:#CBD5E1;font-size:clamp(12px,1.6vw,14px)">构建完成后点击「开始遍历」，访问序列将显示在这里</span></div>`;

    $('#stage').innerHTML = `<div class="graph-stage">${html}</div>`;
    this.bindBuildInteractions();
    Engine.fitStage();
  },

  bindBuildInteractions() {
    const g = this._g;
    $$('#stage .g-node').forEach(c => {
      const id = c.dataset.node;
      let downX = 0, downY = 0, moved = false;
      c.addEventListener('pointerdown', ev => {
        downX = ev.clientX; downY = ev.clientY; moved = false;
        c.setPointerCapture(ev.pointerId);
        const n = this.node(id);
        const onMove = mv => {
          if (Math.hypot(mv.clientX - downX, mv.clientY - downY) > 5) moved = true;
          if (!moved) return;
          const p = this.clientToSvg(mv);
          n.x = Math.max(50, Math.min(750, p.x));
          n.y = Math.max(50, Math.min(470, p.y));
          this.refreshBuildCoords();
        };
        const onUp = () => {
          c.removeEventListener('pointermove', onMove);
          c.removeEventListener('pointerup', onUp);
          if (!moved) {
            if (g.sel.includes(id)) g.sel = g.sel.filter(x => x !== id);
            else { g.sel.push(id); if (g.sel.length > 2) g.sel.shift(); }
            this.afterEdit();
          }
        };
        c.addEventListener('pointermove', onMove);
        c.addEventListener('pointerup', onUp);
      });
    });
  },

  /* ================= 遍历模式画布 ================= */
  renderWalk(opts) {
    const meta = this.subMeta();
    const visited = opts.visited || [], curId = opts.curId, done = !!opts.done;
    const waiting = opts.waiting || [], vis = new Set(visited);
    const g = this._g;
    const pathSet = opts.pathKeys || new Set();

    let head = `<div class="stage-hd" style="margin-bottom:4px;line-height:1.2;font-size:clamp(12px,1.6vw,14px)">
      <span>无向图 · ${meta.name}</span><span class="state">${vis.size}/${g.nodes.length}</span></div>`;
    head += `<div class="step-title" style="margin-bottom:4px;padding:3px 10px;line-height:1.3">
      <span class="st-dot"></span>${done ? '遍历完成' : '顶点访问状态'}</div>`;
    let svg = `<div class="svg-box" style="margin-bottom:0;display:flex;justify-content:center;background:var(--surface-2);flex:1;min-height:0;overflow:hidden">
      <svg viewBox="0 0 800 520" preserveAspectRatio="xMidYMid meet" style="width:100%;height:100%">`;

    g.edges.forEach(e => {
      const a = this.node(e.a), b = this.node(e.b);
      const both = vis.has(e.a) && vis.has(e.b);
      const isCur = opts.edge && ((opts.edge[0] === e.a && opts.edge[1] === e.b) || (opts.edge[0] === e.b && opts.edge[1] === e.a));
      const inPath = pathSet.has(e.key);
      let stroke = '#E2E8F0', width = 3;
      if (inPath) { stroke = '#22C55E'; width = 6; }
      else if (isCur) { stroke = '#F59E0B'; width = 5; }
      else if (both) { stroke = '#22C55E'; }
      svg += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${stroke}" stroke-width="${width}" stroke-linecap="round"/>`;
      if (e.w != null && e.w !== '') {
        const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
        svg += `<g transform="translate(${mx},${my})">
          <rect x="-20" y="-15" width="40" height="26" rx="10" fill="#fff" stroke="${inPath ? '#22C55E' : '#CBD5E1'}" stroke-width="1.5"/>
          <text text-anchor="middle" y="4" font-size="clamp(12px,1.5vw,14px)" font-weight="700" fill="${inPath ? '#16A34A' : '#334155'}">${esc(e.w)}</text></g>`;
      }
    });

    g.nodes.forEach(n => {
      let state = 'un';
      if (curId === n.id) state = 'cur';
      else if (vis.has(n.id)) state = 'done';
      else if (waiting.includes(n.id)) state = 'waiting';
      const st = {
        un:      { f: '#F1F5F9', s: '#CBD5E1', t: '#64748B' },
        cur:     { f: '#F59E0B', s: '#D97706', t: '#fff' },
        done:    { f: '#22C55E', s: '#16A34A', t: '#fff' },
        waiting: { f: '#E0F2FE', s: '#38BDF8', t: '#0369A1' }
      }[state];
      if (state === 'cur')
        svg += `<circle cx="${n.x}" cy="${n.y}" r="36" fill="#F59E0B" opacity="0.15" style="animation:pop .3s ease-out"/>`;
      if (g.start === n.id) svg += `<text x="${n.x}" y="${n.y - 40}" text-anchor="middle" font-size="13" font-weight="700" fill="#4F6BFF">起点</text>`;
      if (meta.kind === 'path' && g.end === n.id && g.end !== g.start) svg += `<text x="${n.x}" y="${n.y - 40}" text-anchor="end" font-size="13" font-weight="700" fill="#8B5CF6" dx="18">终点</text>`;
      svg += `<circle cx="${n.x}" cy="${n.y}" r="26" fill="${st.f}" stroke="${st.s}" stroke-width="3"/>`;
      svg += `<text x="${n.x}" y="${n.y + 7}" text-anchor="middle" font-size="clamp(13px,1.8vw,17px)" font-weight="700" fill="${st.t}">${esc(n.id)}</text>`;
    });
    svg += `</svg></div>`;

    let side = '';
    if (!done && meta.kind !== 'path') {
      side += `<div class="exp-inline" style="margin:0 0 6px;padding:6px 10px;line-height:1.5">`;
      if (curId == null) {
        side += `<span class="op">规则</span><span class="term done">${this.typeChars(meta.rule)}</span><span class="caret pen"></span>`;
      } else {
        side += `<span class="op">${meta.ds}操作</span><span class="term cur">${meta.opVerb} ${esc(curId)}</span>`;
        if (opts.extra) side += `<span class="op">→</span><span class="term done">${opts.extra}</span>`;
      }
      side += `</div>`;
    }

    side += `<div class="zone-label">访问序列</div><div class="order-rack" style="margin-bottom:6px;flex-wrap:wrap">`;
    if (visited.length === 0) {
      side += `<span style="color:#CBD5E1;font-size:clamp(12px,1.6vw,14px)">（尚未访问）</span>`;
    } else {
      visited.forEach((id, i) => {
        const cls = done ? 'chip-done' : (id === curId ? 'chip-cur' : 'chip-done');
        side += `<span class="order-chip ${cls} write-in" style="animation-delay:${i * 0.08}s">${esc(id)}</span>`;
      });
    }
    side += `</div>`;

    if (meta.kind === 'bfs' || meta.kind === 'dfs') {
      side += `<div class="zone-label">${meta.dsLabel}</div>
        <div class="queue-area" style="min-height:24px;padding:4px 8px;gap:5px;overflow:visible;margin-bottom:6px;flex-wrap:wrap">`;
      if (waiting.length === 0) side += `<span style="color:#94A3B8;font-size:clamp(12px,1.5vw,14px)">（空${meta.ds}）</span>`;
      else waiting.forEach((id, i) => {
        const mark = meta.kind === 'bfs'
          ? (i === 0 ? '头' : (i === waiting.length - 1 ? '尾' : ''))
          : (i === waiting.length - 1 ? '顶' : '');
        const tag = mark ? `<span style="font-size:10px;color:#fff;margin-left:3px;font-weight:700">${mark}</span>` : '';
        const topStyle = meta.kind === 'dfs' && i === waiting.length - 1 ? 'background:#8B5CF6;border:1.5px solid #8B5CF6;' : '';
        side += `<span class="chip cy write-in" style="padding:clamp(5px,1vw,8px) clamp(11px,1.6vw,14px);font-size:clamp(13px,1.7vw,15px);${topStyle}animation-delay:${i * 0.08}s">${esc(id)}${tag}</span>`;
      });
      side += `</div>`;
    }

    if (meta.kind === 'path' && opts.dist) {
      if (done) {
        side += `<div class="zone-label">最终最短距离</div><div class="order-rack" style="margin-bottom:4px;flex-wrap:wrap;gap:5px">`;
        g.nodes.forEach(n => {
          const d = opts.dist[n.id];
          const onPath = opts.path && opts.path.includes(n.id);
          side += `<span class="order-chip ${onPath?'chip-cur':'chip-done'}" style="font-size:clamp(12px,1.6vw,14px)">${esc(n.id)}：${d === Infinity ? '∞' : d}</span>`;
        });
        side += `</div>`;
      } else {
        side += `<div class="zone-label">距离表（当前最短估计距离）</div>
        <div class="tbl-wrap" style="margin-bottom:4px;overflow:hidden"><table class="tbl" style="table-layout:fixed;font-size:13px;width:100%">
        <thead><tr><th style="width:34%">顶点</th><th style="width:33%">距离</th><th style="width:33%">状态</th></tr></thead><tbody>`;
        g.nodes.forEach(n => {
          const d = opts.dist[n.id];
          const stText = vis.has(n.id) ? '已确定' : (d === Infinity ? '待访问' : '候选');
          side += `<tr><td>${esc(n.id)}</td><td>${d === Infinity ? '∞' : d}</td><td>${stText}</td></tr>`;
        });
        side += `</tbody></table></div>`;
      }
    }

    side += `<div class="legend" style="margin-top:2px;line-height:1.6;font-size:clamp(12.5px,1.6vw,14.5px)">
      <span style="color:#94A3B8">● 未访问</span>　<span style="color:#F59E0B">● 当前</span>
      <span style="color:#22C55E">● 已访问</span>${meta.kind !== 'path' ? `　<span style="color:#38BDF8">● ${meta.ds}中待访问</span>` : '　<span style="color:#22C55E">● 最短路径</span>'}
    </div>`;

    if (done) {
      if (meta.kind === 'path') {
        if (opts.path && opts.path.length) {
          side += `<div class="write-result" style="margin-top:6px;padding:clamp(6px,1.1vw,10px) clamp(12px,1.8vw,16px);line-height:1.5;font-size:clamp(13px,1.8vw,16px);text-align:center;white-space:nowrap">
            <div style="font-weight:700;margin-bottom:2px">最短路径 ${esc(g.start)} → ${esc(g.end)}</div>
            <div style="font-size:clamp(14px,2vw,18px)"><b class="c-op">${opts.path.join(' → ')}</b>　·　总权重 <b class="c-op">${opts.total}</b></div></div>`;
        } else {
          side += `<div class="write-result" style="margin-top:6px;padding:clamp(6px,1.1vw,10px) clamp(12px,1.8vw,16px);line-height:1.4;font-size:clamp(13px,1.8vw,16px);text-align:center">从 ${esc(g.start)} 无法到达 ${esc(g.end)}</div>`;
        }
      } else {
        side += `<div class="write-result" style="margin-top:6px;padding:clamp(6px,1.1vw,10px) clamp(12px,1.8vw,16px);line-height:1.4;font-size:clamp(13px,1.8vw,16px)">
          ${meta.name}结果：[${visited.join(' · ')}]</div>`;
      }
    }

    $('#stage').innerHTML = `<div class="graph-stage" style="display:flex;flex-direction:column;height:100%">
      ${head}
      <div style="display:flex;gap:clamp(10px,1.6vw,16px);flex:1;min-height:0;align-items:stretch">
        <div style="flex:1.5 1 0;min-width:0;display:flex;flex-direction:column">${svg}</div>
        <div style="flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:center;overflow:hidden">${side}</div>
      </div>
    </div>`;
  },

  /* ================= 步骤生成 ================= */
  genBfsSteps() {
    const meta = this.subMeta();
    const events = this.genBfsEvents();
    const steps = [];
    steps.push({
      desc: `本次演示<b>${meta.name}</b>：从起点 <b class="c-op">${esc(this._g.start)}</b> 出发，先访问所有相邻节点，再借助<b>队列</b>逐层向外扩展。`,
      draw: () => { this.renderWalk({ visited: [], curId: null, waiting: [], done: false }); }
    });
    events.forEach((ev, i) => {
      const snap = ev;
      const newlyLabels = snap.newly.join('、');
      const waitingLabels = snap.waiting.join(' · ');
      steps.push({
        desc: `<b>${meta.name}</b>：取出队首${i === 0 ? '（起点）' : ''} <b class="c-op">${esc(snap.curId)}</b>${snap.newly.length ? `，未访问邻居 ${newlyLabels} 依次入队` : ''}，队列：[${waitingLabels || '空'}]，访问序列：[${snap.visited.join(', ')}]`,
        draw: () => { this.renderWalk({ visited: snap.visited, curId: snap.curId, waiting: snap.waiting, edge: snap.edge, done: false, extra: newlyLabels ? `入队 ${newlyLabels}` : '' }); }
      });
    });
    const finalIds = [...events[events.length - 1].visited];
    steps.push({
      desc: `广度优先搜索完成，最终访问序列：<b class="c-op">[${finalIds.join(', ')}]</b>`,
      draw: () => { this.renderWalk({ visited: finalIds, curId: null, waiting: [], done: true }); }
    });
    return steps;
  },
  genDfsSteps() {
    const meta = this.subMeta();
    const events = this.genDfsEvents();
    const steps = [];
    steps.push({
      desc: `本次演示<b>${meta.name}</b>：从起点 <b class="c-op">${esc(this._g.start)}</b> 出发，借助<b>栈</b>沿一条路径一直深入到底，再回溯访问其他分支。`,
      draw: () => { this.renderWalk({ visited: [], curId: null, waiting: [], done: false }); }
    });
    events.forEach((ev, i) => {
      const snap = ev;
      const newlyLabels = snap.newly.join('、');
      const waitingLabels = snap.waiting.join(' · ');
      steps.push({
        desc: `<b>${meta.name}</b>：弹出栈顶${i === 0 ? '（起点）' : ''} <b class="c-op">${esc(snap.curId)}</b>${snap.newly.length ? `，邻居 ${newlyLabels} 压栈` : ''}，栈（栈底 → 栈顶）：[${waitingLabels || '空'}]，访问序列：[${snap.visited.join(', ')}]`,
        draw: () => { this.renderWalk({ visited: snap.visited, curId: snap.curId, waiting: snap.waiting, edge: snap.edge, done: false, extra: newlyLabels ? `压栈 ${newlyLabels}` : '' }); }
      });
    });
    const finalIds = [...events[events.length - 1].visited];
    steps.push({
      desc: `深度优先搜索完成，最终访问序列：<b class="c-op">[${finalIds.join(', ')}]</b>`,
      draw: () => { this.renderWalk({ visited: finalIds, curId: null, waiting: [], done: true }); }
    });
    return steps;
  },
  genPathSteps() {
    const g = this._g;
    const events = this.genDijkstraEvents();
    const steps = [];
    steps.push({
      desc: `本次演示<b>Dijkstra 最短路径</b>：从起点 <b class="c-op">${esc(g.start)}</b> 到终点 <b class="c-op">${esc(g.end)}</b>，起点距离记 0，其余顶点距离记 ∞；反复取出距离最小的未确定顶点并松弛邻边。`,
      draw: () => { this.renderWalk({ visited: [], curId: null, waiting: [], dist: events[0].dist, done: false }); }
    });
    events.forEach((ev, i) => {
      if (ev.type === 'init') return;
      if (ev.type === 'visit') {
        const relaxTxt = ev.relaxed.length
          ? `，经 <b class="c-op">${esc(ev.curId)}</b> 松弛邻边：${ev.relaxed.map(r => `${esc(r.v)} 更新为 ${r.d}`).join('、')}`
          : '，邻边无需更新';
        steps.push({
          desc: `<b>Dijkstra</b>：取出距离最小的未确定顶点 <b class="c-op">${esc(ev.curId)}</b>（距离 ${ev.dist[ev.curId]}）${relaxTxt}，已确定顺序：[${ev.visited.join(', ')}]`,
          draw: () => { this.renderWalk({ visited: ev.visited, curId: ev.curId, waiting: [], dist: ev.dist, edge: ev.edge, done: false }); }
        });
      } else if (ev.type === 'done') {
        const pathSet = new Set();
        for (let k = 0; k < ev.path.length - 1; k++) {
          const e = this.edgeBetween(ev.path[k], ev.path[k + 1]);
          if (e) pathSet.add(e.key);
        }
        steps.push({
          desc: ev.path.length
            ? `最短路径确定：<b class="c-op">${ev.path.join(' → ')}</b>，总权重 = <b class="c-op">${ev.total}</b>。`
            : `从 ${esc(g.start)} 无法到达 ${esc(g.end)}（距离为 ∞）。`,
          draw: () => { this.renderWalk({ visited: ev.visited, curId: null, waiting: [], dist: ev.dist, pathKeys: pathSet, path: ev.path, total: ev.total, done: true }); }
        });
      }
    });
    return steps;
  },

  initStage() {
    if (!this._g || this._g.nodes.length === 0) { this.renderBuildStage(); return; }
    this.renderWalk({ visited: [], curId: null, waiting: [], dist: null, done: false });
    $('#stage').innerHTML += `<div class="annot" style="text-align:center;margin-top:8px;line-height:1.6">
      使用 <b>${this.subMeta().rule}</b>；点击「自动演示」或「下一步」开始搜索</div>`;
  },

  generate() {
    this.ensureState();
    const g = this._g;
    if (g.nodes.length === 0 || !g.start) { this.steps = []; return; }
    if (this.currentSub === 'path' && !g.end) { this.steps = []; return; }
    if (this.currentSub === 'dfs') this.steps = this.genDfsSteps();
    else if (this.currentSub === 'path') this.steps = this.genPathSteps();
    else this.steps = this.genBfsSteps();
  },

  afterSettings() {
    this.ensureState();
    const g = this._g;
    const msg = (txt, ok) => {
      const m = $('#gf-msg');
      if (m) { m.textContent = txt; m.className = 'chk ' + (ok ? 'good' : 'bad'); }
    };
    const val = id => { const el = $(id); return el ? el.value.trim() : ''; };
    const clear = id => { const el = $(id); if (el) el.value = ''; };

    this.populateSelects();

    const startSel = $('#gf-start');
    if (startSel) startSel.onchange = () => { g.start = startSel.value || null; this.renderBuildStage(); };
    const endSel = $('#gf-end');
    if (endSel) endSel.onchange = () => { g.end = endSel.value || null; this.renderBuildStage(); };

    const addv = $('#gf-addv');
    if (addv) addv.onclick = () => {
      const label = val('#gf-v');
      if (!label) { msg('请先输入顶点名称', false); return; }
      if (this.nodeByLabel(label)) { msg(`顶点「${label}」已存在，名称不能重复`, false); return; }
      const pos = this.autoPos();
      g.nodes.push({ id: label, x: pos.x, y: pos.y });
      if (!g.start) g.start = label;
      if (!g.end) g.end = label;
      this.afterEdit();
      clear('#gf-v');
      msg(`顶点「${label}」已添加，可拖拽调整位置`, true);
    };

    const parseW = w => (w === '' || w == null) ? null : Number(w);
    const addEdge = (a, b, wRaw) => {
      if (!a || !b) { msg('请先选择或填写两个顶点', false); return false; }
      if (a === b) { msg('两个顶点不能是同一个', false); return false; }
      if (!this.node(a) || !this.node(b)) { msg(`顶点不存在：${!this.node(a) ? a : b}`, false); return false; }
      if (this.edgeBetween(a, b)) { msg(`边 ${a} — ${b} 已经存在`, false); return false; }
      if (wRaw !== '' && wRaw != null && isNaN(Number(wRaw))) { msg('权重必须是数字（可留空表示无权边）', false); return false; }
      const w = parseW(wRaw);
      const key = [a, b].sort().join('-');
      g.edges.push({ a, b, w, key });
      g.sel = [];
      return true;
    };

    const adde = $('#gf-adde');
    if (adde) adde.onclick = () => {
      if (g.sel.length !== 2) { msg('请先在画布上依次点击两个顶点（共两个端点）', false); return; }
      const a = g.sel[0], b = g.sel[1];
      const wRaw = val('#gf-w');
      const ok = addEdge(a, b, wRaw);
      if (ok) { this.afterEdit(); clear('#gf-w'); msg(`已添加边 ${a} — ${b}` + (wRaw ? `（权重 ${wRaw}）` : ''), true); }
    };

    const pair = $('#gf-pair');
    if (pair) pair.onclick = () => {
      const a = val('#gf-a'), b = val('#gf-b');
      const ok = addEdge(a, b, val('#gf-w2'));
      if (ok) { this.afterEdit(); clear('#gf-a'); clear('#gf-b'); clear('#gf-w2'); msg(`已添加边 ${a} — ${b}`, true); }
    };

    const preset = $('#gf-preset');
    if (preset) preset.onclick = () => {
      this.clearGraph(); this.ensureState(); this.preset();
      this.afterEdit();
      msg('已载入示例图：A-B(1)、A-C(2)、B-D(3)、C-D(1)', true);
    };
    const clearBtn = $('#gf-clear');
    if (clearBtn) clearBtn.onclick = () => {
      this.clearGraph(); this.afterEdit();
      msg('画布已清空，可重新构建', true);
    };
    const startBtn = $('#gf-startbtn');
    if (startBtn) startBtn.onclick = () => {
      if (g.nodes.length === 0) { msg('请先添加顶点，或点击「示例图」', false); return; }
      if (!g.start) { msg('请先选择遍历起点', false); return; }
      if (this.currentSub === 'path' && !g.end) { msg('最短路径模式请先选择终点', false); return; }
      msg('开始搜索：点击「下一步」逐个访问顶点', true);
      Engine.regenerate();
    };

    this.renderBuildStage();
  }
};
;;;

/* ================================================================
 * 初始化
 * ================================================================ */
renderHome();
route();
</script>
