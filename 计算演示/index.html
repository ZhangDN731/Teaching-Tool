<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>教学计算演示台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234F6BFF' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M4 17l6-6-6-6M12 19h8'/></svg>">
<style>
/* ============ 基础 & 变量 ============ */
:root{
  --bg:linear-gradient(160deg,#E7EDFF 0%,#DDEFFF 40%,#ECE9FF 100%);
  --surface:#FFFFFF;--surface-2:#F6F9FF;--surface-3:#EEF3FF;
  --accent:#4F6BFF;--accent-hover:#3D56E0;--accent-soft:rgba(79,107,255,.09);
  --cyan:#38BDF8;--green:#22C55E;--green-soft:#E8FBF0;--orange:#F59E0B;--orange-soft:#FFF4DB;
  --red:#EF4444;--red-soft:#FDEEEE;--violet:#8B5CF6;--pink:#EC4899;
  --text:#0F172A;--text-2:#334155;--text-3:#64748B;
  --border:rgba(79,107,255,.14);
  --code-bg:#161B2E;--code-line:#DFE6F5;
  --radius-lg:18px;--radius:12px;--radius-sm:8px;
  --shadow:0 3px 16px rgba(79,107,255,.07),0 1px 3px rgba(0,0,0,.03);
  --shadow-hover:0 10px 30px rgba(79,107,255,.16),0 2px 6px rgba(0,0,0,.05);
  --font:"Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--font);color:var(--text-2);background:var(--bg);background-attachment:fixed;
  font-size:clamp(14px,1.8vw,18px);
  min-height:100vh;position:relative;overflow-x:hidden;-webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(circle at 12% 18%,rgba(79,107,255,.07) 0,transparent 42%),
                   radial-gradient(circle at 88% 72%,rgba(56,189,248,.06) 0,transparent 42%);
}
.wrap{position:relative;z-index:1;max-width:1160px;margin:0 auto;padding:clamp(8px,1.5vw,14px) clamp(10px,2vw,20px) clamp(10px,2vw,18px)}
.view{display:none}
.view.active{display:block;animation:viewIn .32s ease}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ============ 按钮 / 徽章 ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:4px;
  border:1px solid var(--border);background:#fff;color:var(--text-2);
  padding:clamp(3px,.7vw,5px) clamp(7px,1.3vw,10px);border-radius:7px;
  font-size:clamp(10.5px,1.3vw,12px);font-weight:600;
  cursor:pointer;font-family:var(--font);transition:all .15s;text-decoration:none;
}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(79,107,255,.25)}
.btn.primary:hover:not(:disabled){background:var(--accent-hover);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-3)}
.btn.ghost:hover:not(:disabled){background:var(--accent-soft);color:var(--accent);border-color:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn svg{width:15px;height:15px;flex-shrink:0}

/* ============ 静态 Hero ============ */
.hero{text-align:center;margin:clamp(4px,1vw,10px) 0 clamp(16px,3vw,28px)}
.capsule{
  display:inline-flex;align-items:center;gap:7px;background:#fff;border-radius:999px;
  padding:5px 14px;box-shadow:var(--shadow);font-size:clamp(10px,1.3vw,12px);letter-spacing:1.4px;
  color:var(--accent);font-weight:700;margin-bottom:clamp(10px,2vw,16px);
}
.capsule .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.hero h1{
  font-size:clamp(22px,5vw,42px);font-weight:800;color:var(--text);letter-spacing:-.5px;line-height:1.22;
}
.hero h1 .grad{
  background:linear-gradient(90deg,#4F6BFF,#38BDF8);-webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero .subtitle{margin:clamp(6px,1.5vw,10px) auto 0;max-width:560px;color:var(--text-3);
  font-size:clamp(12px,1.8vw,14.5px);line-height:1.7}
.hero .hint-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:clamp(10px,2vw,16px)}
.hero .hint-row .pill{
  background:#fff;border:1px solid var(--border);color:var(--text-3);
  border-radius:999px;padding:4px 12px;font-size:clamp(11px,1.4vw,12.5px);font-weight:600;
}

/* ============ 区块标题 & 过滤 ============ */
.section-head{text-align:center;margin:clamp(4px,1vw,8px) 0 4px}
.section-head h2{font-size:clamp(17px,3vw,22px);font-weight:800;color:var(--text)}
.section-head p{color:var(--text-3);font-size:clamp(11.5px,1.6vw,13px);margin-top:4px}
.filters{display:flex;justify-content:center;gap:6px;margin:clamp(10px,2vw,16px) 0;flex-wrap:wrap}
.filter-btn{
  border:1px solid var(--border);background:#fff;color:var(--text-3);
  padding:clamp(5px,1.2vw,7px) clamp(11px,2vw,15px);border-radius:999px;
  font-size:clamp(11px,1.5vw,13px);font-weight:600;
  cursor:pointer;font-family:var(--font);transition:all .15s;
}
.filter-btn:hover{border-color:var(--accent);color:var(--accent)}
.filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ============ 首页卡片网格 ============ */
.grid{display:grid;grid-template-columns:1fr;gap:clamp(8px,1.5vw,12px);margin-top:4px}
.card{
  background:var(--surface);border-radius:var(--radius-lg);padding:clamp(12px,2vw,20px);
  box-shadow:var(--shadow);display:flex;flex-direction:column;position:relative;overflow:hidden;
  cursor:pointer;text-decoration:none;color:inherit;
  transition:transform .18s ease,box-shadow .18s ease;
}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover)}
.card .card-accent{position:absolute;inset:0 0 auto 0;height:3px;background:var(--card-c,#4F6BFF);opacity:.85}
.card .top{display:flex;align-items:flex-start;gap:clamp(8px,1.5vw,12px);margin-bottom:8px}
.card .icon-box{
  width:clamp(36px,5vw,44px);height:clamp(36px,5vw,44px);border-radius:12px;background:var(--card-soft,#EEF3FF);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--card-c,#4F6BFF);
}
.card .icon-box svg{width:clamp(18px,2.5vw,23px);height:clamp(18px,2.5vw,23px)}
.card .title-area{flex:1;min-width:0}
.card h3{font-size:clamp(13.5px,2vw,16px);font-weight:700;color:var(--text);display:flex;align-items:center;gap:6px;line-height:1.3}
.card h3 .tag{
  font-size:clamp(9px,1.1vw,10.5px);font-weight:700;color:#fff;background:var(--card-c,#4F6BFF);
  padding:2px 7px;border-radius:999px;letter-spacing:.3px;flex-shrink:0;
}
.card .type{font-size:clamp(10.5px,1.4vw,12px);color:var(--text-3);margin-top:3px}
.card p{font-size:clamp(11.5px,1.5vw,12.5px);color:var(--text-3);line-height:1.6;margin-bottom:10px;flex:1;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .enter{
  align-self:flex-start;display:inline-flex;align-items:center;gap:5px;
  background:var(--card-c,#4F6BFF);color:#fff;border:none;border-radius:9px;
  padding:clamp(5px,1vw,7px) clamp(10px,2vw,14px);font-size:clamp(11px,1.4vw,12.5px);font-weight:600;cursor:pointer;
}
.card .enter svg{width:12px;height:12px}
.card:hover .enter{filter:brightness(1.06)}
footer{margin-top:clamp(18px,3vw,30px);text-align:center;color:var(--text-3);font-size:clamp(11px,1.4vw,12.5px);line-height:1.8}
footer .power{font-weight:600;color:var(--text-2)}
footer a{color:var(--accent);text-decoration:none;font-weight:600}

/* ============ 模块页通用骨架 ============ */
.demo-top{
  display:flex;align-items:center;gap:clamp(6px,1vw,10px);margin-bottom:clamp(6px,1vw,10px);flex-wrap:nowrap;overflow-x:auto;
}
.back-btn{
  display:inline-flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--border);
  color:var(--text-2);border-radius:8px;padding:clamp(4px,.8vw,6px) clamp(8px,1.5vw,11px);
  font-size:clamp(10.5px,1.3vw,12px);font-weight:600;
  cursor:pointer;text-decoration:none;transition:all .15s;flex-shrink:0;
}
.back-btn:hover{color:var(--accent);border-color:var(--accent)}
.back-btn svg{width:15px;height:15px}
.demo-top .m-title{flex:1;min-width:120px}
.demo-top .m-title h2{font-size:clamp(14px,2.5vw,18px);font-weight:800;color:var(--text);line-height:1.2}
.demo-top .m-title .m-sub{font-size:clamp(10px,1.2vw,11.5px);color:var(--text-3);margin-top:1px;line-height:1.3}
.demo-top .m-badge{font-size:clamp(9px,1.1vw,10.5px);font-weight:700;color:#fff;background:var(--card-c,#4F6BFF);padding:3px 9px;border-radius:999px;flex-shrink:0}

.panel-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:clamp(12px,2vw,20px);margin-bottom:clamp(6px,1vw,8px);box-shadow:var(--shadow);
}
.panel-card > h3{
  font-size:clamp(13px,1.7vw,16px);font-weight:700;color:var(--text);display:flex;align-items:center;gap:5px;margin-bottom:4px;
}
.panel-card > h3 .n{
  width:clamp(15px,1.8vw,18px);height:clamp(15px,1.8vw,18px);border-radius:5px;background:var(--accent-soft);color:var(--accent);
  display:inline-flex;align-items:center;justify-content:center;font-size:clamp(9px,1.1vw,10.5px);flex-shrink:0;
}
.panel-card .desc{font-size:clamp(10.5px,1.3vw,12px);color:var(--text-3);line-height:1.5;margin-bottom:clamp(4px,.8vw,6px)}
.panel-card .desc b{color:var(--accent)}

/* 理论卡可折叠 */
details.theory{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface-2);padding:clamp(6px,1vw,9px) clamp(8px,1.5vw,12px);margin-bottom:clamp(6px,1vw,10px)}
details.theory summary{
  cursor:pointer;font-size:clamp(11.5px,1.5vw,13px);font-weight:700;color:var(--text);list-style:none;
  display:flex;align-items:center;gap:8px;
}
details.theory summary::before{
  content:"";width:7px;height:7px;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);
  transform:rotate(-45deg);transition:.2s;margin-right:2px;flex-shrink:0;
}
details.theory[open] summary::before{transform:rotate(45deg)}
details.theory .t-body{padding-top:10px;font-size:clamp(12px,1.6vw,13.5px);color:var(--text-2);line-height:1.85;border-top:1px dashed var(--border);margin-top:10px}
details.theory .t-body .rule{background:#fff;border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:7px 12px;margin-bottom:7px}
details.theory .t-body code,.mono{font-family:var(--mono);background:var(--surface-3);padding:1px 6px;border-radius:5px;color:var(--accent);font-size:clamp(11.5px,1.4vw,12.5px)}
details.theory .t-body table{width:100%;border-collapse:collapse;margin:8px 0;font-size:clamp(11px,1.4vw,12.5px)}
details.theory .t-body th,details.theory .t-body td{border:1px solid var(--border);padding:5px 8px;text-align:center}
details.theory .t-body td.l{text-align:left}
details.theory .t-body .note{font-size:clamp(10.5px,1.3vw,12px);color:var(--text-3);line-height:1.7;margin-top:6px}
details.theory .t-body th{background:var(--surface-3);color:var(--accent);font-weight:700}

/* 设置区 */
.settings-row{display:flex;gap:clamp(6px,1.2vw,10px);flex-wrap:wrap;align-items:flex-end}
.setting{display:flex;flex-direction:column;gap:3px}
.setting label{font-size:clamp(10px,1.2vw,11px);font-weight:600;color:var(--text-3)}
.inline-setting{flex-shrink:0;margin-right:4px}
.inline-setting .settings-row{gap:4px}
.inline-setting select,.inline-setting input{
  padding:3px 6px;min-height:26px;font-size:clamp(10px,1.2vw,11px);border-radius:6px;
}
.setting select,.setting input{
  padding:clamp(3px,.7vw,5px) clamp(5px,1vw,8px);border:1.5px solid var(--border);border-radius:7px;
  font-size:clamp(11px,1.4vw,12.5px);font-family:var(--font);background:#fff;outline:none;color:var(--text);
  min-height:clamp(26px,3.5vw,32px);transition:border-color .15s;
}
.setting select:focus,.setting input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.setting input[type=number]{width:clamp(90px,14vw,120px)}
.setting .val{font-family:var(--mono);font-size:clamp(11px,1.4vw,13px);color:var(--text-3);margin-top:3px}

/* 演示画布 */
.stage{background:var(--surface-2);border:1px dashed var(--border);border-radius:var(--radius);padding:clamp(5px,1vw,8px) clamp(7px,1.2vw,10px);margin:2px 0 5px;position:relative;min-height:95px}
.stage .stage-hd{
  display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;
  font-size:clamp(13px,1.7vw,16px);font-weight:700;color:var(--text-2);margin-bottom:6px;letter-spacing:.3px;
}
.stage .stage-hd .state{color:var(--text-3);font-weight:600;font-family:var(--mono)}

/* ===== 演示页一屏布局：固定视口高度，舞台弹性占满，其余区块固定不伸缩，始终一屏不滚动 ===== */
#view-demo.active{height:100vh;display:flex;flex-direction:column;overflow:hidden;padding-bottom:0}
#view-demo.active .demo-top{flex:none}
#view-demo.active details.theory{flex:none;max-height:26vh;overflow:auto}
#view-demo.active .sub-tabs{flex:none}
#view-demo.active .panel-card{flex:none;min-height:0;display:flex;flex-direction:column;margin-bottom:0;overflow:hidden;padding:clamp(4px,.8vw,7px) clamp(8px,1.4vw,11px)}
#view-demo.active .ctrl{flex:none;margin:0}
#view-demo.active .stage{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;margin:clamp(4px,.8vw,7px) 0;padding:clamp(6px,1vw,10px)}
#view-demo.active .stepbar{flex:none;margin:2px 0}
#view-demo.active .explain{flex:none;max-height:clamp(40px,6vh,56px);overflow:hidden}
/* 演示模式：外层容器清空内边距，面板卡片压缩留白，保证 100vh 内无文档级溢出 */
body.demo{overflow:hidden}
body.demo .wrap{padding:0;max-width:none;margin:0}
body.demo .panel-card{padding:clamp(5px,.9vw,8px) clamp(8px,1.4vw,11px)}
/* 设置区容器允许收缩并换行，避免长提示文字把控制条横向撑爆 */
#view-demo.active #settingsRowWrap{flex:1 1 auto;min-width:0;flex-shrink:1;margin-right:0}
#view-demo.active #settingsRow{min-width:0}
#view-demo.active #settingsRowWrap .chk{max-width:100%;white-space:normal;line-height:1.5}
/* 树 / 图模块紧凑化：约束 SVG 高度，压缩序列条、图例、距离表与结果条间距 */
#stage .graph-stage .svg-box,#stage .tree-stage .svg-box{max-height:clamp(150px,26vh,240px);margin-bottom:3px}
#stage .graph-stage .svg-box svg,#stage .tree-stage .svg-box svg{max-height:clamp(150px,26vh,240px);width:100%;height:auto;margin:0 auto}
#stage .graph-stage .svg-box,#stage .graph-stage .svg-box svg{max-height:clamp(90px,13vh,150px)}
#stage .graph-stage .order-rack,#stage .tree-stage .order-rack{min-height:16px;margin-bottom:3px}
#stage .graph-stage .zone-label{margin-bottom:1px}
#stage .graph-stage .tbl td,#stage .graph-stage .tbl th{padding:clamp(7px,1.1vw,10px) clamp(8px,1.3vw,12px)}
#stage .graph-stage .legend,#stage .tree-stage .legend{margin-top:1px;line-height:1.4}
#stage .graph-stage .write-result{margin-top:2px;padding:clamp(5px,.9vw,8px) clamp(14px,2vw,18px)}
#stage .graph-stage .queue-area{min-height:28px;margin-bottom:3px;padding:clamp(4px,.8vw,7px) clamp(8px,1.3vw,12px)}
/* 舞台内容适配层：模块内容置于 .stage-fit-inner，由 Engine 测量后等比缩放居中 */
.stage-fit{flex:1;min-height:0;overflow:hidden;position:relative;width:100%}
.stage-fit-inner{transform-origin:center center;transition:transform .18s ease;width:100%;display:flex;flex-direction:column;align-items:stretch;gap:clamp(6px,1.2vw,12px)}
/* 弹性铺满：固定标题/标签/图例不伸缩，模块根容器弹性铺满 */
.stage-fit-inner > .stage-hd,.stage-fit-inner > .step-title,.stage-fit-inner > .annot,
.stage-fit-inner > .zone-label,.stage-fit-inner > .legend,.stage-fit-inner > .queue-area,.stage-fit-inner > .order-rack{flex:0 0 auto}
/* 模块根容器铺满舞台，内部内容弹性分布（仅纵向容器） */
.stage-fit-inner .base-stage,
.stage-fit-inner .mm-wrap,.stage-fit-inner .excel-stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:center;width:100%}
.stage-fit-inner .mm-step{flex:none;width:100%;display:flex;flex-direction:column;justify-content:center}
.stage-fit-inner .pystruct-wrap,.stage-fit-inner .ps-code,
.stage-fit-inner .tree-stage,.stage-fit-inner .graph-stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:center;width:100%}
/* 单卡片类按内容自然高度（避免拉伸留白），由 fitStage 统一缩放居中 */
.stage-fit-inner .enc-card{flex:none;width:100%}
.stage-fit-inner .write-result,.stage-fit-inner .result-box,.stage-fit-inner .console,.stage-fit-inner .code-block,
.stage-fit-inner .mm-result,.stage-fit-inner .mm-formula,.stage-fit-inner .mm-conv{flex:none;display:flex;flex-direction:column;justify-content:center;width:100%}
/* grid 容器保持原始grid布局，不被改成flex（IP/Excel/Python网格/字符编码网格/8位二进制） */
.stage-fit-inner .enc-grid,.stage-fit-inner .ip-row,.stage-fit-inner .ip-info,
.stage-fit-inner .xl-grid,.stage-fit-inner .py-type-grid,.stage-fit-inner .py-cat-grid,
.stage-fit-inner .enc-bitgrid{flex:none;width:100%}
/* 横向结果条保持原始横向 flex（不被改成 column，避免链路竖排） */
.stage-fit-inner .enc-result-strip{flex:none;display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:center}
/* 横向 flex 容器保持原始横向排列（流程条/两栏/代码列/表达式行） */
.stage-fit-inner .enc-flow,.stage-fit-inner .ps-cols,.stage-fit-inner .two-col,
.stage-fit-inner .exp-inline,.stage-fit-inner .ref-tbl,.stage-fit-inner .exp-table{flex:none}
/* 画布/结构区弹性铺满 */
.stage-fit-inner .svg-box,.stage-fit-inner .ds-stack-area,.stage-fit-inner .ds-queue-area,
.stage-fit-inner .py-fn-card,.stage-fit-inner .py-fn-rack{flex:1 1 auto;min-height:0;width:100%}
/* grid布局的容器使用自然高度，不做flex弹性压缩，避免子内容溢出重叠 */
.stage-fit-inner .d2b-grid{flex:none;display:grid;width:100%}
.stage-fit-inner .b2g-list{flex:none;display:flex;flex-direction:column;width:100%}
/* ===== 舞台紧凑排版（固定px，由 fitStage 统一缩放，避免 vw 双重缩放导致内容超高） ===== */
#stage{font-size:15px !important;line-height:1.45}
#stage .stage-hd{font-size:16px !important;line-height:1.3;margin:0 0 3px}
#stage .step-title{font-size:15px !important;line-height:1.3;padding:4px 12px !important;margin:0 0 4px}
#stage .annot{font-size:14px !important;line-height:1.5 !important;margin:0 0 4px}
#stage .zone-label{font-size:13px !important;line-height:1.3;margin-bottom:3px}
#stage .exp-table{font-size:15px !important;margin:2px 0}
#stage .exp-table th,#stage .exp-table td{padding:4px 8px !important;line-height:1.3}
#stage .exp-inline{font-size:15px !important;padding:4px 10px !important;line-height:1.4 !important;margin:2px 0;gap:6px !important}

/* 控制条 */
.ctrl{
  display:flex;align-items:center;gap:5px;flex-wrap:nowrap;overflow-x:auto;margin:0;
  padding:clamp(3px,.6vw,5px) clamp(6px,1vw,8px);background:#fff;border:1px solid var(--border);border-radius:8px;
  -webkit-overflow-scrolling:touch;scrollbar-width:thin;
}
.ctrl::-webkit-scrollbar{height:4px}
.ctrl::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:2px}
.ctrl .grp{display:flex;gap:5px;flex-wrap:nowrap;flex-shrink:0}
.ctrl .spacer{flex:1}
.ctrl .speed{display:flex;align-items:center;gap:4px;font-size:clamp(10px,1.2vw,11.5px);color:var(--text-3);flex-shrink:0;white-space:nowrap}
.ctrl .speed span{white-space:nowrap}
.ctrl .speed button{
  border:1px solid var(--border);background:#fff;color:var(--text-3);border-radius:6px;
  padding:2px 7px;font-size:clamp(10px,1.2vw,11.5px);font-weight:700;cursor:pointer;font-family:var(--mono);
}
.ctrl .speed button.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* 步骤条 */
.stepbar{margin:5px 0 3px}
.stepbar .bar{height:5px;background:var(--surface-3);border-radius:999px;overflow:hidden}
.stepbar .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--cyan));transition:width .2s;border-radius:999px}
.stepbar .lbl{display:flex;justify-content:space-between;margin-top:3px;font-size:clamp(10px,1.2vw,11.5px);color:var(--text-3);font-family:var(--mono)}

.explain{
  background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:clamp(4px,.8vw,6px) clamp(7px,1.2vw,10px);
  font-size:clamp(10.5px,1.3vw,12px);line-height:1.5;color:var(--text-2);min-height:16px;animation:exIn .25s;
}
@keyframes exIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.explain b{color:var(--accent)}
.explain .ok{color:var(--green);font-weight:700}
.explain .c-op{color:var(--accent);font-weight:700}

/* ============ 各模块画布元素 ============ */
.chip{
  background:var(--accent);color:#fff;border-radius:7px;padding:clamp(4px,.8vw,6px) clamp(8px,1.5vw,12px);font-weight:700;
  font-family:var(--mono);font-size:clamp(13px,1.6vw,15px);flex:none;display:inline-flex;align-items:center;justify-content:center;
  animation:pop .18s;
}
.chip.g{background:var(--green)}.chip.o{background:var(--orange)}.chip.r{background:var(--red)}.chip.cy{background:var(--cyan)}.chip.v{background:var(--violet)}.chip.pk{background:var(--pink)}.chip.dim{opacity:.35;background:#C3CEEB}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.flow-line{font-family:var(--mono);font-size:clamp(13px,1.7vw,16px);margin:4px 0;display:flex;flex-wrap:wrap;align-items:center;gap:5px;line-height:1.9}
.flow-line .part{padding:2px 7px;border-radius:6px;background:#fff;border:1px solid transparent;transition:all .15s}
.flow-line .part.cur{background:var(--orange-soft);border-color:var(--orange);color:#B45309;font-weight:700}
.flow-line .part.done{background:var(--green-soft);border-color:var(--green);color:#15803D}
.flow-line .res{font-weight:700;color:var(--accent)}
.result-box{font-family:var(--mono);font-size:clamp(20px,3vw,30px);font-weight:700;color:var(--accent);background:var(--surface-3);border-radius:10px;padding:clamp(12px,2vw,20px) clamp(14px,2vw,20px);text-align:center;margin-top:10px}

/* 公式逐步 */
.fml{background:var(--code-bg);color:#8FD3FF;border-radius:10px;padding:clamp(8px,1.5vw,12px);font-family:var(--mono);font-size:clamp(13px,1.7vw,16px);line-height:1.9;overflow-x:auto}
.fml .f-line{white-space:nowrap;padding:2px 8px;border-radius:6px}
.fml .f-line.cur{background:rgba(79,107,255,.32);color:#fff}
.fml .f-line.done{opacity:.72}
.fml .hl{color:#FFD666;font-weight:700}

/* IP 二进制网格 */
.bin-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;min-width:0}
.bin-grid .bd{background:#fff;border:1px solid var(--border);border-radius:6px;text-align:center;font-family:var(--mono);font-size:clamp(13px,1.9vw,18px);font-weight:700;padding:clamp(5px,1vw,9px) 0;color:var(--text-2);transition:all .15s}
.bin-grid .bd.cur{background:var(--orange);color:#fff;border-color:var(--orange);transform:scale(1.06)}
.bin-grid .bd.mask{color:var(--accent)}
.bin-grid .bd.mask.cur{background:var(--accent)}
.bin-grid .bd.net{background:var(--green-soft);color:#15803D;border-color:var(--green)}
.bin-grid .bd.zero{color:#CBD5E1}
.bin-grid .bd.one{color:var(--accent);background:var(--accent-soft)}
.bin-grid .bd.weight{background:var(--surface-3);color:var(--accent);font-size:clamp(12px,1.5vw,13.5px);border-style:dashed}
.bin-grid .bd.and-result{background:var(--orange-soft);color:#B45309;border-color:var(--orange)}

/* 计算过程重点卡片 */
.calc-process{background:linear-gradient(135deg,#FFF8EE 0%,#FFF 100%);border:2px solid var(--orange);border-radius:12px;padding:clamp(10px,1.8vw,16px);margin:clamp(8px,1.5vw,14px) 0;position:relative;overflow:hidden}
.calc-process::before{content:'计算过程';position:absolute;top:0;right:0;background:var(--orange);color:#fff;font-size:clamp(11px,1.4vw,12.5px);font-weight:700;padding:3px 10px;border-radius:0 10px 0 10px;letter-spacing:.5px}
.calc-process .cp-label{font-size:clamp(12.5px,1.6vw,14px);color:var(--text-3);font-weight:600;margin-bottom:8px;letter-spacing:.3px}
.calc-process .cp-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-family:var(--mono);font-size:clamp(13px,1.8vw,17px);font-weight:700;line-height:2.2}
.calc-process .cp-row .w{color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:1px 6px;min-width:28px;text-align:center}
.calc-process .cp-row .w.active{background:var(--orange);color:#fff;transform:scale(1.1)}
.calc-process .cp-row .plus{color:#94A3B8;font-weight:400}
.calc-process .cp-row .eq{color:var(--accent);margin:0 4px}
.calc-process .cp-row .sum{color:var(--orange);background:#FFF4DB;border-radius:6px;padding:2px 10px;border:1.5px solid var(--orange)}
.calc-process .cp-bit-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;margin:6px 0}
.calc-process .cp-bit-grid .cb{text-align:center;font-family:var(--mono);font-weight:700;font-size:clamp(12px,1.7vw,16px);padding:clamp(4px,.9vw,7px) 0;border-radius:5px}
.calc-process .cp-bit-grid .cb.ip{background:#EEF3FF;color:#4F6BFF}
.calc-process .cp-bit-grid .cb.mk{background:#E6F9FE;color:#0891B2}
.calc-process .cp-bit-grid .cb.rs{background:#FFF4DB;color:#B45309;border:1.5px solid var(--orange)}
.calc-process .cp-bit-grid .cb.lb{background:transparent;color:var(--text-3);font-size:clamp(12px,1.5vw,13.5px);font-weight:600;padding:2px 0}
.calc-process .cp-sum-line{font-family:var(--mono);font-size:clamp(13px,1.8vw,16px);font-weight:700;color:var(--text);margin-top:8px;text-align:center;background:#fff;border-radius:8px;padding:8px;border:1px solid var(--border)}
.ip-row{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(12px,2vw,18px);margin-bottom:clamp(20px,3vw,30px);width:100%}
.ip-row .seg{background:#fff;border:1px solid var(--border);border-radius:9px;padding:clamp(28px,5vw,42px) clamp(10px,1.6vw,16px);text-align:center}
.ip-row .seg .seg-hd{font-size:clamp(14px,1.7vw,17px);color:var(--text-3);margin-bottom:clamp(14px,2.2vw,20px);font-weight:600}
.ip-row .seg.cur{background:var(--orange-soft);border-color:var(--orange)}
.ip-row .seg .val{font-family:var(--mono);font-weight:700;font-size:clamp(20px,2.8vw,28px);color:var(--text);margin-top:clamp(12px,1.8vw,18px)}
.ip-row .seg.cur .val{color:#B45309}
.ip-info{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(12px,2vw,18px);margin-bottom:clamp(16px,2.6vw,26px);width:100%}
.ip-info .ii{background:#fff;border:1px solid var(--border);border-radius:9px;padding:clamp(18px,3vw,28px) clamp(12px,1.8vw,18px);text-align:center}
.ip-info .ii .ii-hd{font-size:clamp(13px,1.6vw,15px);color:var(--text-3);font-weight:600;margin-bottom:clamp(10px,1.6vw,16px)}
.ip-info .ii .ii-val{font-family:var(--mono);font-size:clamp(18px,2.4vw,24px);font-weight:700;color:var(--accent);word-break:break-all}

/* Excel 表格 */
.xl-grid{display:grid;gap:clamp(4px,.8vw,6px);font-family:var(--mono);font-size:clamp(14px,2vw,18px);margin-bottom:clamp(8px,1.4vw,12px)}
.xl-grid .xl-cell{background:#fff;border:1px solid var(--border);border-radius:5px;display:flex;align-items:center;justify-content:center;padding:clamp(8px,1.2vw,12px) clamp(6px,1vw,10px);font-weight:600;color:var(--text-2);transition:all .15s;min-height:clamp(38px,5vh,50px)}
.xl-grid .xl-cell.hd{background:var(--surface-3);color:var(--accent);font-weight:700}
.xl-grid .xl-cell.sel{background:var(--orange-soft);border-color:var(--orange);color:#B45309}
.xl-grid .xl-cell.cur{background:var(--orange);color:#fff;border-color:var(--orange)}
.xl-grid .xl-cell.done{background:var(--green-soft);border-color:var(--green);color:#15803D}
.xl-grid .xl-cell.src{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.xl-formula{font-family:var(--mono);background:var(--code-bg);color:#8FD3FF;border-radius:8px;padding:clamp(8px,1.4vw,12px) clamp(12px,1.8vw,16px);font-size:clamp(15px,2vw,19px);margin-bottom:clamp(8px,1.4vw,12px);overflow-x:auto;width:100%;box-sizing:border-box}

/* 代码块（Python） */
.code-block{background:var(--code-bg);color:var(--code-line);border-radius:10px;padding:clamp(8px,1.5vw,12px) clamp(6px,1vw,10px);font-family:var(--mono);font-size:clamp(13px,1.7vw,16px);line-height:1.85;overflow-x:auto;margin-bottom:10px;width:100%;box-sizing:border-box}
.code-block .l{white-space:pre;padding:1px 10px;border-radius:6px;transition:all .15s}
.code-block .l.cur{background:var(--accent);color:#fff;font-weight:700}
.code-block .l.done{opacity:.55}
.code-block .kw{color:#C792EA}.code-block .fn{color:#82AAFF}.code-block .str{color:#C3E88D}.code-block .cm{color:#546E7A;font-style:italic}.code-block .num{color:#F78C6C}
.var-rack{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;min-height:38px;width:100%}
.var-pill{background:#fff;border:1px solid var(--border);border-radius:9px;padding:clamp(7px,1.1vw,10px) clamp(9px,1.4vw,13px);font-family:var(--mono);font-size:clamp(13px,1.8vw,16px);font-weight:600;animation:pop .18s;min-width:0;overflow:hidden}
.var-pill b{color:var(--accent)}
.var-pill.hot{background:var(--orange-soft);border-color:var(--orange)}
.var-pill.hot b{color:#B45309}
.console{background:#0C1120;color:#5EF2A0;font-family:var(--mono);font-size:clamp(13px,1.7vw,15px);border-radius:9px;padding:clamp(8px,1.3vw,11px) clamp(10px,1.6vw,15px);min-height:44px;white-space:pre-wrap;line-height:1.8;margin-bottom:8px;width:100%;box-sizing:border-box}
.console .cl{animation:exIn .2s;display:block;white-space:pre-wrap;word-break:break-word}

/* 栈 / 队列 */
.stack-area{display:flex;flex-direction:column-reverse;gap:6px;min-height:clamp(150px,26vw,190px);padding:clamp(12px,1.8vw,16px);background:#fff;border-radius:10px;border:1px solid var(--border);justify-content:flex-start;align-items:center;width:100%;box-sizing:border-box}
.stack-area .chip{width:clamp(58px,9vw,72px)}
.queue-area{display:flex;flex-direction:row;gap:clamp(7px,1.1vw,10px);min-height:clamp(56px,9vh,72px);align-items:center;padding:clamp(10px,1.6vw,14px);background:#fff;border-radius:10px;border:1px solid var(--border);overflow-x:auto;width:100%;box-sizing:border-box}
.queue-area .chip{flex-shrink:0}
.deque-area{display:flex;flex-direction:row;gap:6px;min-height:clamp(48px,8vw,60px);align-items:center;padding:10px;background:#fff;border-radius:10px;border:1px solid var(--border);overflow-x:auto;justify-content:center;width:100%;box-sizing:border-box}
.deque-area .chip{flex-shrink:0}
.ds-log{font-family:var(--mono);font-size:clamp(13px,1.6vw,15px);color:var(--text-3);line-height:1.8;min-height:20px;margin-top:10px;width:100%}
.ds-log b{color:var(--accent)}
.zone-label{font-size:clamp(12px,1.5vw,14px);font-weight:700;color:var(--text-3);letter-spacing:.4px;margin-bottom:6px}

/* 树 / 图 SVG */
.svg-box{background:#fff;border-radius:10px;border:1px solid var(--border);overflow:hidden;margin-bottom:10px;width:100%;box-sizing:border-box}
.svg-box svg{display:block;width:100%;height:auto}
.order-rack{display:flex;gap:6px;flex-wrap:wrap;min-height:38px;align-items:center;width:100%}
.order-rack .order-chip{background:var(--accent);color:#fff;border-radius:8px;padding:clamp(5px,1vw,8px) clamp(10px,1.6vw,14px);font-weight:700;font-family:var(--mono);font-size:clamp(13px,1.7vw,15px);animation:pop .18s}
.legend{font-size:clamp(12.5px,1.6vw,14.5px);color:var(--text-3);line-height:1.9;width:100%}
.legend b{color:var(--accent)}

/* SECTION: 严格校验与错误状态 */
.err{
  background:var(--red-soft);border:1px solid #F6C9C9;border-left:3px solid var(--red);
  border-radius:0 10px 10px 0;padding:clamp(9px,1.6vw,13px) clamp(11px,1.8vw,15px);
  font-size:clamp(13px,1.7vw,15px);color:#9B1C1C;line-height:1.75;
}
.err b{color:#7F1D1D}
.err .err-t{font-weight:700;display:flex;align-items:center;gap:6px;margin-bottom:4px}
.err code{font-family:var(--mono);background:#fff;border:1px solid #F0CFCF;border-radius:5px;padding:0 5px;color:#9B1C1C}
.ok-box{
  background:var(--green-soft);border:1px solid #BFE9CF;border-left:3px solid var(--green);
  border-radius:0 10px 10px 0;padding:clamp(8px,1.5vw,12px) clamp(11px,1.8vw,15px);
  font-size:clamp(13px,1.7vw,15px);color:#14532D;line-height:1.75;
}
.ok-box b{color:#15803D}
.setting input.bad{border-color:var(--red);background:#FFF8F8}
.chk{font-family:var(--mono);font-size:clamp(11px,1.4vw,12.5px);color:var(--text-3);margin-top:4px;min-height:16px}
.chk.bad{color:var(--red);font-weight:700}
.chk.good{color:#15803D;font-weight:700}

/* SECTION: 数据表格 */
.tbl{width:100%;border-collapse:collapse;font-size:clamp(13px,1.6vw,17px);margin:8px 0;background:#fff;border-radius:8px;overflow:hidden}
.tbl th,.tbl td{border:1px solid var(--border);padding:clamp(7px,1.1vw,10px) clamp(8px,1.3vw,12px);text-align:center;font-family:var(--mono)}
.tbl th{background:var(--surface-3);color:var(--accent);font-weight:700;font-family:var(--font)}
.tbl td.l,.tbl th.l{text-align:left;font-family:var(--font)}
.tbl tr.cur td{background:var(--orange-soft);color:#92400E;font-weight:700}
.tbl tr.done td{background:var(--green-soft);color:#166534}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* SECTION: 点阵字形 */
.dot-matrix{display:grid;gap:2px;justify-content:center;margin:8px 0}
.dot-matrix i{width:clamp(6px,1.1vw,10px);height:clamp(6px,1.1vw,10px);border-radius:2px;background:#E2E8F0;display:block}
.dot-matrix i.on{background:var(--text);border-radius:1px}
.dot-matrix i.rowhd{background:transparent}
.byte-tag{display:inline-block;font-family:var(--mono);font-size:clamp(12px,1.5vw,13px);background:var(--surface-3);color:var(--accent);border-radius:5px;padding:1px 6px;margin:2px 3px 0 0;font-weight:700}

/* SECTION: 指针 / 结构标注 */
.ptr{font-size:clamp(11.5px,1.4vw,13px);font-weight:700;letter-spacing:.3px;color:var(--violet);font-family:var(--mono);text-align:center}
.ptr.head{color:#0F766E}.ptr.tail{color:#B45309}
.struct-note{font-size:clamp(13px,1.6vw,15px);color:var(--text-3);line-height:1.8;margin-top:8px}
.struct-note b{color:var(--accent)}
.struct-note code{font-family:var(--mono);background:var(--surface-3);padding:1px 5px;border-radius:4px;color:var(--accent)}
.two-col{display:flex;gap:clamp(10px,2vw,18px);align-items:flex-start;flex-wrap:wrap}
.two-col>div{flex:1;min-width:min(100%,280px)}
.kbd-hint{display:none;font-size:clamp(10.5px,1.3vw,12px);color:var(--text-3);font-family:var(--mono)}
.kbd-hint kbd{background:var(--surface-3);border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:1px 5px;font-family:var(--mono);font-size:.95em;color:var(--text-2)}

/* 响应式 */
@media (min-width:520px){
  .grid{grid-template-columns:repeat(2,1fr)}
}
@media (min-width:800px){
  .grid{grid-template-columns:repeat(3,1fr)}
  .wrap{padding:26px 26px 40px}
  .panel-card{padding:20px 22px}
}
@media (min-width:1060px){
  .grid{grid-template-columns:repeat(4,1fr)}
}
/* 11张卡: 4列→3+4+4, 3列→4+4+3, 2列→6+5, 1列→11 均无孤行 */

/* ============ 书写动画（全模块通用手写演示体系） ============ */
/* 纸张质感画布 */
.stage.paper{
  background:#FFFEF7;
  background-image:
    linear-gradient(#E8F0FE 1px, transparent 1px),
    linear-gradient(90deg, #E8F0FE 1px, transparent 1px);
  background-size:24px 24px;
  background-position:-1px -1px;
  border:1px solid #D4DEEF;
  border-radius:12px;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.04), 0 2px 8px rgba(79,107,255,.06);
}
/* 手写字体 */
.handwrite{
  font-family:"Comic Sans MS","Segoe Print","Bradley Hand","Kaiti SC","KaiTi","楷体",cursive;
  letter-spacing:.5px;
}
/* 逐字出现 */
@keyframes charIn{from{opacity:0;transform:translateY(3px) scale(.9)}to{opacity:1;transform:none}}
.char-in{display:inline-block;animation:charIn .18s ease-out both}
/* 笔写入动画 */
@keyframes writeIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.write-in{animation:writeIn .38s ease-out both}
@keyframes penIn{from{opacity:0;transform:translateX(-4px) scale(.92)}to{opacity:1;transform:none}}
.pen-in{animation:penIn .3s ease-out both}
/* 光标闪烁 */
@keyframes blinkCaret{0%,100%{opacity:1}50%{opacity:0}}
.caret{display:inline-block;width:2px;height:1.15em;background:#4F6BFF;margin-left:2px;vertical-align:text-bottom;animation:blinkCaret .7s infinite;border-radius:1px}
.caret.pen{width:3px;height:1.2em;background:linear-gradient(180deg,#4F6BFF,#38BDF8);box-shadow:0 0 4px rgba(79,107,255,.4)}
/* 下划线生长 */
@keyframes lineGrow{from{width:0}to{width:100%}}
.uline{position:relative;display:inline-block}
.uline::after{content:"";position:absolute;left:0;bottom:-2px;height:2px;background:#4F6BFF;border-radius:1px;animation:lineGrow .35s ease-out both}
/* 竖式除法 */
.div-vertical{
  font-family:var(--mono);
  font-size:clamp(12.5px,1.5vw,15px);
  line-height:1.5;
  display:inline-block;
  text-align:left;
  padding:2px 6px;
}
.div-vertical .dv-row{
  display:flex;
  align-items:baseline;
  gap:0;
  white-space:nowrap;
  position:relative;
}
.div-vertical .dv-num{min-width:1.8em;text-align:right;font-weight:600}
.div-vertical .dv-op{color:#94A3B8;margin:0 .35em}
.div-vertical .dv-eq{color:#94A3B8;margin:0 .2em}
.div-vertical .dv-q{min-width:1.8em;text-align:left;color:#334155;font-weight:600}
.div-vertical .dv-rem{margin-left:1em;color:#F59E0B;font-weight:700}
.div-vertical .dv-rem::before{content:"余 ";color:#94A3B8;font-weight:400;font-size:.82em}
.div-vertical .dv-row.cur .dv-num,.div-vertical .dv-row.cur .dv-q{color:#F59E0B;font-weight:700}
.div-vertical .dv-row.cur .dv-rem{color:#D97706}
.div-vertical .dv-row.done{opacity:.65}
.div-vertical .dv-arrow{color:#22C55E;font-size:.82em;margin-left:.6em;font-weight:700}
/* 除号括号 */
.div-bracket{
  display:inline-flex;align-items:center;
  font-family:var(--mono);font-size:clamp(14px,2vw,17px);
  margin:6px 0;
}
.div-bracket .db-divisor{padding:0 6px;color:#4F6BFF;font-weight:700}
.div-bracket .db-body{
  border-left:2px solid #4F6BFF;
  border-top:2px solid #4F6BFF;
  border-top-left-radius:6px;
  padding:2px 10px 2px 8px;
  min-width:3em;text-align:center;
  position:relative;
}
.div-bracket .db-quotient{position:absolute;top:-1.4em;left:50%;transform:translateX(-50%);color:#22C55E;font-weight:700}
/* 位权展开表 */
.exp-table{
  width:100%;
  border-collapse:collapse;
  font-family:var(--mono);
  font-size:clamp(13px,1.6vw,17px);
  margin:4px 0;
  background:#fff;
  border-radius:8px;
  overflow:hidden;
  box-shadow:0 1px 4px rgba(0,0,0,.04);
}
.exp-table th,.exp-table td{
  border:1px solid #E2E8F0;
  padding:clamp(8px,1.3vw,12px) clamp(10px,1.6vw,14px);
  text-align:center;
  transition:all .2s;
  font-size:clamp(13px,1.6vw,17px);
}
.exp-table th{
  background:#EEF3FF;
  color:#4F6BFF;
  font-weight:700;
  font-size:.9em;
}
.exp-table td.cur{background:#FFF4DB;color:#B45309;font-weight:700;transform:scale(1.04)}
.exp-table td.done{background:#E8FBF0;color:#15803D}
.exp-table td.sum{background:#EEF3FF;color:#4F6BFF;font-weight:700}
.exp-table td.empty{background:#F8FAFC;color:#CBD5E1}
/* 展开式横写 */
.exp-inline{
  font-family:var(--mono);
  font-size:clamp(13px,1.7vw,16px);
  line-height:1.6;
  padding:clamp(8px,1.4vw,12px) clamp(12px,1.8vw,16px);
  background:#fff;
  border-radius:6px;
  border:1px solid #E2E8F0;
  margin:clamp(8px,1.4vw,12px) 0;
  width:100%;
  display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px;
}
.exp-inline .term{display:inline-block;margin:0 2px}
.exp-inline .term.cur{color:#F59E0B;font-weight:700}
.exp-inline .term.done{color:#22C55E}
.exp-inline .op{color:#94A3B8;margin:0 4px}
.exp-inline .eq{color:#4F6BFF;font-weight:700;margin:0 6px}
/* 分组转换 */
.group-box{
  display:inline-flex;
  align-items:center;
  gap:3px;
  font-family:var(--mono);
  font-size:clamp(11px,1.4vw,14px);
  margin:2px 0;
}
.group-box .grp{
  border:2px solid #4F6BFF;
  border-radius:5px;
  padding:2px 6px;
  background:#EEF3FF;
  font-weight:700;
  position:relative;
}
.group-box .grp.cur{border-color:#F59E0B;background:#FFF4DB;color:#B45309;transform:scale(1.08)}
.group-box .grp.done{border-color:#22C55E;background:#E8FBF0;color:#15803D}
.group-box .grp .grp-label{
  position:absolute;top:-16px;left:50%;transform:translateX(-50%);
  font-size:.65em;color:#94A3B8;font-weight:600;white-space:nowrap;
}
.group-box .arrow{color:#94A3B8;font-size:.8em;margin:0 4px}
/* 结果框 */
.write-result{
  font-family:var(--mono);
  font-size:clamp(16px,2.2vw,22px);
  font-weight:700;
  color:#4F6BFF;
  background:linear-gradient(135deg,#EEF3FF,#E0F2FE);
  border-radius:8px;
  padding:clamp(12px,2vw,18px) clamp(14px,2vw,20px);
  text-align:center;
  margin-top:clamp(10px,1.8vw,16px);
  border:1px solid #C7D2FE;
  box-shadow:0 1px 4px rgba(79,107,255,.08);
  width:100%;
  box-sizing:border-box;
}
/* 步骤标题条 */
.step-title{
  display:inline-flex;
  align-items:center;
  gap:5px;
  font-size:clamp(13px,1.7vw,16px);
  font-weight:700;
  color:#4F6BFF;
  background:#EEF3FF;
  padding:clamp(5px,1vw,8px) clamp(12px,1.8vw,16px);
  border-radius:999px;
  margin-bottom:clamp(8px,1.4vw,12px);
}
.step-title .st-dot{width:6px;height:6px;border-radius:50%;background:#4F6BFF}
/* 子页面 tab 导航 */
.sub-tabs{
  display:flex;
  flex-wrap:nowrap;
  overflow-x:auto;
  gap:4px;
  margin-bottom:8px;
  padding:4px;
  background:var(--surface-2);
  border-radius:10px;
  border:1px solid var(--border);
  -webkit-overflow-scrolling:touch;
  scrollbar-width:thin;
}
.sub-tabs::-webkit-scrollbar{height:4px}
.sub-tabs::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:2px}
.sub-tab{
  padding:4px 10px;
  border-radius:7px;
  font-size:clamp(10.5px,1.3vw,12px);
  font-weight:600;
  color:var(--text-3);
  cursor:pointer;
  transition:all .15s;
  border:1px solid transparent;
  white-space:nowrap;
  user-select:none;
}
.sub-tab:hover{color:var(--accent);background:#fff}
.sub-tab.active{
  background:var(--accent);
  color:#fff;
  border-color:var(--accent);
  box-shadow:0 2px 8px rgba(79,107,255,.25);
}
.sub-tab .method{font-size:.78em;opacity:.75;margin-left:4px;font-weight:400}
.sub-tab.active .method{opacity:.85}
/* 子页面分组标题 */
.sub-group-label{
  font-size:clamp(10px,1.2vw,11px);
  font-weight:700;
  color:#94A3B8;
  letter-spacing:.5px;
  padding:4px 8px;
  align-self:center;
}
/* 标注箭头 */
.annot{
  font-size:clamp(13px,1.7vw,16px);
  color:#64748B;
  font-family:var(--font);
  line-height:1.6;
  width:100%;
  box-sizing:border-box;
}
.annot b{color:#4F6BFF}
.annot .up-arrow{color:#22C55E;font-weight:700}
</style>

<script>
/* ================================================================
 *  教学计算演示台 · 核心脚本
 *  模块元数据 + 首页 + hash 路由 + 统一逐步演示引擎
 * ================================================================ */
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const randInt=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* ---------- 模块元数据 ---------- */
const MOD = {};

/* ---------- SECTION: 统一演示引擎 ---------- */
const Engine = {
  key:null, i:-1, timer:null, ms:1500, error:null,

  /* 载入模块：渲染外壳 → 生成步骤 → 复位播放状态 */
  load(key, keepSettings){
    const m = MOD[key];
    if(!m) return;
    Engine.stop();
    Engine.key = key;
    $('#modTitle').textContent = m.name;
    $('#modSub').textContent  = m.sub;
    $('#modBadge').textContent= m.badge;
    $('#modBadge').style.setProperty('--card-c', m.color);
    $('#theoryBody').innerHTML = m.theory();
    // setDesc 已合并到控制条，参数label由settingsHTML提供
    // 子页面 tab 导航
    const tabsEl = $('#subTabs');
    if(m.subTabs && m.subTabs.length){
      tabsEl.style.display = 'flex';
      if(!m.currentSub) m.currentSub = m.subTabs[0].id;
      tabsEl.innerHTML = m.subTabs.map(t=>
        `<div class="sub-tab ${t.id===m.currentSub?'active':''}" data-sub="${t.id}">${t.label}${t.method?`<span class="method">${t.method}</span>`:''}</div>`
      ).join('');
      tabsEl.querySelectorAll('.sub-tab').forEach(el=>{
        el.onclick = ()=>{
          tabsEl.querySelectorAll('.sub-tab').forEach(x=>x.classList.remove('active'));
          el.classList.add('active');
          m.currentSub = el.dataset.sub;
          if(m.onSubChange) m.onSubChange(el.dataset.sub);
          Engine.reload();
        };
      });
    }else{
      tabsEl.style.display = 'none';
      tabsEl.innerHTML = '';
    }
    if(!keepSettings) $('#settingsRow').innerHTML = m.settingsHTML();
    if(m.afterSettings) m.afterSettings();
    if($('#stageDesc')) $('#stageDesc').textContent = m.stageDesc;
    Engine.regenerate();
  },

  /* 重新生成题目；生成过程出错时进入错误态而不是留下半截步骤 */
  regenerate(){
    const m = MOD[Engine.key];
    Engine.stop();
    Engine.error = null;
    m.steps = [];
    try{
      m.generate();
    }catch(err){
      Engine.error = (err && err.message) ? err.message : String(err);
      m.steps = [];
    }
    if(!Array.isArray(m.steps)) m.steps = [];
    Engine.i = -1;
    Engine.renderAll();
  },

  /* 只重算步骤、保留当前设置项的取值（供参数变更后调用） */
  reload(){
    const m = MOD[Engine.key];
    if(!m) return;
    $('#settingsRow').innerHTML = m.settingsHTML();
    if(m.restoreSettings) m.restoreSettings();
    if(m.afterSettings) m.afterSettings();
    Engine.regenerate();
  },

  atEnd(){ const m=MOD[Engine.key]; return !m || !m.steps || Engine.i >= m.steps.length-1; },
  atStart(){ return Engine.i <= -1; },

  syncButtons(){
    const mk = MOD[Engine.key];
    const noSteps = Engine.error || !mk || !mk.steps || mk.steps.length===0;
    $('#btnStep').disabled = noSteps || Engine.atEnd();
    $('#btnPrev').disabled = noSteps || Engine.atStart();
    $('#btnAuto').disabled = noSteps;
    $('#btnNew').disabled  = !MOD[Engine.key] || !MOD[Engine.key].canRegenerate;
    $('#btnAuto').textContent = Engine.timer ? '暂停' : (Engine.atEnd() ? '重新播放' : '自动演示');
  },

  step(){
    if(Engine.error || Engine.atEnd()) { Engine.syncButtons(); return; }
    Engine.i++;
    Engine.renderStep();
  },
  prev(){
    if(Engine.error || Engine.atStart()) { Engine.syncButtons(); return; }
    Engine.i--;
    if(Engine.i < 0) Engine.renderAll(); else Engine.renderStep();
  },
  renderStep(){
    const m = MOD[Engine.key];
    const s = m.steps[Engine.i];
    if(!s) return;
    s.draw();
    Engine.fitStage();
    $('#explainBox').innerHTML = s.desc;
    const N = m.steps.length;
    $('#stepLbl').textContent = `第 ${Engine.i+1} / ${N} 步`;
    $('#stepDone').textContent = `已完成 ${Math.round((Engine.i+1)/N*100)}%`;
    $('#stepFill').style.width = ((Engine.i+1)/N*100)+'%';
    Engine.syncButtons();
  },
  renderAll(){
    const m = MOD[Engine.key];
    if(Engine.error){
      $('#explainBox').innerHTML = `<div class="err"><div class="err-t">参数不合法，无法生成演示</div>${Engine.error}</div>`;
      $('#stage').innerHTML = `<div class="err"><div class="err-t">请修正上方参数后重试</div>修正后点击「换一题」或改动任一参数即可重新生成演示步骤。</div>`;
      Engine.fitStage();
      $('#stepLbl').textContent = '共 0 步';
      $('#stepDone').textContent = '参数待修正';
      $('#stepFill').style.width = '0%';
      Engine.syncButtons();
      return;
    }
    const N = m ? m.steps.length : 0;
    $('#explainBox').innerHTML = N ? (m.initDesc || '点击「自动演示」或「下一步」，逐步观看计算过程。')
                                   : '当前参数下没有可演示的步骤，请调整参数。';
    $('#stepLbl').textContent = `共 ${N} 步`;
    $('#stepDone').textContent = '尚未开始';
    $('#stepFill').style.width = '0%';
    if(N && m.initStage) m.initStage();
    Engine.fitStage();
    Engine.syncButtons();
  },
  /* 用 setTimeout 链而非 setInterval：切换倍速时不会残留旧节拍 */
  auto(){
    if(Engine.error) return;
    if(Engine.timer){ Engine.stop(); return; }
    if(Engine.atEnd()){ Engine.i = -1; Engine.renderAll(); }
    $('#btnAuto').textContent = '暂停';
    Engine.syncButtons();
    const tick = ()=>{
      if(Engine.i >= MOD[Engine.key].steps.length-1){ Engine.stop(); return; }
      Engine.step();
      if(Engine.i >= MOD[Engine.key].steps.length-1){ Engine.stop(); return; }
      Engine.timer = setTimeout(tick, Engine.ms);
    };
    Engine.timer = setTimeout(tick, Engine.ms);
  },
  stop(){
    if(Engine.timer){ clearTimeout(Engine.timer); Engine.timer=null; }
    const b=$('#btnAuto'); if(b) b.textContent = Engine.atEnd() ? '重新播放' : '自动演示';
    Engine.syncButtons();
  },
  reset(){
    Engine.stop();
    Engine.i = -1;
    Engine.renderAll();
  },
  /* 倍速实时生效：清掉旧定时器按新间隔续播 */
  setSpeed(ms){
    Engine.ms = ms;
    if(Engine.timer){ clearTimeout(Engine.timer); Engine.timer=null; Engine.auto(); }
  },

  /* 舞台适配：测量内容自然尺寸后等比缩放，保证一屏完整不溢出 */
  fitStage(secondPass){
    const stage = $('#stage'); if(!stage) return;
    let fit = stage.querySelector(':scope > .stage-fit');
    if(!fit){
      fit = document.createElement('div'); fit.className='stage-fit';
      stage.appendChild(fit);
    }
    fit.style.position = 'relative';
    let inner = fit.querySelector(':scope > .stage-fit-inner');
    if(!inner){
      inner = document.createElement('div'); inner.className='stage-fit-inner';
      fit.appendChild(inner);
    }
    /* 把散落在 fit / stage 里的其他兄弟节点并入内层包裹 */
    Array.from(fit.children).forEach(c=>{ if(c!==inner) inner.appendChild(c); });
    Array.from(stage.children).forEach(c=>{ if(c!==fit) inner.appendChild(c); });
    const fw = fit.clientWidth, fh = fit.clientHeight;
    if(fw>0 && fh>0){
      /* 测量：脱离文档流，保持flex布局，直接子元素不flex压缩，获取自然尺寸 */
      const prevChildren = [];
      inner.style.cssText = 'position:absolute;left:0;top:0;width:'+fw+'px;height:auto;visibility:hidden;transform:none;';
      Array.from(inner.children).forEach(c=>{
        prevChildren.push({el:c, flex:c.style.flex, minH:c.style.minHeight, height:c.style.height});
        c.style.flex = '0 0 auto';
        c.style.minHeight = '0';
        c.style.height = 'auto';
      });
      const sw = inner.scrollWidth || 1;
      const sh = inner.scrollHeight || 1;
      let scale = Math.min(fw/sw, fh/sh, 3.0);
      if(!isFinite(scale) || scale>3.0) scale = 3.0;
      /* 恢复子元素内联样式 */
      prevChildren.forEach(p=>{
        p.el.style.flex = p.flex;
        p.el.style.minHeight = p.minH;
        p.el.style.height = p.height;
      });
      /* 绝对定位居中 + 缩放 */
      inner.style.cssText = 'position:absolute;left:50%;top:50%;width:'+fw+'px;transform:translate(-50%,-50%) scale('+scale+');transform-origin:center center;';
    }
    if(!secondPass) requestAnimationFrame(()=>Engine.fitStage(true));
  }
};
$('#btnAuto').onclick = () => Engine.auto();
$('#btnStep').onclick = () => Engine.step();
$('#btnPrev').onclick = () => Engine.prev();
$('#btnReset').onclick = () => Engine.reset();
$('#btnNew').onclick = () => Engine.regenerate();
$$('#speedGrp button').forEach(b=>{
  b.onclick=()=>{
    $$('#speedGrp button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    Engine.setSpeed(parseInt(b.dataset.ms,10));
  };
});
/* 键盘快捷键：忽略输入框内的按键，避免干扰参数录入 */
document.addEventListener('keydown', e=>{
  if(!$('#view-demo').classList.contains('active')) return;
  const t=e.target;
  if(t && (t.tagName==='INPUT'||t.tagName==='SELECT'||t.tagName==='TEXTAREA')) return;
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const k=e.key;
  if(k===' '||k==='Spacebar'){ e.preventDefault(); Engine.auto(); }
  else if(k==='ArrowRight'){ e.preventDefault(); Engine.step(); }
  else if(k==='ArrowLeft'){ e.preventDefault(); Engine.prev(); }
  else if(k==='r'||k==='R'){ e.preventDefault(); Engine.reset(); }
  else if(k==='n'||k==='N'){ e.preventDefault(); if(!$('#btnNew').disabled) Engine.regenerate(); }
});

/* ---------- hash 路由 ---------- */
function route(){
  const h = location.hash.replace('#/','').replace('#','');
  const demo = $('#view-demo'), home = $('#view-home');
  const isDemo = !!(h && h!=='home' && MOD[h]);
  home.classList.toggle('active', !isDemo);
  demo.classList.toggle('active', isDemo);
  document.body.classList.toggle('demo', isDemo);
  document.body.style.overflow = isDemo ? 'hidden' : '';
  if(isDemo){
    Engine.load(h);
    window.scrollTo(0,0);
  }else{
    Engine.stop();
    window.scrollTo(0,0);
  }
}
window.addEventListener('hashchange', route);
/* 窗口尺寸变化后重新做舞台等比适配 */
window.addEventListener('resize', ()=>Engine.fitStage());

/* ================================================================
 * ① 进制转换（含进制基本概念：位权 / 基数 / 数码）
 * ================================================================ */
const B={2:'二进制',8:'八进制',10:'十进制',16:'十六进制'};
const DIGITS='0123456789ABCDEF';
function toBase(n,b){ if(n===0)return'0'; let r=''; while(n>0){r=DIGITS[n%b]+r;n=Math.floor(n/b);} return r; }
function fromBase(s,b){ let v=0; for(const ch of s.toUpperCase()){v=v*b+DIGITS.indexOf(ch);} return v; }
function randDigits(b,len){ let s=''; for(let i=0;i<len;i++) s+=DIGITS[randInt(0,b-1)]; return s; }

/* ================================================================
 * ① 进制转换（仅保留 6 种转换：二 ↔ 十 · 二 ↔ 八 · 二 ↔ 十六）
 * 子页面：bin2dec 二转十（按权展开）/ dec2bin 十转二（除基取余·逆序）
 *         bin2oct 二转八（三位分组）/ oct2bin 八转二（逐位展开）
 *         bin2hex 二转十六（四位分组）/ hex2bin 十六转二（逐位展开）
 * 复用全局辅助：B, DIGITS, toBase, fromBase, randDigits, randInt, $, $$, esc

/* ---------- 输入约束配置（key 对应子页面 id） ---------- */
const BASE_INPUT_SPEC = {
  bin2dec: {kind:'bin',  base:2,  label:'二进制',   chars:'0、1',      max:8,  ph:'如 1011',    re:/^[01]+$/},
  dec2bin: {kind:'dec',  base:10, label:'十进制',   chars:'0~9',      max:3,  ph:'如 25',      re:/^\d+$/},
  bin2oct: {kind:'bin',  base:2,  label:'二进制',   chars:'0、1',      max:12, ph:'如 10110',   re:/^[01]+$/},
  oct2bin: {kind:'oct',  base:8,  label:'八进制',   chars:'0~7',      max:4,  ph:'如 37',      re:/^[0-7]+$/i},
  bin2hex: {kind:'bin',  base:2,  label:'二进制',   chars:'0、1',      max:12, ph:'如 101101',  re:/^[01]+$/},
  hex2bin: {kind:'hex',  base:16,label:'十六进制', chars:'0~9、A~F',max:4,  ph:'如 A3',      re:/^[0-9A-Fa-f]+$/}
};
const BASE_RAND_OPTS = {
  bin2dec: [['2','2 位'],['3','3 位'],['4','4 位']],
  dec2bin: [['small','较小数（5~31）'],['medium','中等数（32~99）'],['large','较大数（100~255）']],
  bin2oct: [['6','6 位'],['9','9 位']],
  oct2bin: [['2','2 位'],['3','3 位']],
  bin2hex: [['8','8 位'],['12','12 位']],
  hex2bin: [['2','2 位'],['3','3 位']]
};

MOD.base = {
  name:'进制转换', sub:'二 ↔ 十 · 二 ↔ 八 · 二 ↔ 十六 · 手写逐步演示',
  badge:'数制 · 互转', tag:'进制', cat:'bit',
  color:'#4F6BFF', soft:'#EEF3FF', type:'按权展开 · 除基取余逆序 · 三位/四位分组 · 逐位展开',
  desc:'以二进制为桥梁，演示二转十（按权展开）、十转二（除基取余逆序读取）、二转八/十六（分组法）及其反向逐位展开，每一步都在大屏上手写推导。',
  icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l6-6-6-6M12 19h8"/></svg>',
  setDesc:'',
  stageDesc:'橙色=当前计算项，绿色=已得出结果，灰色=尚未操作；十转二最后展示余数逆序（倒排）读取。',
  initDesc:'点击「自动演示」或「下一步」，观看进制转换的手写推导过程。',
  currentSub:'bin2dec',
  subTabs:[
    {id:'bin2dec', label:'二转十',   method:'按权展开'},
    {id:'dec2bin', label:'十转二',   method:'除基取余·逆序'},
    {id:'bin2oct', label:'二转八',   method:'三位分组'},
    {id:'oct2bin', label:'八转二',   method:'逐位展开'},
    {id:'bin2hex', label:'二转十六', method:'四位分组'},
    {id:'hex2bin', label:'十六转二', method:'逐位展开'}
  ],
  _customInput:'', _invalidMsg:'', _digits:'', _dec:0,

  theory(){
    return `<div class="rule"><b>数码</b>：进制中使用的符号。二进制用 0、1；八进制用 0~7；十六进制用 0~9、A~F；十进制用 0~9。</div>
    <div class="rule"><b>基数</b>：进制中数码的个数。二进制基数=2，八进制=8，十六进制=16，十进制=10。</div>
    <div class="rule"><b>位权</b>：每一位的权重 = 基数<sup>位序</sup>。位序从右往左由 0 开始，如二进制 1011 中，最左一位的位序是 3、位权是 2³=8。</div>
    <div class="rule"><b>按权展开</b>（二进制 → 十进制）：每一位数码 × 对应位权得到贡献，再把所有贡献相加。</div>
    <div class="rule"><b>除基取余</b>（十进制 → 二进制）：不断除以 2，记录商和余数，直到商为 0；余数要<b>从下往上逆序（倒排）</b>读取才是结果。</div>
    <div class="rule"><b>分组转换</b>：二 ↔ 八 按 <b>3 位一组</b>，二 ↔ 十六 按 <b>4 位一组</b>；反向转换时把每一位展开成对应位数的二进制即可。</div>`;
  },

  /* ---------- 参数设置区 ---------- */
  settingsHTML(){
    const spec = BASE_INPUT_SPEC[this.currentSub];
    const cur = this._customInput || '';
    let bad = '', hint = `仅允许 ${spec.chars}`;
    if(cur){
      if(!spec.re.test(cur)){ bad=' bad'; hint=`「${cur}」含非法数码，仅允许 ${spec.chars}`; }
      else if(cur.length > spec.max){ bad=' bad'; hint=`位数过长：最多 ${spec.max} 位，当前 ${cur.length} 位`; }
    }
    const opts = BASE_RAND_OPTS[this.currentSub].map(([v,t],i)=>`<option value="${v}" ${i===0?'selected':''}>${t}</option>`).join('');
    return `<div class="inline-setting"><div class="setting">
        <label>输入数值（留空则随机出题）</label>
        <input type="text" id="b-custom" value="${esc(cur)}" placeholder="${spec.ph}" maxlength="${spec.max}" class="${bad}" style="width:clamp(100px,15vw,140px);font-family:var(--mono)">
        <div class="chk ${bad?'bad':''}">${hint}</div>
      </div></div>
      <div class="inline-setting"><div class="setting"><label>或随机</label>
        <select id="b-len">${opts}</select></div></div>`;
  },
  afterSettings(){
    const el = $('#b-custom');
    if(el) el.onchange = ()=>{ this._customInput = el.value.trim(); Engine.reload(); };
    const sel = $('#b-len');
    if(sel) sel.onchange = ()=>{ this._customInput = ''; Engine.reload(); };
  },

  /* ---------- 内部辅助 ---------- */
  _spec(){ return BASE_INPUT_SPEC[this.currentSub]; },
  /* 读取并校验手动输入；非法时抛错进入引擎错误态；返回 true=手动输入，false=随机 */
  _readCustom(){
    const spec = this._spec();
    const el = $('#b-custom');
    const raw = (el ? el.value.trim() : (this._customInput || ''));
    if(raw){
      if(!spec.re.test(raw)){
        this._invalidMsg = `「${raw}」不是合法${spec.label}数，仅允许数码 ${spec.chars}`;
        this._customInput = raw; throw new Error(this._invalidMsg);
      }
      if(raw.length > spec.max){
        this._invalidMsg = `位数过长：${spec.label}数最多 ${spec.max} 位（当前 ${raw.length} 位）`;
        this._customInput = raw; throw new Error(this._invalidMsg);
      }
      if(spec.kind === 'dec'){
        const v = Number(raw);
        if(!/^\d+$/.test(raw) || v < 1){
          this._invalidMsg = '请输入正整数十进制数（1 ~ 255）';
          this._customInput = raw; throw new Error(this._invalidMsg);
        }
        if(v > 255){
          this._invalidMsg = '为保证竖式除法在大屏幕上清晰展示，请输入 1 ~ 255 之间的十进制数';
          this._customInput = raw; throw new Error(this._invalidMsg);
        }
        this._dec = v;
      }else{
        this._digits = raw.toUpperCase();
      }
      this._customInput = raw;
      this._invalidMsg = '';
      return true;
    }
    this._invalidMsg = '';
    return false;
  },
  /* 随机出题（无手动输入时调用） */
  _randomInput(){
    const spec = this._spec();
    const sizeEl = $('#b-len');
    const size = sizeEl ? sizeEl.value : null;
    switch(spec.kind){
      case 'bin': {
        const len = +size || 3;
        let s = randDigits(2, len);
        if(s[0] === '0') s = '1' + s.slice(1);
        this._digits = s; break;
      }
      case 'dec': {
        const range = size === 'large' ? [100, 255] : size === 'medium' ? [32, 99] : [5, 31];
        this._dec = randInt(range[0], range[1]); break;
      }
      case 'oct': {
        const len = +size || 2;
        let s = randDigits(8, len);
        if(s[0] === '0') s = DIGITS[randInt(1,7)] + s.slice(1);
        this._digits = s; break;
      }
      case 'hex': {
        const len = +size || 2;
        let s = randDigits(16, len);
        if(s[0] === '0') s = DIGITS[randInt(1,15)] + s.slice(1);
        this._digits = s; break;
      }
    }
  },
  typeChars(text){
    return [...String(text)].map((ch,i)=>`<span class="char-in" style="animation-delay:${i*0.06}s">${esc(ch)}</span>`).join('');
  },
  _stage(body){ return `<div class="base-stage">${body}</div>`; },
  _head(label, state){ return `<div class="stage-hd"><span>${label}</span><span class="state">${state}</span></div>`; },
  /* 写出原数的通用画布 */
  drawNumber(num, label, state){
    const srcName = label.split('→')[0].trim();
    return this._stage(`${this._head(label, state)}
      <div style="text-align:center;padding:clamp(18px,3vw,30px) 0">
        <span style="font-family:var(--mono);font-size:clamp(26px,4.5vw,38px);font-weight:700;color:var(--text)">
          ${this.typeChars(num)}<sub style="font-size:.45em;color:var(--text-3)">${srcName}</sub>
        </span><span class="caret pen"></span>
      </div>`);
  },

  /* ========== 二转十：按权展开法 ========== */
  genBin2Dec(){
    if(!this._readCustom()) this._randomInput();
    const digits = this._digits;
    const dec = fromBase(digits, 2);
    const label = '二进制 → 十进制';
    const n = digits.length;
    const powers  = [...digits].map((_,i)=>n-1-i);
    const weights = powers.map(p=>Math.pow(2,p));
    const contribs= [...digits].map((d,i)=>DIGITS.indexOf(d)*weights[i]);
    const cum = []; let s = 0; contribs.forEach(c=>{ s+=c; cum.push(s); });
    const steps = [];

    steps.push({desc:`写出要转换的二进制数：<b class="c-op">${digits}</b>₂`,
      draw:()=>{ $('#stage').innerHTML = this.drawNumber(digits, label, '准备'); }});

    steps.push({desc:`用<b>按权展开法</b>：从左到右每一位的数码 × 位权（2<sup>位序</sup>）得到贡献，再把所有贡献相加。`,
      draw:()=>{
        $('#stage').innerHTML = this._stage(`
          ${this._head(label,'按权展开')}
          <div class="step-title"><span class="st-dot"></span>位权展开表</div>
          <table class="exp-table">
            <tr><th>位序</th>${powers.map(p=>`<th>${p}</th>`).join('')}</tr>
            <tr><th>数码</th>${[...digits].map((d,i)=>`<td class="write-in" style="animation-delay:${i*0.08}s">${d}</td>`).join('')}</tr>
            <tr><th>位权</th>${weights.map(()=>`<td class="empty">?</td>`).join('')}</tr>
            <tr><th>贡献</th>${contribs.map(()=>`<td class="empty">?</td>`).join('')}</tr>
          </table>`);
      }});

    for(let i=0;i<n;i++){
      const idx = i;
      steps.push({desc:`第 ${i+1} 位：数码 <b class="c-op">${digits[idx]}</b>，位序 <b>${powers[idx]}</b>，位权 2<sup>${powers[idx]}</sup> = <b>${weights[idx]}</b>，贡献 = ${digits[idx]} × ${weights[idx]} = <b class="c-op">${contribs[idx]}</b>，累计 ${cum[idx]}`,
        draw:()=>{
          $('#stage').innerHTML = this._stage(`
            ${this._head(label,`第 ${idx+1}/${n} 位`)}
            <div class="step-title"><span class="st-dot"></span>位权展开表</div>
            <table class="exp-table">
              <tr><th>位序</th>${powers.map(p=>`<th>${p}</th>`).join('')}</tr>
              <tr><th>数码</th>${[...digits].map((d,j)=>`<td class="${j<=idx?'done':''}">${d}</td>`).join('')}</tr>
              <tr><th>位权</th>${weights.map((w,j)=>`<td class="${j<idx?'done':j===idx?'cur':'empty'}">${j<=idx?w:'?'}</td>`).join('')}</tr>
              <tr><th>贡献</th>${contribs.map((c,j)=>`<td class="${j<idx?'done':j===idx?'cur':'empty'}">${j<=idx?c:'?'}</td>`).join('')}</tr>
            </table>
            <div class="exp-inline" style="display:flex;justify-content:center;flex-wrap:wrap;align-items:center;gap:8px">
              <span class="term done">${digits[idx]} × 2<sup>${powers[idx]}</sup></span>
              <span class="op">=</span>
              <span class="term cur">${contribs[idx]}</span>
              <span class="op">→</span><span class="term">累计 <b class="res">${cum[idx]}</b></span>
            </div>`);
        }});
    }

    steps.push({desc:`把所有位贡献相加：${contribs.join(' + ')} = <b class="c-op">${dec}</b>`,
      draw:()=>{
        $('#stage').innerHTML = this._stage(`
          ${this._head(label,'完成')}
          <div class="step-title"><span class="st-dot"></span>位权展开表</div>
          <table class="exp-table">
            <tr><th>位序</th>${powers.map(p=>`<th>${p}</th>`).join('')}</tr>
            <tr><th>数码</th>${[...digits].map(d=>`<td class="done">${d}</td>`).join('')}</tr>
            <tr><th>位权</th>${weights.map(w=>`<td class="done">${w}</td>`).join('')}</tr>
            <tr><th>贡献</th>${contribs.map(c=>`<td class="done">${c}</td>`).join('')}</tr>
          </table>
          <div class="exp-inline" style="display:flex;justify-content:center;flex-wrap:wrap;align-items:center;gap:8px">
            ${contribs.map((c,i)=>`<span class="term done">${c}</span>${i<contribs.length-1?'<span class="op">+</span>':''}`).join('')}
            <span class="op">=</span><span class="term cur">${dec}</span>
          </div>
          <div class="write-result">${digits}<sub>二进制</sub> = ${dec}<sub>十进制</sub></div>`);
      }});
    return steps;
  },

  /* ========== 十转二：除基取余 + 倒排（逆序）读取 ========== */
  _rankName(k, R){ return k===0?'最高位' : k===R-1?'最低位' : `第 ${R-k} 高位`; },
  genDec2Bin(){
    if(!this._readCustom()) this._randomInput();
    const dec = this._dec;
    const allRows = []; let temp = dec;
    while(temp > 0){ const q = Math.floor(temp/2), r = temp%2; allRows.push({n:temp, q, r}); temp = q; }
    if(allRows.length === 0) allRows.push({n:0, q:0, r:0});
    const R = allRows.length;
    const rems = allRows.map(x=>x.r);
    const ans = rems.slice().reverse().join('');
    const label = '十进制 → 二进制';
    const steps = [];

    /* 1. 写出原数 */
    steps.push({desc:`写出要转换的十进制数：<b class="c-op">${dec}</b>₁₀`,
      draw:()=>{ $('#stage').innerHTML = this.drawNumber(dec, label, '准备'); }});

    /* 2. 方法说明 */
    steps.push({desc:`用<b>除基取余法</b>：不断除以 <b>2</b>，记录每次的商和余数，直到商为 <b>0</b>；最后把余数<b>从下往上逆序（倒排）</b>读取，才是二进制结果。`,
      draw:()=>{
        $('#stage').innerHTML = this._stage(`
          ${this._head(label,'除基取余')}
          <div class="step-title"><span class="st-dot"></span>竖式除法（基数 = 2）</div>
          <div class="annot" style="display:block">每一行格式：<b>被除数 ÷ 2 = 商 … 余数</b>；先从上到下收集余数，最后再逆序读取。</div>`);
      }});

    /* 三列对齐网格渲染：phase='div' 除法阶段(curIdx=当前除法序号) / 'rev' 倒排阶段(curIdx=倒排序号k) / 'done' 完成。
       左列第 j 行 ↔ 右列第 j 行，统一 min-height + gap，grid align-items:stretch 保证严格对齐；行数恒等于 R。 */
    const renderGrid = (phase, curIdx)=>{
      const leftRows = allRows.map((rd,j)=>{
        let state='done', badge='';
        if(phase==='div'){
          state = j<curIdx?'done' : j===curIdx?'cur' : 'empty';
        }else if(phase==='rev'){
          const rowIdx = R-1-curIdx;
          state = j>rowIdx?'done' : j===rowIdx?'cur' : 'empty';
          if(j>=rowIdx) badge = `<span class="dv-rank ${j===rowIdx?'cur':''}">${this._rankName(R-1-j,R)}</span>`;
        }else{
          state='done';
          badge = `<span class="dv-rank">${this._rankName(R-1-j,R)}</span>`;
        }
        const show = phase!=='div' || j<=curIdx;
        const n = show?rd.n:'?', q = show?rd.q:'?', r = show?rd.r:'?';
        return `<div class="d2b-row ${state}"><span>${n} ÷ 2 = ${q} … 余 ${r}</span>${badge}</div>`;
      }).join('');
      const rightBits = allRows.map((rd,j)=>{
        let state, label='';
        if(phase==='div'){
          state = j<curIdx?'done' : j===curIdx?'cur' : 'empty';
        }else if(phase==='rev'){
          const rowIdx = R-1-curIdx;
          state = j>rowIdx?'done' : j===rowIdx?'cur' : 'empty';
          label = j>=rowIdx ? this._rankName(R-1-j,R) : '';
        }else{
          state='done';
          label = this._rankName(R-1-j,R);
        }
        const show = phase!=='div' || j<=curIdx;
        const r = show?rd.r:'?';
        const lbl = label ? `<span class="bit-label">${label}</span>` : '';
        return `<div class="d2b-bit ${state}"><span>${r}</span>${lbl}</div>`;
      }).join('');
      return `<div class="d2b-grid">
        <div class="d2b-col">${leftRows}</div>
        <div class="d2b-arrow">
          <div class="arr-label top">最低位</div>
          <div class="arr-bar"><span class="arr-up">↑</span></div>
          <div class="arr-label bottom">最高位</div>
        </div>
        <div class="d2b-col">${rightBits}</div>
      </div>`;
    };

    /* 3. 逐次除法：所有除法行同屏展示，已完成绿色、当前橙色、未操作灰色；左右两列逐行对齐 */
    for(let i=0;i<R;i++){
      const idx = i;
      steps.push({desc:`<b>${allRows[idx].n}</b> ÷ 2 = <b>${allRows[idx].q}</b>，余数 <b class="c-op">${allRows[idx].r}</b>（第 ${idx+1} 个被收集的余数，位于竖式最上面一行方向）`,
        draw:()=>{
          const rack = rems.slice(0,idx+1).map((r,j)=>`<span class="chip o write-in" style="animation-delay:${j*0.06}s">${r}</span>`).join('');
          $('#stage').innerHTML = this._stage(`
            ${this._head(label,`第 ${idx+1}/${R} 次除法`)}
            <div class="step-title"><span class="st-dot"></span>竖式除法（基数 = 2）</div>
            <div class="d2b-rack"><span class="d2b-rack-cap">余数收集（先 → 后）</span><div class="group-box">${rack||'<span style="color:#CBD5E1;font-family:var(--mono);font-size:clamp(13px,1.9vw,16px)">（暂无）</span>'}</div></div>
            ${renderGrid('div',idx)}`);
        }});
    }

    /* 4. 倒排阶段：从最下面一行（最后收集的余数）开始，自下而上依次标注位序 */
    for(let k=0;k<R;k++){
      const rowIdx = R-1-k;
      steps.push({desc:`逆序读取：第 <b>${k+1}</b> 个读出的余数是竖式最下面未读的 <b>${allRows[rowIdx].r}</b>，对应 <b class="c-op">${this._rankName(k,R)}</b>。`,
        draw:()=>{
          const readRack = [];
          for(let t=0;t<=k;t++) readRack.push(rems[R-1-t]);
          const rackHtml = readRack.map((r,t)=>`<span class="grp ${t===k?'cur':'done'} write-in" style="animation-delay:${t*0.08}s">${r}<span class="grp-label">${this._rankName(t,R)}</span></span>`).join('');
          $('#stage').innerHTML = this._stage(`
            ${this._head(label,'逆序读取')}
            <div class="step-title"><span class="st-dot"></span>余数从下往上读（最高位 → 最低位）</div>
            <div class="d2b-rack"><span class="d2b-rack-cap">逆序读取（最高位 → 最低位）</span><div class="group-box">${rackHtml}</div></div>
            ${renderGrid('rev',k)}`);
        }});
    }

    /* 5. 完成：倒排标注 + 底部结果条 */
    steps.push({desc:`余数逆序排列：${rems.slice().reverse().join('')}，即 <b class="c-op">${ans}</b>₂。`,
      draw:()=>{
        $('#stage').innerHTML = this._stage(`
          ${this._head(label,'完成')}
          <div class="step-title"><span class="st-dot"></span>竖式除法 · 余数逆序读取（自下而上 ↑）</div>
          ${renderGrid('done',-1)}
          <div class="d2b-result">${dec}<sub>十进制</sub> = ${ans}<sub>二进制</sub></div>`);
      }});
    return steps;
  },

  /* ========== 二 → 八/十六：分组法 ========== */
  genBinGroup(groupSize, dstB){
    if(!this._readCustom()) this._randomInput();
    const digits = this._digits;
    const padded = digits.padStart(Math.ceil(digits.length/groupSize)*groupSize, '0');
    const groups = [];
    for(let i=0;i<padded.length;i+=groupSize) groups.push(padded.slice(i,i+groupSize));
    const groupVals  = groups.map(g=>fromBase(g,2));
    const groupDigits= groupVals.map(v=>DIGITS[v]);
    const ans = toBase(fromBase(digits,2), dstB);
    const label = `二进制 → ${B[dstB]}`;
    const groupName = groupSize===3?'三位一组':'四位一组';
    const steps = [];

    steps.push({desc:`写出要转换的二进制数：<b class="c-op">${digits}</b>₂`,
      draw:()=>{ $('#stage').innerHTML = this.drawNumber(digits, label, '准备'); }});

    steps.push({desc:`从<b>右往左</b>每 <b>${groupSize}</b> 位分一组，左侧不足补 <b>0</b>：<b class="c-op">${padded}</b>，共 ${groups.length} 组。`,
      draw:()=>{
        $('#stage').innerHTML = this._stage(`
          ${this._head(label,groupName)}
          <div class="annot" style="margin-bottom:12px">分组方式：${groupSize} 位一组，左侧补零对齐（原数 ${digits}）。</div>
          <div style="text-align:center">
            <div class="group-box">${groups.map((g,i)=>`<span class="grp write-in" style="animation-delay:${i*0.12}s">${g}</span>`).join('')}</div>
          </div>`);
      }});

    for(let i=0;i<groups.length;i++){
      const idx = i;
      steps.push({desc:`第 ${i+1} 组 <b class="c-op">${groups[idx]}</b> = ${groupVals[idx]} → ${B[dstB]}数码 <b class="c-op">${groupDigits[idx]}</b>；已完成各组换算过程保留同屏。`,
        draw:()=>{
          /* 纵向累加列表：已完成组绿色完整换算，当前组橙色高亮，未操作组灰色占位，新组在下方出现 */
          const groupRows = groups.map((g,j)=>{
            const st = j<idx?'done':j===idx?'cur':'empty';
            const v = j<=idx?groupVals[j]:'?';
            const d = j<=idx?groupDigits[j]:'?';
            return `<div class="b2g-row ${st} write-in" style="animation-delay:${j*0.08}s">
              <span class="b2g-no">第 ${j+1} 组</span>
              <span class="term">${g}</span><span class="op">=</span>
              <span class="term">${v}</span><span class="op">→</span>
              <span class="term res">${d}</span>
            </div>`;
          }).join('');
          $('#stage').innerHTML = this._stage(`
            ${this._head(label,`第 ${idx+1}/${groups.length} 组`)}
            <div style="text-align:center">
              <div class="group-box">${groups.map((g,j)=>`<span class="grp ${j<idx?'done':j===idx?'cur':''}" ${j>idx?'style="opacity:.35"':''}>${g}</span>`).join('')}</div>
              <div class="annot" style="margin:clamp(10px,1.8vw,14px) 0">↓ 逐组换算（已完成组保留同屏，新组在下方出现）↓</div>
            </div>
            <div class="b2g-list">${groupRows}</div>`);
        }});
    }

    steps.push({desc:`各组结果按顺序拼接：${groupDigits.join('')} → <b class="c-op">${ans}</b>`,
      draw:()=>{
        $('#stage').innerHTML = this._stage(`
          ${this._head(label,'完成')}
          <div style="text-align:center">
            <div class="group-box">${groups.map(g=>`<span class="grp done">${g}</span>`).join('')}</div>
            <div class="annot" style="margin:clamp(12px,2.2vw,18px) 0;color:#22C55E">↓ 拼接 ↓</div>
            <div class="group-box">${groupDigits.map(d=>`<span class="grp done" style="border-color:#22C55E;background:#E8FBF0">${d}</span>`).join('')}</div>
          </div>
          <div class="write-result">${digits}<sub>二进制</sub> = ${ans}<sub>${B[dstB]}</sub></div>`);
      }});
    return steps;
  },

  /* ========== 八/十六 → 二：逐位展开法 ========== */
  genToBin(srcB){
    if(!this._readCustom()) this._randomInput();
    const digits = this._digits;
    const groupSize = srcB===8?3:4;
    const bitGroups = [...digits].map(d=>DIGITS.indexOf(d).toString(2).padStart(groupSize,'0'));
    const combined = bitGroups.join('');
    const ans = toBase(fromBase(digits, srcB), 2);
    const label = `${B[srcB]} → 二进制`;
    const steps = [];

    steps.push({desc:`写出要转换的${B[srcB]}数：<b class="c-op">${digits}</b>`,
      draw:()=>{ $('#stage').innerHTML = this.drawNumber(digits, label, '准备'); }});

    steps.push({desc:`每位${B[srcB]}数码展开为 <b>${groupSize}</b> 位二进制（高位补 0 对齐）。`,
      draw:()=>{
        $('#stage').innerHTML = this._stage(`
          ${this._head(label,'逐位展开')}
          <div style="text-align:center">
            <div class="group-box">${[...digits].map((d,i)=>`<span class="grp write-in" style="animation-delay:${i*0.1}s">${d}</span>`).join('')}</div>
            <div class="annot" style="margin-top:clamp(12px,2.2vw,18px)">每位展开为 ${groupSize} 位二进制</div>
          </div>`);
      }});

    for(let i=0;i<digits.length;i++){
      const idx = i; const v = DIGITS.indexOf(digits[idx]);
      steps.push({desc:`第 ${i+1} 位 <b class="c-op">${digits[idx]}</b> = ${v} → 二进制 <b class="c-op">${bitGroups[idx]}</b>`,
        draw:()=>{
          $('#stage').innerHTML = this._stage(`
            ${this._head(label,`第 ${idx+1}/${digits.length} 位`)}
            <div style="text-align:center">
              <div class="group-box">${[...digits].map((d,j)=>`<span class="grp ${j<idx?'done':j===idx?'cur':''}">${d}</span>`).join('')}</div>
              <div class="annot" style="margin:clamp(12px,2.2vw,18px) 0">↓ 逐位展开 ↓</div>
              <div class="group-box">${bitGroups.map((bg,j)=>`<span class="grp ${j<idx?'done':j===idx?'cur':''}" style="${j>=idx?'opacity:.35':''};min-width:${groupSize*1.4}em">${j<=idx?bg:'?'}</span>`).join('')}</div>
              <div class="exp-inline" style="display:inline-flex;align-items:center;gap:8px;margin-top:clamp(12px,2.2vw,18px)">
                <span class="term cur">${digits[idx]}</span><span class="op">=</span>
                <span class="term cur">${v}</span><span class="op">→</span>
                <span class="term cur">${bitGroups[idx]}</span>
              </div>
            </div>`);
        }});
    }

    steps.push({desc:`拼接后为 <b>${combined}</b>${combined!==ans?`，去掉前导零得 <b class="c-op">${ans}</b>`:`，即结果 <b class="c-op">${ans}</b>`}`,
      draw:()=>{
        $('#stage').innerHTML = this._stage(`
          ${this._head(label,'完成')}
          <div style="text-align:center">
            <div class="group-box">${[...digits].map(d=>`<span class="grp done">${d}</span>`).join('')}</div>
            <div class="annot" style="margin:clamp(12px,2.2vw,18px) 0;color:#22C55E">↓ 拼接 ↓</div>
            <div style="font-family:var(--mono);font-size:clamp(18px,2.8vw,28px);font-weight:700;letter-spacing:3px;color:#334155">${combined}</div>
            ${combined!==ans?`<div class="annot" style="margin-top:10px">去掉前导零：<b>${ans}</b></div>`:''}
          </div>
          <div class="write-result">${digits}<sub>${B[srcB]}</sub> = ${ans}<sub>二进制</sub></div>`);
      }});
    return steps;
  },

  /* ---------- 初始化画布 ---------- */
  initStage(){
    const map = {
      bin2dec:  ['二进制 → 十进制','按权展开法'],
      dec2bin:  ['十进制 → 二进制','除基取余法（余数逆序读取）'],
      bin2oct:  ['二进制 → 八进制','三位分组法'],
      oct2bin:  ['八进制 → 二进制','逐位展开法'],
      bin2hex:  ['二进制 → 十六进制','四位分组法'],
      hex2bin:  ['十六进制 → 二进制','逐位展开法']
    };
    const [label, method] = map[this.currentSub] || ['进制转换',''];
    $('#stage').innerHTML = this._stage(`
      ${this._head(label,'准备就绪')}
      <div style="text-align:center;padding:clamp(20px,4vw,36px) 0;color:#94A3B8">
        <div style="font-size:clamp(15px,2.2vw,18px);margin-bottom:10px">使用 <b style="color:#4F6BFF">${method}</b></div>
        <div style="font-size:clamp(13px,1.8vw,15px)">点击「自动演示」或「下一步」开始手写推导</div>
      </div>`);
  },

  generate(){
    switch(this.currentSub){
      case 'bin2dec': this.steps = this.genBin2Dec(); break;
      case 'dec2bin': this.steps = this.genDec2Bin(); break;
      case 'bin2oct': this.steps = this.genBinGroup(3, 8); break;
      case 'oct2bin': this.steps = this.genToBin(8); break;
      case 'bin2hex': this.steps = this.genBinGroup(4, 16); break;
      case 'hex2bin': this.steps = this.genToBin(16); break;
      default: this.steps = this.genBin2Dec();
    }
  }
};
