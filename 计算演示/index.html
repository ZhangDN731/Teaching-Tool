             <div class="enc-note">1 字节（8 位）存储</div>
           </div>`);
        $('#stage').innerHTML=`<div class="stage-hd"><span>字符 → ASCII 码值</span><span class="state">${stateLabels[cur]}</span></div>
          <div class="enc-flow">${flow}</div>
          <div class="enc-final-grid">
            <div class="enc-col wide">${renderCard(cur)}</div>
            <div class="enc-col">${resultCard}</div>
          </div>`;
      }});
    return steps;
  },

  /* ========== ② BCD：十进制数逐位转 4 位二进制（覆盖式渲染，每步只显示当前位） ========== */
  genBcd(){
    const customEl=$('#e-bcd-custom');
    const custom=customEl?customEl.value.trim():'';
    let num;
    if(custom && /^\d{1,4}$/.test(custom)){
      num=parseInt(custom,10); this._customNum=custom;
    }else{
      num=randInt(10,999);
    }
    const digits=String(num).split('');
    const bits=digits.map(d=>parseInt(d,10).toString(2).padStart(4,'0'));
    const bcd=bits.join('');
    const weights=[8,4,2,1];
    const active=digits.map(d=>{ const v=parseInt(d,10); return weights.filter(w=>(v&w)!==0); });
    const N=digits.length;
    const label='BCD 编码';
    const steps=[];

    /* 覆盖式渲染：intro=题目步；digitIdx=-1 尚未开始；final=完成步。每步只展示当前位，不保留历史位表格 */
    const render=(intro,digitIdx,finalDone)=>{
      /* 源数字行（题目提示） */
      const sourceRow=`<div class="enc-chip-row">
        <span class="enc-sub" style="margin-right:6px">十进制数</span>
        ${digits.map(d=>`<span class="enc-chip src">${d}</span>`).join('')}
      </div>`;
      /* 题目步：编码规则说明 */
      if(intro){
        return sourceRow + `
          ${this._card('cur','编码规则','每位十进制数用 4 位二进制表示（8421 权：8、4、2、1）',
            `<div class="enc-sub">接下来逐位转换：每一位十进制数按 8421 权展开，得到对应的 4 位二进制，再依次拼接成 BCD 码。</div>`)}
          <div class="enc-result-strip locked">拼接结果将在最后一步汇总显示</div>`;
      }
      /* 完成步：最终拼接结果 */
      if(finalDone){
        return sourceRow + `
          ${this._card('done','拼接完成',`全部 ${N} 位十进制数已转换为 BCD 码`,
            `<div class="enc-chip-row spread">${digits.map((d,j)=>`<span class="enc-chip done">${d} → ${bits[j]}</span>`).join('')}</div>`)}
          <div class="enc-result-strip">${num}<sub>十进制</sub> <span class="enc-op">=</span> ${bcd}<sub>BCD</sub> <span class="enc-op">（${N}×4 = ${N*4} 位 = ${Math.ceil(N*4/8)} 字节）</span></div>`;
      }
      /* 逐位转换步：只展示当前位的 8421 权展开 + 4 位二进制，底部进度提示已拼接内容 */
      const d=digits[digitIdx], aw=active[digitIdx], b=bits[digitIdx];
      const doneBits=bits.slice(0,digitIdx+1);
      return sourceRow + `
        ${this._card('cur',`第 ${digitIdx+1} 位「${d}」· 8421 权展开`,`当前位转换过程（共 ${N} 位）`,
          `<div class="enc-calc-row">${weights.map(w=>`<span class="enc-chip ${aw.includes(w)?'cur':'empty'}" style="font-size:clamp(13px,1.8vw,17px);padding:4px 12px">${w}</span>`).join('')}</div>
           <div class="enc-calc-row">${b.split('').map(bit=>`<span class="enc-chip ${bit==='1'?'cur':'empty'}" style="font-size:clamp(14px,2vw,19px);padding:4px 12px">${bit}</span>`).join('')}</div>
           <div class="enc-calc">${aw.length?aw.join(' + '):'0'} <span class="enc-eq">=</span> <span class="enc-res">${d}</span> <span class="enc-op">→</span> <span class="enc-res">${b}</span></div>`)}
        <div class="enc-chip-row" style="margin-top:10px">
          <span class="enc-sub" style="margin-right:6px">已拼接</span>
          ${doneBits.map((bb,j)=>`<span class="enc-chip ${j===digitIdx?'cur':'done'}">${bb}</span>`).join('')}
        </div>`;
    };

    /* 步骤 0：输入十进制数 */
    steps.push({desc:`写出十进制数 <b class="c-op">${num}</b>；BCD 编码规定：每位十进制数用 <b>4 位二进制</b>表示（8421 权：8、4、2、1）。`,
      draw:()=>{
        $('#stage').innerHTML=`<div class="stage-hd"><span>${label}</span><span class="state">输入十进制数</span></div>
          <div class="step-title"><span class="st-dot"></span>待编码的十进制数 · 逐位转换</div>
          ${render(true,-1,false)}`;
      }});
    /* 步骤 1..N：逐位转换（每步只显示当前位） */
    digits.forEach((d,i)=>{
      const snap=bits.slice(0,i+1).join('');
      const aw=active[i];
      steps.push({desc:`第 ${i+1} 位 <b class="c-op">${d}</b>：${aw.length?aw.join(' + '):'0'} = ${d} → 4 位二进制 <b class="c-op">${bits[i]}</b>；已拼接 = <b class="c-op">${snap}</b>。`,
        draw:()=>{
          $('#stage').innerHTML=`<div class="stage-hd"><span>${label}</span><span class="state">第 ${i+1}/${N} 位编码</span></div>
            <div class="step-title"><span class="st-dot"></span>逐位编码（8421 权展开，当前位橙色高亮）</div>
            ${render(false,i,false)}`;
        }});
    });
    /* 最后：拼接完成 */
    steps.push({desc:`拼接完成：<b class="c-op">${num}</b><sub>十进制</sub> = <b class="c-op">${bcd}</b><sub>BCD</sub>，共 ${N}×4 = <b>${N*4}</b> 位二进制，占 <b>${Math.ceil(N*4/8)}</b> 字节存储。`,
      draw:()=>{
        $('#stage').innerHTML=`<div class="stage-hd"><span>${label}</span><span class="state">拼接完成</span></div>
          <div class="step-title"><span class="st-dot"></span>编码结果（最终拼接）</div>
          ${render(false,N-1,true)}`;
      }});
    return steps;
  },

  /* ========== ③ 区位码 → 国标码 → 机内码（覆盖式，每步只显示当前码） ========== */
  genHanzi(){
    const qEl=$('#e-hanzi-q'), wEl=$('#e-hanzi-w');
    const qCustom=qEl?qEl.value.trim():'';
    const wCustom=wEl?wEl.value.trim():'';
    let qh,wh;
    if(qCustom && /^\d+$/.test(qCustom) && +qCustom>=1 && +qCustom<=94){ qh=+qCustom; this._customQ=qCustom; }
    else{ qh=randInt(16,55); }
    if(wCustom && /^\d+$/.test(wCustom) && +wCustom>=1 && +wCustom<=94){ wh=+wCustom; this._customW=wCustom; }
    else{ wh=randInt(1,94); }
    const qhHex=qh.toString(16).toUpperCase().padStart(2,'0');
    const whHex=wh.toString(16).toUpperCase().padStart(2,'0');
    const gbQ=(qh+0x20).toString(16).toUpperCase().padStart(2,'0');
    const gbW=(wh+0x20).toString(16).toUpperCase().padStart(2,'0');
    const neiQ=(qh+0xA0).toString(16).toUpperCase().padStart(2,'0');
    const neiW=(wh+0xA0).toString(16).toUpperCase().padStart(2,'0');
    /* 区位码 = 区号(两位) + 位号(两位)，如 区号16 位号01 → 1601 */
    const weiCode=String(qh).padStart(2,'0')+String(wh).padStart(2,'0');
    const label='区位码 → 国标码 → 机内码';
    /* 除16取余竖式（区位码十进制 → 十六进制） */
    const div16=(n)=>{ const rows=[]; let t=n;
      if(t===0) rows.push({n:0,q:0,r:'0'});
      while(t>0){ const q=Math.floor(t/16),r=t%16; rows.push({n:t,q,r:r.toString(16).toUpperCase()}); t=q; }
      return rows; };
    const qRows=div16(qh), wRows=div16(wh);
    const divHtml=rows=>rows.map(rd=>`<div>${rd.n} ÷ 16 = ${rd.q} <span style="color:var(--orange);font-weight:700">余 ${rd.r}</span></div>`).join('');
    const steps=[];

    /* 三码流程节点（顶部进度条，只显示进度，不承载详细内容） */
    const flow=(cur)=>[
      this._flowNode('区位码',weiCode,this._state(0,cur)),`<span class="enc-arrow">→</span>`,
      this._flowNode('国标码',`${gbQ}${gbW}H`,this._state(1,cur)),`<span class="enc-arrow">→</span>`,
      this._flowNode('机内码',`${neiQ}${neiW}H`,this._state(2,cur))
    ].join('');

    /* 卡片渲染：cur=0 区位 / 1 国标 / 2 机内；覆盖式只渲染当前正在计算的码 */
    const renderCard=(cur)=>{
      if(cur===0){
        return this._card('cur','区位码','GB2312 中的位置 · 十进制',
          `<div class="enc-calc-row">
             <span class="enc-chip src">区号 ${qh}</span>
             <span class="enc-chip src">位号 ${wh}</span>
           </div>
           <div class="enc-mini">
             <div class="enc-h">区号 ${qh}₁₀ ÷ 16 取余（余数逆序）</div>${divHtml(qRows)}
             <div class="enc-h" style="margin-top:6px">位号 ${wh}₁₀ ÷ 16 取余（余数逆序）</div>${divHtml(wRows)}
           </div>
           <div class="enc-calc">区 ${qh}₁₀ <span class="enc-op">=</span> <span class="enc-res">${qhHex}H</span></div>
           <div class="enc-calc">位 ${wh}₁₀ <span class="enc-op">=</span> <span class="enc-res">${whHex}H</span></div>
           <div class="enc-big">区位码 ${weiCode}<sub style="font-size:.45em;color:var(--text-3)">十进制</sub></div>`);
      }
      if(cur===1){
        return this._card('cur','国标码','区位码 + 2020H（区、位分别 +20H）',
          `<div class="enc-calc">区 ${qhHex}H <span class="enc-op">+ 20H</span> <span class="enc-eq">=</span> <span class="enc-res">${gbQ}H</span></div>
           <div class="enc-calc">位 ${whHex}H <span class="enc-op">+ 20H</span> <span class="enc-eq">=</span> <span class="enc-res">${gbW}H</span></div>
           <div class="enc-big">国标码 ${gbQ}${gbW}H</div>
           <div class="enc-sub">国标码 = 区位码 + 2020H</div>`);
      }
      return this._card('done','机内码','国标码 + 8080H（区、位分别 +80H）',
        `<div class="enc-calc">区 ${gbQ}H <span class="enc-op">+ 80H</span> <span class="enc-eq">=</span> <span class="enc-res">${neiQ}H</span></div>
         <div class="enc-calc">位 ${gbW}H <span class="enc-op">+ 80H</span> <span class="enc-eq">=</span> <span class="enc-res">${neiW}H</span></div>
         <div class="enc-big">机内码 ${neiQ}${neiW}H</div>
         <div class="enc-sub">计算机内部存储汉字使用机内码 · 占 2 字节</div>`);
    };

    /* 步骤 0：区位码 */
    steps.push({desc:`已知汉字区位码：区号 <b class="c-op">${qh}</b>，位号 <b class="c-op">${wh}</b>（十进制）；区、位分别除 16 取余转十六进制：${qh}→${qhHex}H，${wh}→${whHex}H。`,
      draw:()=>{
        const cur=0;
        $('#stage').innerHTML=`<div class="stage-hd"><span>${label}</span><span class="state">区位码 ${qh} ${wh}</span></div>
          <div class="enc-flow">${flow(cur)}</div>
          ${renderCard(cur)}
          <div class="enc-result-strip locked">国标码、机内码将在后续步骤显示</div>`;
      }});
    /* 步骤 1：+2020H 得国标码 */
    steps.push({desc:`国标码 = 区位码 + 2020H：区 ${qhHex}H + 20H = <b class="c-op">${gbQ}H</b>，位 ${whHex}H + 20H = <b class="c-op">${gbW}H</b>，国标码为 <b class="c-op">${gbQ}${gbW}H</b>。`,
      draw:()=>{
        const cur=1;
        $('#stage').innerHTML=`<div class="stage-hd"><span>${label}</span><span class="state">+2020H · 国标码</span></div>
          <div class="enc-flow">${flow(cur)}</div>
          ${renderCard(cur)}
          <div class="enc-result-strip">区位码 ${weiCode} <span class="enc-op">→</span> 国标码 ${gbQ}${gbW}H <span class="enc-op">→</span> <span class="enc-chip empty" style="font-size:inherit;padding:2px 12px">机内码 待计算</span></div>`;
      }});
    /* 步骤 2：+8080H 得机内码 + 完整链路 */
    steps.push({desc:`机内码 = 国标码 + 8080H：区 ${gbQ}H + 80H = <b class="c-op">${neiQ}H</b>，位 ${gbW}H + 80H = <b class="c-op">${neiW}H</b>；汉字在机内占 <b>2 字节</b>。完整链路：区位码 ${weiCode} → 国标码 ${gbQ}${gbW}H → 机内码 ${neiQ}${neiW}H。`,
      draw:()=>{
        const cur=2;
        $('#stage').innerHTML=`<div class="stage-hd"><span>${label}</span><span class="state">+8080H · 机内码</span></div>
          <div class="enc-flow">${flow(cur)}</div>
          ${renderCard(cur)}
          <div class="enc-result-strip">区位码 ${weiCode} <span class="enc-op">→</span> 国标码 ${gbQ}${gbW}H <span class="enc-op">→</span> 机内码 ${neiQ}${neiW}H <span class="enc-op">（2 字节）</span></div>`;
      }});
    return steps;
  },

  /* ========== ④ 字形码容量：规格 → 总点数 → 字节数 → 总容量（覆盖式，每步只显示当前计算） ========== */
  genFont(){
    const elSize=$('#e-font-size'), elCount=$('#e-font-count');
    let size=elSize?+elSize.value:16;
    if(![16,24,32].includes(size)) size=16;
    this._fontSize=String(size);
    let count=elCount?parseInt(elCount.value.trim(),10):1000;
    if(!count||count<1) count=1000;
    this._fontCount=String(count);
    const w=size,h=size;
    const bits=w*h;
    const bytes=bits/8;
    const total=bytes*count;
    const kb=total/1024;
    const label='字形码容量';
    const steps=[];

    const renderCard=(cur)=>{
      /* 卡片 0：已知参数 */
      if(cur===0){
        return this._card('cur','① 已知参数','点阵规格 · 汉字数量',
          `<div class="enc-chip-row">
              <span class="enc-chip src">${w} × ${h} 点阵</span>
              <span class="enc-chip src">${count} 个汉字</span>
            </div>
            <div class="enc-sub">点阵中每个点用 1 位二进制表示</div>`);
      }
      /* 卡片 1：总点数 */
      if(cur===1){
        return this._card('cur','② 计算每字总点数','宽 × 高 = 点数',
          `<div class="enc-calc">${w} <span class="enc-op">×</span> ${h} <span class="enc-eq">=</span> <span class="enc-res">${bits} 点</span></div>
           <div class="enc-sub">每个汉字的点阵总点数 = ${w} × ${h} = ${bits} 点</div>`);
      }
      /* 卡片 2：字节数 */
      if(cur===2){
        return this._card('cur','③ 换算每字字节数','点数 ÷ 8（1 字节 = 8 位）',
          `<div class="enc-calc">${bits} <span class="enc-op">÷ 8</span> <span class="enc-eq">=</span> <span class="enc-res">${bytes} 字节/字</span></div>
           <div class="enc-sub">每字占用 ${bytes} 字节存储</div>`);
      }
      /* 卡片 3：总容量 */
      return this._card('done','④ 字库总存储容量','每字字节数 × 汉字数量',
        `<div class="enc-calc">${bytes} <span class="enc-op">×</span> ${count} <span class="enc-eq">=</span> <span class="enc-res">${total.toLocaleString()} B</span></div>
         <div class="enc-calc">${total.toLocaleString()} B <span class="enc-op">÷ 1024 ≈</span> <span class="enc-res">${kb.toFixed(1)} KB</span></div>
         <div class="enc-sub">1 KB = 1024 B</div>`);
    };

    /* 步骤 0：已知参数 */
    steps.push({desc:`题目：<b class="c-op">${w}×${h}</b> 点阵字形码，共 <b class="c-op">${count}</b> 个汉字，分步计算该字库的总存储容量。`,
      draw:()=>{
        const cur=0;
        $('#stage').innerHTML=`<div class="stage-hd"><span>${label}</span><span class="state">${w}×${h} 点阵 · ${count} 字</span></div>
          <div class="step-title"><span class="st-dot"></span>已知参数</div>
          ${renderCard(cur)}
          <div class="enc-result-strip locked">总容量结果将在最后一步汇总显示</div>`;
      }});
    /* 步骤 1：总点数 */
    steps.push({desc:`每个汉字的点阵总点数 = 宽 × 高 = ${w} × ${h} = <b class="c-op">${bits}</b> 点。`,
      draw:()=>{
        const cur=1;
        $('#stage').innerHTML=`<div class="stage-hd"><span>${label}</span><span class="state">每字总点数</span></div>
          <div class="step-title"><span class="st-dot"></span>计算每字占用点数</div>
          ${renderCard(cur)}
          <div class="enc-result-strip locked">总容量结果将在最后一步汇总显示</div>`;
      }});
    /* 步骤 2：每字字节数 */
    steps.push({desc:`每字字节数 = 点阵点数 ÷ 8 = ${bits} ÷ 8 = <b class="c-op">${bytes}</b> 字节/字（1 字节 = 8 位）。`,
      draw:()=>{
        const cur=2;
        $('#stage').innerHTML=`<div class="stage-hd"><span>${label}</span><span class="state">每字字节数</span></div>
          <div class="step-title"><span class="st-dot"></span>点数 ÷ 8 换算为字节</div>
          ${renderCard(cur)}
          <div class="enc-result-strip locked">总容量结果将在最后一步汇总显示</div>`;
      }});
    /* 步骤 3：总容量 */
    steps.push({desc:`总容量 = 每字字节数 × 汉字数 = ${bytes} × ${count} = <b class="c-op">${total.toLocaleString()}</b> 字节 ≈ <b class="c-op">${kb.toFixed(1)} KB</b>（1 KB = 1024 B）。`,
      draw:()=>{
        const cur=3;
        $('#stage').innerHTML=`<div class="stage-hd"><span>${label}</span><span class="state">完成</span></div>
          <div class="step-title"><span class="st-dot"></span>字库总容量</div>
          ${renderCard(cur)}
          <div class="enc-result-strip">${w}×${h} 点阵 × ${count} 字 = ${total.toLocaleString()} B ≈ ${kb.toFixed(1)} KB</div>`;
      }});
    return steps;
  },

  /* 初始化演示画布（切换子页面时清空旧内容） */
  initStage(){

  }
};

  afterSettings(){

     'md-i-w','md-i-h','md-i-bits'].forEach(bind);

  /* ---------- 内部辅助 ---------- */
  _fmt(n){
    n=Number(n);
    if(!isFinite(n)) return '—';
    return Number.isInteger(n) ? n.toLocaleString('en-US') : n.toLocaleString('en-US',{maximumFractionDigits:2});
  },
  _num(id, def, label, min, integer){
    const el=$(id); let raw=el?el.value.trim():'';
    if(raw==='') raw=String(def);
    if(!/^\d+(?:\.\d+)?$/.test(raw)) throw new Error(`${label}需为非负数字，当前输入「${raw}」`);
    const n=Number(raw);
    if(!isFinite(n)||n<min) throw new Error(`${label}需 ≥ ${min}`);
    if(integer && !Number.isInteger(n)) throw new Error(`${label}需为整数`);
    return n;
  },
  /* 字节 → 易读单位 */
  humanSize(bytes){
    if(bytes>=1073741824) return [bytes/1073741824,'GB'];
    if(bytes>=1048576) return [bytes/1048576,'MB'];
    if(bytes>=1024) return [bytes/1024,'KB'];
    return [bytes,'B'];
  },
  /* 单位换算过程行（B → KB → MB → GB，逐级展示） */
  _convLines(bytes){
    const out=[];
    if(bytes>=1024){
      const kb=bytes/1024;
      out.push(`<div>${this._fmt(bytes)} B <span class="mm-op">÷ 1024 =</span> <span class="mm-num g">${this._fmt(kb)} KB</span></div>`);
      if(bytes>=1048576){
        const mb=kb/1024;
        out.push(`<div>${this._fmt(kb)} KB <span class="mm-op">÷ 1024 =</span> <span class="mm-num hot">${this._fmt(mb)} MB</span></div>`);
        if(bytes>=1073741824){
          const gb=mb/1024;
          out.push(`<div>${this._fmt(mb)} MB <span class="mm-op">÷ 1024 =</span> <span class="mm-num hot">${this._fmt(gb)} GB</span></div>`);
        }
      }
    }
    return out.join('');
  },
  /* 覆盖式步骤画布：blocks 为 {title, desc, body} 数组；第 i 步只渲染当前步骤，历史步骤由 Engine 回退重绘 */
  _renderStep(label, statePrefix, blocks, i){
    const bk=blocks[i];
    $('#stage').innerHTML=`<div class="stage-hd"><span>${label}</span><span class="state">${statePrefix} 第 ${i+1}/${blocks.length} 步</span></div>
      <div class="mm-wrap">
        <div class="mm-step cur write-in">
          <div class="mm-step-hd"><span class="mm-idx">${i+1}</span>${bk.title}
            <span class="mm-status">进行中</span></div>
          <div class="mm-note" style="margin-bottom:clamp(6px,1vw,10px)">${bk.desc}</div>
          <div class="mm-body">${bk.body()}</div>
        </div>
      </div>`;
  },
  _stepsFromBlocks(label, statePrefix, blocks){
    return blocks.map((bk,i)=>({
      desc:bk.desc,
      draw:()=>this._renderStep(label, statePrefix, blocks, i)
    }));
  },

  /* ========== ① 音频容量 ========== */
  genAudio(){
    const t=this._num('#md-a-time',60,'时长',0.001);
    const srVal=this._num('#md-a-sr-val',44100,'采样率数值',0.000001);
    const unitEl=$('#md-a-sr-unit');
    const srUnit=unitEl?unitEl.value:(this._srUnit||'Hz');
    this._srUnit=srUnit;
    const factor=srUnit==='MHz'?1000000:srUnit==='kHz'?1000:1;
    const srHz=srVal*factor;
    const bits=this._num('#md-a-bits',16,'采样位数',1,true);
    const ch=this._num('#md-a-ch',2,'声道数',1,true);

    const bitPerSec=srHz*bits;            // 每秒 bit（单声道）
    const bitPerSecCh=bitPerSec*ch;       // 每秒 bit（全部声道）
    const bitsTotal=bitPerSecCh*t;        // 总 bit
    const bytes=bitsTotal/8;
    const h=this.humanSize(bytes);
    const label='音频文件（未压缩）';
    const srHzTxt=this._fmt(srHz);

    const blocks=[
      { title:'已知参数与公式',
        desc:`已知参数：时长 <b class="c-op">${this._fmt(t)} 秒</b>、采样率 <b class="c-op">${this._fmt(srVal)} ${srUnit}</b>${srUnit!=='Hz'?`（= ${srHzTxt} Hz）`:''}、采样位数 <b class="c-op">${bits} bit</b>、声道数 <b class="c-op">${ch}</b>；音频容量 = 采样率(Hz) × 采样位数(bit) × 声道数 × 时长(s) ÷ 8（字节）。`,
        body:()=>`
          <div class="mm-chips">
            <span class="mm-chip done"><span class="mm-chip-l">时长</span>${this._fmt(t)} s</span>
            <span class="mm-chip done"><span class="mm-chip-l">采样率</span>${this._fmt(srVal)} ${srUnit}${srUnit!=='Hz'?`<div class="mm-note" style="margin:0">= ${srHzTxt} Hz</div>`:''}</span>
            <span class="mm-chip done"><span class="mm-chip-l">采样位数</span>${bits} bit</span>
            <span class="mm-chip done"><span class="mm-chip-l">声道数</span>${ch}</span>
          </div>
          <div class="mm-formula">采样率(Hz) <span class="mm-op">×</span> 采样位数(bit) <span class="mm-op">×</span> 声道数 <span class="mm-op">×</span> 时长(s) <span class="mm-op">=</span> 总 bit 数；总 bit <span class="mm-op">÷ 8</span> = 字节数</div>
          <div class="mm-note">单位换算：1 kHz = 1000 Hz，1 MHz = 1,000,000 Hz，内部统一换算为 Hz 后再参与计算。</div>`
      },
      { title:'采样率 × 采样位数',
        desc:`采样率 <b class="c-op">${srHzTxt} Hz</b>（每秒采样 ${srHzTxt} 次）× 采样位数 <b class="c-op">${bits} bit</b>/采样点 = <b class="c-op">${this._fmt(bitPerSec)}</b> bit/s（单声道每秒所需 bit）。`,
        body:()=>`
          <div><span class="mm-num g">${srHzTxt} Hz</span><span class="mm-op">×</span><span class="mm-num hot">${bits} bit</span><span class="mm-op">=</span><span class="mm-num">${this._fmt(bitPerSec)}</span> <span style="font-size:clamp(13px,1.8vw,17px);color:var(--text-3)">bit/s</span></div>
          <div class="mm-note">每个采样点用 ${bits} bit 表示，每秒采样 ${srHzTxt} 次。</div>`
      },
      { title:'× 声道数',
        desc:`再乘声道数 <b class="c-op">${ch}</b>：${this._fmt(bitPerSec)} × ${ch} = <b class="c-op">${this._fmt(bitPerSecCh)}</b> bit/s（全部声道每秒总数据量）。`,
        body:()=>`
          <div><span class="mm-num g">${this._fmt(bitPerSec)}</span><span class="mm-op">×</span><span class="mm-num hot">${ch}</span><span class="mm-op">=</span><span class="mm-num">${this._fmt(bitPerSecCh)}</span> <span style="font-size:clamp(13px,1.8vw,17px);color:var(--text-3)">bit/s</span></div>
          <div class="mm-note">${ch} 个声道同时采样，每秒数据量为单声道的 ${ch} 倍。</div>`
      },
      { title:'× 时长',
        desc:`再乘时长 <b class="c-op">${this._fmt(t)} s</b>：${this._fmt(bitPerSecCh)} × ${this._fmt(t)} = <b class="c-op">${this._fmt(bitsTotal)}</b> bit（文件总数据量）。`,
        body:()=>`
          <div><span class="mm-num g">${this._fmt(bitPerSecCh)}</span><span class="mm-op">×</span><span class="mm-num hot">${this._fmt(t)} s</span><span class="mm-op">=</span><span class="mm-num">${this._fmt(bitsTotal)}</span> <span style="font-size:clamp(13px,1.8vw,17px);color:var(--text-3)">bit</span></div>
          <div class="mm-note">每秒 bit 数 × 时长（秒）= 文件总 bit 数。</div>`
      },
      { title:'bit ÷ 8 = 字节',
        desc:`1 字节 = 8 bit，${this._fmt(bitsTotal)} ÷ 8 = <b class="c-op">${this._fmt(bytes)}</b> 字节（B）。`,
        body:()=>`
          <div><span class="mm-num g">${this._fmt(bitsTotal)} bit</span><span class="mm-op">÷ 8 =</span><span class="mm-num hot">${this._fmt(bytes)} B</span></div>
          <div class="mm-note">除以 8 是把 bit 换算为字节。</div>`
      },
      { title:'容量单位换算与结果',
        desc:`总容量 = <b class="c-op">${this._fmt(bytes)}</b> 字节 ≈ <b class="c-op">${h[0].toFixed(2)} ${h[1]}</b>（1 KB = 1024 B）。`,
        body:()=>`
          <div class="mm-conv">${this._convLines(bytes)}</div>
          <div class="mm-result">${this._fmt(t)} s × ${srHzTxt} Hz × ${bits} bit × ${ch} 声道 ÷ 8<br>= ${this._fmt(bytes)} B ≈ ${h[0].toFixed(2)} ${h[1]}</div>`
      }
    ];
    return this._stepsFromBlocks(label,'音频计算',blocks);
  },

  /* ========== ② 视频容量 ========== */
  genVideo(){
    const t=this._num('#md-v-time',10,'时长',0.001);
    const fps=this._num('#md-v-fps',24,'帧率',1,true);
    const w=this._num('#md-v-w',1280,'宽度',1,true);
    const h=this._num('#md-v-h',720,'高度',1,true);
    const bits=this._num('#md-v-bits',24,'位深',1,true);

    const pxPerFrame=w*h;
    const bitsPerFrame=pxPerFrame*bits;
    const bitsPerSec=bitsPerFrame*fps;
    const bitsTotal=bitsPerSec*t;
    const bytes=bitsTotal/8;
    const hh=this.humanSize(bytes);
    const label='视频文件（未压缩）';

    const blocks=[
      { title:'已知参数与公式',
        desc:`已知参数：时长 <b class="c-op">${this._fmt(t)} 秒</b>、帧率 <b class="c-op">${fps} fps</b>、分辨率 <b class="c-op">${w}×${h}</b>、位深 <b class="c-op">${bits} bit</b>；视频容量 = 时长(s) × 帧率(fps) × 宽 × 高 × 位深(bit) ÷ 8（字节）。`,
        body:()=>`
          <div class="mm-chips">
            <span class="mm-chip done"><span class="mm-chip-l">时长</span>${this._fmt(t)} s</span>
            <span class="mm-chip done"><span class="mm-chip-l">帧率</span>${fps} fps</span>
            <span class="mm-chip done"><span class="mm-chip-l">分辨率</span>${w} × ${h} px</span>
            <span class="mm-chip done"><span class="mm-chip-l">位深</span>${bits} bit</span>
          </div>
          <div class="mm-formula">时长(s) <span class="mm-op">×</span> 帧率(fps) <span class="mm-op">×</span> 宽 <span class="mm-op">×</span> 高 <span class="mm-op">×</span> 位深(bit) <span class="mm-op">=</span> 总 bit 数；总 bit <span class="mm-op">÷ 8</span> = 字节数</div>`
      },
      { title:'宽 × 高 = 每帧像素',

function ipToArr(ip){return ip.split('.').map(Number);}
function arrToIp(a){return a.join('.');}
function ipAnd(a,b){return a.map((v,i)=>v&b[i]);}
function ipOr(a,b){return a.map((v,i)=>v|b[i]);}
function ipNot(a){return a.map(v=>255-v);}
function ipAdd(a,n){let v=a[0]*16777216+a[1]*65536+a[2]*256+a[3]+n;return [(v>>>24)&255,(v>>>16)&255,(v>>>8)&255,v&255];}
function prefixToMask(p){const m=[];for(let i=0;i<4;i++){const s=Math.max(0,Math.min(8,p-i*8));m.push(s===8?255:s===0?0:256-Math.pow(2,8-s));}return m;}
function ipClass(a){const f=a[0];if(f>=1&&f<=126)return['A','255.0.0.0','/8'];if(f===127)return['A(回环)','255.0.0.0','/8'];if(f>=128&&f<=191)return['B','255.255.0.0','/16'];if(f>=192&&f<=223)return['C','255.255.255.0','/24'];if(f>=224&&f<=239)return['D(组播)','—','—'];return['E(保留)','—','—'];}

        if(role==='mask'){ cls = isNet ? 'nb' : 'hb-zero'; }
        else if(role==='result'){ cls = 'rs'; }
        else if(role==='broad' && highlightHost && !isNet){ cls = 'hb-hot'; }
        else { cls = isNet ? 'nb' : 'hb'; }
        return `<div class="bd32 ${cls} write-in" style="animation-delay:${delayBase+pos*0.018}s">${b}</div>`;
      }).join(''));
    }
    const groupsHtml = groups.map((g,i)=>`<div class="grp32">${g}</div>${i<3?'<div class="bin-dot">.</div>':''}`).join('');
    return `<div class="bin32-row">
      <span class="bin32-label">${label}</span>
      <div class="bin32-groups">${groupsHtml}</div>
    </div>`;
  },
  /* 点分格式二进制字符串（逐位着色：网络位蓝、主机位绿/橙，8 位一组加点） */
  binDottedColored(arr, prefix, role){
    const segs = arr.map((v, oct)=>{
      const bits = this.segBin(v).split('');
      return bits.map((b,k)=>{
        const pos = oct*8+k;
        const isNet = pos < prefix;
        let cls;
        if(role==='mask'){ cls = isNet ? 'nb-t' : 'hb-zero-t'; }
        else if(role==='broad'){ cls = isNet ? 'nb-t' : 'hb-hot-t'; }
        else { cls = isNet ? 'nb-t' : 'hb-t'; }
        return `<span class="${cls}">${b}</span>`;
      }).join('');
    });
    return segs.join('<span class="bin-dot-t">.</span>');
  },
  /* 图例：网络位 / 主机位 / 结果色 */
  legendHTML(){
    return `<div class="bin32-legend">
      <span class="lg"><span class="sw" style="background:#EEF3FF;border:1px solid #C7D2FE"></span>网络位（蓝）</span>
      <span class="lg"><span class="sw" style="background:#E8FBF0;border:1px solid #BFE9CF"></span>主机位（绿）</span>
      <span class="lg"><span class="sw" style="background:#FFF4DB;border:1px solid var(--orange)"></span>AND 结果 / 变化位（橙）</span>
    </div>`;
  },

  _randIp(){
    return [randInt(1,254), randInt(0,255), randInt(0,255), randInt(1,254)].join('.');
  },
  _parseIp(){
    const el = $('#ip-addr');
    let s = el ? el.value.trim() : '';
    if(!s){ s = this._ip || this._randIp(); if(el) el.value = s; }
    const parts = s.split('.');
    if(parts.length !== 4) throw new Error('IP 必须为 4 段点分十进制，如 192.168.1.10');
    parts.forEach(p=>{
      if(!/^\d{1,3}$/.test(p)) throw new Error(`段「${p}」不是数字`);
      if(+p < 0 || +p > 255) throw new Error(`段「${p}」超出 0~255`);
    });
    const arr = ipToArr(s);
    this._ip = arrToIp(arr);
    return { str:this._ip, arr };
  },
  _readPrefix(){
    const el = $('#ip-prefix');
    let v = el ? el.value : '24';
    if(v === 'auto' || v === '' || v == null) v = 24;
    this._prefix = +v;
    return this._prefix;
  },
  typeChars(text){
    return [...String(text)].map((ch,i)=>`<span class="char-in" style="animation-delay:${i*0.06}s">${esc(ch)}</span>`).join('');
  },
  classRows(){
    return [
      {key:'A', range:'1 ~ 126', mask:'255.0.0.0', prefix:'/8',  note:''},
      {key:'B', range:'128 ~ 191', mask:'255.255.0.0', prefix:'/16', note:''},
      {key:'C', range:'192 ~ 223', mask:'255.255.255.0', prefix:'/24', note:''},
      {key:'D', range:'224 ~ 239', mask:'—', prefix:'—', note:'组播地址，无默认主机掩码'},
      {key:'E', range:'240 ~ 255', mask:'—', prefix:'—', note:'保留地址，无默认主机掩码'}
    ];
  },
  classifyOf(arr){
    const cls = ipClass(arr);
    const key = cls[0][0];
    const rows = this.classRows();
    const row = rows.find(r=>r.key===key) || rows[0];
    const note = cls[0].includes('(') ? '127.x 为回环地址（仍属 A 类保留段）' : row.note;
    return Object.assign({}, row, { mask:cls[1], prefix:cls[2], note });
  },
  ipRow(arr, curSeg, label, doneAll){
    return `<div class="ip-row">${arr.map((v,i)=>`<div class="seg ${i===curSeg?'cur':doneAll?'done':''} ${i===curSeg?'write-in':''}"><div class="seg-hd">${label||('第 '+(i+1)+' 段')}</div><div class="val">${v}</div></div>`).join('')}</div>`;
  },

  /* ========== ① classify：IPv4 地址分类 ========== */
  genClassify(){
    const { str, arr } = this._parseIp();
    const f = arr[0];
    const cat = this.classifyOf(arr);
    const rows = this.classRows();
    const label = 'IPv4 地址分类';
    const steps = [];
    // 1. 逐段写出 IP 地址
    steps.push({ desc:`写出待分类的 IPv4 地址：<b class="c-op">${str}</b>`,
      draw:()=>{
        $('#stage').innerHTML = `<div class="stage-hd"><span>${label}</span><span class="state">准备</span></div>
          <div style="text-align:center;padding:clamp(18px,3vw,28px) 0">
            <span style="font-family:var(--mono);font-size:clamp(22px,4vw,32px);font-weight:700;color:var(--text)">${this.typeChars(str)}</span>
            <span class="caret pen"></span>
          </div>`;
      }});
    // 2. 高亮第一段
    steps.push({ desc:`IPv4 只依据<b>第一段</b>判断类别，当前第一段 = <b class="c-op">${f}</b>。`,
      draw:()=>{
        $('#stage').innerHTML = `<div class="stage-hd"><span>${label}</span><span class="state">观察第一段</span></div>
          <div class="ip-row">${arr.map((v,i)=>`<div class="seg ${i===0?'cur':''} write-in" style="animation-delay:${i*0.08}s"><div class="seg-hd">第 ${i+1} 段</div><div class="val">${v}</div></div>`).join('')}</div>
          <div class="annot" style="text-align:center">分类只看<b>第一段</b>的取值范围，后三段不影响类别</div>`;
      }});
    // 3. 对照表判定类别
    steps.push({ desc:`对照分类范围：第一段 ${f} 落在 <b>${cat.range}</b>，属于 <b class="c-op">${cat.key} 类</b>。`,
      draw:()=>{
        $('#stage').innerHTML = `<div class="stage-hd"><span>${label}</span><span class="state">对照分类表</span></div>
          <div class="step-title"><span class="st-dot"></span>IPv4 分类对照表（看第一段）</div>
          <table class="exp-table">
            <tr><th>类别</th><th>第一段范围</th><th>默认掩码</th><th>前缀</th></tr>
            ${rows.map((r,i)=>`<tr class="write-in" style="animation-delay:${i*0.07}s">
              <td class="${r.key===cat.key?'cur':'done'}" style="font-weight:700">${r.key} 类</td>
              <td class="${r.key===cat.key?'cur':''}">${r.range}</td>
              <td class="${r.key===cat.key?'cur':''}">${r.mask}</td>
              <td class="${r.key===cat.key?'cur':''}">${r.prefix}</td>
            </tr>`).join('')}
          </table>`;
      }});
    // 4. 写出默认掩码结果
    steps.push({ desc:`${cat.key} 类默认子网掩码 = <b class="c-op">${cat.mask}</b>${cat.prefix!=='—'?`（${cat.prefix}）`:''}${cat.note?`，${cat.note}`:''}。`,
      draw:()=>{
        $('#stage').innerHTML = `<div class="stage-hd"><span>${label}</span><span class="state">完成</span></div>
          ${this.ipRow(arr,-1,'',true)}
          <div class="ip-info">
            <div class="ii"><div class="ii-hd">类别范围（第一段）</div><div class="ii-val">${cat.range}</div></div>
            <div class="ii"><div class="ii-hd">默认子网掩码</div><div class="ii-val">${cat.mask}</div></div>
            <div class="ii"><div class="ii-hd">网络前缀</div><div class="ii-val">${cat.prefix}</div></div>
          </div>
          <div class="write-result">${str} → ${cat.key} 类 · 默认掩码 ${cat.mask}${cat.prefix!=='—'?` (${cat.prefix})`:''}</div>`;
      }});
    return steps;
  },

  /* ========== ② mask：子网掩码计算 ========== */
  genMask(){
    const prefix = this._readPrefix();
    const mask = prefixToMask(prefix);
    const hostBits = 32 - prefix;
    const bin = mask.map(v=>this.segBin(v));
    const label = '子网掩码计算';
    const steps = [];
    // 1. 写出前缀
    steps.push({ desc:`子网前缀 <b class="c-op">/${prefix}</b>：前 ${prefix} 位为网络位（1），后 ${hostBits} 位为主机位（0）。`,
      draw:()=>{
        $('#stage').innerHTML = `<div class="stage-hd"><span>${label}</span><span class="state">准备</span></div>
          <div style="text-align:center;padding:clamp(16px,3vw,24px) 0">
            <span style="font-family:var(--mono);font-size:clamp(22px,4vw,30px);font-weight:700;color:var(--text)">/${this.typeChars(String(prefix))}</span>
            <span class="caret pen"></span>
          </div>
          <div class="flow-line" style="justify-content:center">
            <span class="part">网络位 <b class="res">${prefix}</b> 位</span><span class="part">主机位 <b class="res">${hostBits}</b> 位</span>
          </div>`;
      }});
    // 2. 32 位二进制逐位填写（前 N 位 1，后 M 位 0）
    steps.push({ desc:`写出掩码二进制：前 <b>${prefix}</b> 位填 1（网络位），后 <b>${hostBits}</b> 位填 0（主机位）。`,
      draw:()=>{
        let bits = '';
        for(let oct=0; oct<4; oct++){
          for(let b=0; b<8; b++){
            const pos = oct*8+b;
            const isNet = pos < prefix;
            bits += `<div class="bd ${isNet?'mask':''} write-in" style="animation-delay:${pos*0.018}s">${isNet?'1':'0'}</div>`;
          }
        }
        $('#stage').innerHTML = `<div class="stage-hd"><span>${label}</span><span class="state">32 位二进制</span></div>
          <div class="step-title"><span class="st-dot"></span>二进制掩码（蓝=网络位 1，灰=主机位 0）</div>
          <div class="bin-grid">${bits}</div>`;
      }});
    // 3-6. 逐段二进制 → 十进制（位权展开求和）
    for(let i=0; i<4; i++){
      const oct = i;
      const { active, sum } = this.weightExpand(bin[oct]);
      const sumExpr = active.length ? active.join(' + ') : '0';
      steps.push({ desc:`第 ${oct+1} 段：二进制 <b class="c-op">${bin[oct]}</b>，按位权展开 ${sumExpr} = <b class="c-op">${mask[oct]}</b>。`,
        draw:()=>{
          const gridBits = mask.map((v,j)=>this.segBin(v).split('').map((b,k)=>
            `<div class="bd ${j<oct?'net':j===oct?'cur':'empty'} ${j===oct?'write-in':''}" style="${j===oct?`animation-delay:${k*0.05}s`:''}">${j<=oct?b:'?'}</div>`).join('')).join('');
          $('#stage').innerHTML = `<div class="stage-hd"><span>${label}</span><span class="state">第 ${oct+1}/4 段</span></div>
            <div class="step-title"><span class="st-dot"></span>二进制 → 点分十进制（位权展开）</div>
            <div class="bin-grid">${gridBits}</div>
            ${this.weightCard(bin[oct])}
            <div class="ip-row">${mask.map((v,j)=>`<div class="seg ${j<oct?'done':j===oct?'cur write-in':''}"><div class="seg-hd">第 ${j+1} 段</div><div class="val">${j<=oct?v:'?'}</div></div>`).join('')}</div>`;
        }});
    }
    // 7. 拼接点分十进制结果
    steps.push({ desc:`四段拼接得子网掩码：<b class="c-op">${arrToIp(mask)}</b>（/${prefix}），网络位 ${prefix} 位、主机位 ${hostBits} 位。`,
      draw:()=>{
        $('#stage').innerHTML = `<div class="stage-hd"><span>${label}</span><span class="state">完成</span></div>
          <div class="step-title"><span class="st-dot"></span>子网掩码</div>
          ${this.ipRow(mask,-1,'掩码',true)}
          <div class="write-result">/${prefix} → 掩码 ${arrToIp(mask)} · 网络位 ${prefix} 位 / 主机位 ${hostBits} 位</div>`;
      }});
    return steps;
  },

  /* ========== ③ network：网络地址计算 ========== */
  /* 步骤：IP 二进制 → 掩码二进制 → 逐位 AND → 网络地址二进制 → 转十进制
   * 展示与主机范围页完全一致：8 位分组加点、网络位蓝 / 主机位绿、相同布局对齐 */
  genNetwork(){
    const { str, arr:ip } = this._parseIp();
    const prefix = this._readPrefix();
    const mask = prefixToMask(prefix);
    const net = ipAnd(ip, mask);
    const hostBits = 32 - prefix;
    const label = '网络地址计算';
    const steps = [];
    // 1. 写出 IP 与前缀
    steps.push({ desc:`IP 地址 <b class="c-op">${str}</b>，前缀 /${prefix}，对应掩码 ${arrToIp(mask)}；网络地址 = IP 按位与 子网掩码。`,
      draw:()=>{
        $('#stage').innerHTML = `<div class="stage-hd"><span>${label}</span><span class="state">准备</span></div>
          <div style="text-align:center;padding:clamp(14px,2.5vw,22px) 0">
            <span style="font-family:var(--mono);font-size:clamp(20px,3.5vw,28px);font-weight:700;color:var(--text)">${this.typeChars(str)}<sub style="font-size:.45em;color:var(--text-3)"> /${prefix}</sub></span>
            <span class="caret pen"></span>
          </div>
          ${this.legendHTML()}`;
      }});
    // 2. IP 地址二进制（8 位一组加点）
    steps.push({ desc:`把 IP 地址 ${str} 写成 32 位二进制，按 8 位一组用点分隔；前 ${prefix} 位为网络位（蓝），后 ${hostBits} 位为主机位（绿）。`,
      draw:()=>{
        $('#stage').innerHTML = `<div class="stage-hd"><span>${label}</span><span class="state">IP 二进制</span></div>
          <div class="step-title"><span class="st-dot"></span>IP 地址 32 位二进制（8 位一组，加点分隔）</div>
          ${this.binRow32(ip, prefix, {label:'IP', role:'ip'})}
          <div class="bin32-caption">${this.binDottedColored(ip, prefix, 'ip')}</div>
          ${this.legendHTML()}`;
      }});
    // 3. 子网掩码二进制（8 位一组加点）
    steps.push({ desc:`子网掩码 ${arrToIp(mask)} 的 32 位二进制：前 ${prefix} 位为 1（网络位，蓝），后 ${hostBits} 位为 0（主机位，灰）。`,
      draw:()=>{
        $('#stage').innerHTML = `<div class="stage-hd"><span>${label}</span><span class="state">掩码二进制</span></div>
          <div class="step-title"><span class="st-dot"></span>子网掩码 32 位二进制（8 位一组，加点分隔）</div>
          ${this.binRow32(mask, prefix, {label:'掩码', role:'mask'})}
          <div class="bin32-caption">${this.binDottedColored(mask, prefix, 'mask')}</div>
          ${this.legendHTML()}`;
      }});
    // 4. 按位与运算（逐位展示，三行对齐）
    steps.push({ desc:`逐位按位与（AND）：只有 1 AND 1 = 1，其余均为 0；掩码为 1 的位保留 IP 原值，掩码为 0 的位清 0（主机位全 0）。`,
      draw:()=>{
        const table = `<table class="exp-table" style="margin-top:10px">
          <tr><th>项目</th>${[0,1,2,3].map(k=>`<th>第 ${k+1} 段</th>`).join('')}</tr>
          <tr><th>IP</th>${ip.map(v=>`<td class="done">${v}</td>`).join('')}</tr>
          <tr><th>掩码</th>${mask.map(v=>`<td class="done">${v}</td>`).join('')}</tr>
          <tr><th>AND 结果</th>${net.map(v=>`<td class="cur">${v}</td>`).join('')}</tr>
        </table>`;
        $('#stage').innerHTML = `<div class="stage-hd"><span>${label}</span><span class="state">逐位 AND</span></div>
          <div class="step-title"><span class="st-dot"></span>IP AND 掩码（逐位计算，8 位一组对齐）</div>
          <div class="calc-process" style="margin-top:6px">
            <div class="cp-label">逐位按位与：1 AND 1 = 1，1 AND 0 = 0，0 AND 1 = 0，0 AND 0 = 0</div>
            ${this.binRow32(ip, prefix, {label:'IP', role:'ip'})}
            ${this.binRow32(mask, prefix, {label:'掩码', role:'mask'})}
            ${this.binRow32(net, prefix, {label:'结果', role:'result'})}
          </div>
          ${table}
          ${this.legendHTML()}`;
      }});
    // 5. 网络地址二进制（主机位全 0）
    steps.push({ desc:`按位与结果即网络地址二进制：网络位保持不变，主机位全部清 0（绿色 0）。`,
      draw:()=>{
        $('#stage').innerHTML = `<div class="stage-hd"><span>${label}</span><span class="state">网络地址二进制</span></div>
          <div class="step-title"><span class="st-dot"></span>网络地址 32 位二进制（主机位全 0）</div>
          ${this.binRow32(net, prefix, {label:'网络地址', role:'net'})}
          <div class="bin32-caption">${this.binDottedColored(net, prefix, 'net')}</div>
          ${this.legendHTML()}`;
      }});
    // 6. 网络地址二进制 → 十进制
    steps.push({ desc:`网络地址二进制转点分十进制 = <b class="c-op">${arrToIp(net)}</b>（主机位全 0），/${prefix}。`,
      draw:()=>{
        $('#stage').innerHTML = `<div class="stage-hd"><span>${label}</span><span class="state">完成</span></div>
          <div class="step-title"><span class="st-dot"></span>网络地址（点分十进制）</div>
          ${this.ipRow(net,-1,'网络地址',true)}
          <div class="write-result">网络地址 = ${arrToIp(net)} /${prefix}</div>`;
      }});
    return steps;
  },

  /* ========== ④ hostrange：主机范围与数量 ========== */
  /* 二进制展示与网络地址页完全一致：8 位分组加点、网络位蓝 / 主机位绿、相同布局对齐 */
  genHostrange(){
    const { str, arr:ip } = this._parseIp();
    const prefix = this._readPrefix();
    const mask = prefixToMask(prefix);
    const net = ipAnd(ip, mask);
    const notMask = ipNot(mask);
    const broad = ipOr(net, notMask);
    const first = ipAdd(net, 1);
    const last = ipAdd(broad, -1);
    const hostBits = 32 - prefix;
    const count = Math.pow(2, hostBits) - 2;
    const label = '主机范围与数量';
    const steps = [];
    // 1. 网络地址（统一二进制展示，与网络地址页一致）
    steps.push({ desc:`先求网络地址：${str} AND ${arrToIp(mask)} = <b class="c-op">${arrToIp(net)}</b>（主机位全 0）。`,
      draw:()=>{
        $('#stage').innerHTML = `<div class="stage-hd"><span>${label}</span><span class="state">网络地址</span></div>
          <div class="step-title"><span class="st-dot"></span>网络地址（主机位全 0）</div>
          ${this.binRow32(net, prefix, {label:'网络地址', role:'net'})}
          <div class="bin32-caption">${this.binDottedColored(net, prefix, 'net')}</div>
          ${this.ipRow(net,-1,'网络地址',true)}
          <div class="write-result">网络地址 = ${arrToIp(net)} /${prefix}</div>
          ${this.legendHTML()}`;
      }});
    // 2. 广播地址：主机位全 1（逐位 OR，主机位橙色高亮变化）
    steps.push({ desc:`广播地址 = 网络地址的<b>主机位全 1</b>：网络位保持不变，主机位 0→1，得到 <b class="c-op">${arrToIp(broad)}</b>。`,
      draw:()=>{
        $('#stage').innerHTML = `<div class="stage-hd"><span>${label}</span><span class="state">广播地址</span></div>
          <div class="step-title"><span class="st-dot"></span>主机位全 1 → 广播地址（32 位逐位 OR）</div>
          <div class="calc-process">
            <div class="cp-label">网络位（前 ${prefix} 位）保持不变，主机位（后 ${hostBits} 位）全部置 1</div>
            ${this.binRow32(net, prefix, {label:'网络地址', role:'net'})}
            ${this.binRow32(broad, prefix, {label:'广播地址', role:'broad', highlightHost:true})}
          </div>
          <div class="bin32-caption">${this.binDottedColored(broad, prefix, 'broad')}</div>
          <table class="exp-table" style="margin-top:8px">
            <tr><th>项目</th>${[0,1,2,3].map(k=>`<th>段 ${k+1}</th>`).join('')}</tr>
            <tr><th>网络地址</th>${net.map(v=>`<td class="done">${v}</td>`).join('')}</tr>
            <tr><th>广播地址</th>${broad.map(v=>`<td class="cur">${v}</td>`).join('')}</tr>
          </table>
          <div class="exp-inline" style="margin-top:8px"><span class="term done">${arrToIp(net)}</span><span class="op">OR</span><span class="term">${arrToIp(notMask)}</span><span class="op">=</span><span class="term cur">${arrToIp(broad)}</span></div>
          ${this.legendHTML()}`;
      }});
    // 3. 可用主机范围（首台 / 末台主机二进制，统一展示风格）
    steps.push({ desc:`第一个可用主机 = 网络地址 + 1 = <b class="c-op">${arrToIp(first)}</b>；最后一个 = 广播地址 − 1 = <b class="c-op">${arrToIp(last)}</b>。`,
      draw:()=>{
        $('#stage').innerHTML = `<div class="stage-hd"><span>${label}</span><span class="state">可用范围</span></div>
          <div class="step-title"><span class="st-dot"></span>排除网络地址与广播地址（首台 / 末台主机）</div>
          ${this.binRow32(first, prefix, {label:'首台主机', role:'net'})}

    const targetAddrs = [];
    for(let k=1; k<=N; k++) targetAddrs.push(this.colLetter(L.tCol(k)) + L.tRow(k));
    const dirs = [['up','↑','向上'],['down','↓','向下'],['left','←','向左'],['right','→','向右']];
    const dirBtns = dirs.map(([d,arrow,label])=>
      `<button type="button" class="xl-dir-btn ${dir===d?'active':''}" data-dir="${d}" title="${label}">${arrow}</button>`).join('');
    const opts = [1,2,3].map(n=>`<option value="${n}" ${N===n?'selected':''}>${n} 格</option>`).join('');
    return `<div class="inline-setting"><div class="setting"><label>复制方向</label>
        <div class="xl-dir-row">${dirBtns}</div></div></div>
      <div class="inline-setting"><div class="setting"><label>复制步数</label>
        <select id="excel-steps">${opts}</select></div></div>
      <div class="inline-setting"><div class="setting"><label>当前路径</label>
        <div class="annot" style="padding:4px 8px">起点 <b>${anchor}</b>，向${L.label}复制 ${N} 格：${anchor} → ${targetAddrs.join(' → ')}</div></div></div>`;
  },
  afterSettings(){
    if(this.currentSub === 'func') return;
    document.querySelectorAll('#settingsRow .xl-dir-btn').forEach(b=>{
      b.onclick = ()=>{ this._dir = b.dataset.dir; Engine.reload(); };
    });
    const sel = $('#excel-steps');
    if(sel) sel.onchange = ()=>{ this._steps = +sel.value; Engine.reload(); };
  },

  /* ---------- 工具方法 ---------- */
  colLetter(n){ return String.fromCharCode(64 + n); },
  parseRef(ref){
    const m = /^(\$?)([A-Z]+)(\$?)(\d+)$/.exec(ref);
    return { colLock:m[1]==='$', col:m[2], rowLock:m[3]==='$', row:m[4] };
  },
  offsetRef(ref, dc, dr){
    const p = this.parseRef(ref);
    const colN = p.col.charCodeAt(0) - 64;
    const newCol = p.colLock ? p.col : this.colLetter(colN + dc);
    const newRow = p.rowLock ? p.row : String(Number(p.row) + dr);
    return (p.colLock ? '$' : '') + newCol + (p.rowLock ? '$' : '') + newRow;
  },
  lockSVG(){
    return `<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>`;
  },
  fmtNum(v){ return Number.isInteger(v) ? String(v) : v.toFixed(2); },

  /* 读取用户选择的方向与步数，归一化到合法值 */
  _refLayout(){
    const dir = ['right','down','left','up'].includes(this._dir) ? this._dir : 'right';
    const N = [1,2,3].includes(Number(this._steps)) ? Number(this._steps) : 2;
    return { dir, N, L: DIR_LAYOUT[dir] };
  },
  buildRef(colLock, col, rowLock, row){
    return (colLock ? '$' : '') + col + (rowLock ? '$' : '') + row;
  },

  /* 源公式：按引用类型上色（锁定=绿色锁，相对=橙色） */
  renderRefSource(ref){
    const p = this.parseRef(ref);
    const col = p.colLock
      ? `<span class="ref-lock">$${p.col}${this.lockSVG()}</span>`
      : `<span class="ref-move">${p.col}</span>`;
    const row = p.rowLock
      ? `<span class="ref-lock">$${p.row}${this.lockSVG()}</span>`
      : `<span class="ref-move">${p.row}</span>`;
    return col + row;
  },
  /* 目标公式：变化=橙色，锁定=绿色锁，本方向未偏移=灰色虚线 */
  renderRefTarget(ref, dc, dr){
    const p = this.parseRef(ref);
    const newCol = p.colLock ? p.col : this.colLetter(p.col.charCodeAt(0)-64 + dc);
    const newRow = p.rowLock ? p.row : String(Number(p.row) + dr);
    let col, row;
    if(p.colLock)      col = `<span class="ref-lock">$${newCol}${this.lockSVG()}</span>`;
    else if(dc === 0) col = `<span class="ref-still">${newCol}</span>`;
    else               col = `<span class="ref-move">${newCol}</span>`;
    if(p.rowLock)      row = `<span class="ref-lock">$${newRow}${this.lockSVG()}</span>`;
    else if(dr === 0) row = `<span class="ref-still">${newRow}</span>`;
    else               row = `<span class="ref-move">${newRow}</span>`;
    return col + row;
  },

  /* 单个目标单元格的变化说明（desc=步骤文字，note=汇总表说明） */
  describeTarget(srcRef, dc, dr, addr, k, L){
    const p = this.parseRef(srcRef);
    const newCol = p.colLock ? p.col : this.colLetter(p.col.charCodeAt(0)-64 + dc);
    const newRow = p.rowLock ? p.row : String(Number(p.row) + dr);
    const newRef = (p.colLock ? '$' : '') + newCol + (p.rowLock ? '$' : '') + newRow;
    let colPart, rowPart, noteCol, noteRow;
    if(p.colLock){
      colPart = `列 $${p.col} 被 $ 锁定，保持不变（绿色）`;
      noteCol = `列 $${p.col} 锁定不动`;
    }else if(dc === 0){
      colPart = `同一列内复制，列标 ${p.col} 未偏移（灰色）`;
      noteCol = `同列复制，列标 ${p.col} 未偏移`;
    }else{
      colPart = `列偏移 ${dc>0?'+':''}${dc}：${p.col}→${newCol}（橙色变化）`;
      noteCol = `列 ${p.col}→${newCol}（橙色变化）`;
    }
    if(p.rowLock){
      rowPart = `行 $${p.row} 被 $ 锁定，保持不变（绿色）`;
      noteRow = `行 $${p.row} 锁定不动`;
    }else if(dr === 0){
      rowPart = `同一行内复制，行号 ${p.row} 未偏移（灰色）`;
      noteRow = `同行复制，行号 ${p.row} 未偏移`;
    }else{
      rowPart = `行偏移 ${dr>0?'+':''}${dr}：${p.row}→${newRow}（橙色变化）`;
      noteRow = `行 ${p.row}→${newRow}（橙色变化）`;
    }
    const desc = `向${L.label}复制 ${k} 格到 <b class="c-op">${addr}</b>：${colPart}；${rowPart}，公式变为 <b class="c-op">=${newRef}</b>。`;
    return { desc, note: `${noteCol}；${noteRow}`, newRef };
  },

  /* ---------- 引用复制舞台 ---------- */
  drawRefStage(o){
    const { cfg, srcRef, anchor, L, N, map, visible, phase, targets } = o;
    // 根据复制方向动态裁剪网格范围（只显示涉及的行列，避免大片空行空列）
    const colMin = Math.min(L.refCol,L.anchorCol,L.tCol(N));
    const colMax = Math.max(L.refCol,L.anchorCol,L.tCol(N));
    const rowMin = Math.min(L.refRow,L.anchorRow,L.tRow(N));
    const rowMax = Math.max(L.refRow,L.anchorRow,L.tRow(N));
    const cols=[];
    for(let cc=colMin;cc<=colMax;cc++) cols.push(this.colLetter(cc));
    const targetList = targets.map(t=>t.addr).join('、');
    let html = `<div class="excel-stage">
      <div class="stage-hd"><span>${cfg.title} · 公式复制</span><span class="state">起点 ${anchor} · 向${L.label}复制 ${N} 格：${targetList}</span></div>
      <div class="step-title"><span class="st-dot"></span>${cfg.subtitle}</div>
      <div class="xl-grid" style="grid-template-columns:38px repeat(${cols.length},1fr)">
        <div class="xl-cell hd"></div>${cols.map(c=>`<div class="xl-cell hd">${c}</div>`).join('')}`;
    for(let r=rowMin; r<=rowMax; r++){
      html += `<div class="xl-cell hd">${r}</div>`;
      for(let c=colMin; c<=colMax; c++){
        const cell = this.colLetter(c) + r;
        let cls = '', content = '<span style="color:#E2E8F0">·</span>';
        if(cell === anchor){
          cls = 'sel'; content = '=' + this.renderRefSource(srcRef);
        }else if(map[cell]){
          const t = map[cell];
          if(t.state === 'pending'){ cls = ''; content = '<span style="color:#CBD5E1">?</span>'; }
          else { cls = t.state === 'done' ? 'done' : 'cur'; content = '=' + this.renderRefTarget(srcRef, t.dc, t.dr); }
        }else{
          cls = 'empty-cell';
        }
        html += `<div class="xl-cell ${cls}">${content}</div>`;
      }
    }
    html += `</div>`;

    const curTarget = Object.values(map).find(t=>t.state === 'cur');
    html += `<div class="xl-formula">起点 ${anchor} =${this.renderRefSource(srcRef)}`;
    if(curTarget) html += ` &nbsp;→&nbsp; ${curTarget.addr} =${this.renderRefTarget(srcRef, curTarget.dc, curTarget.dr)}`;
    html += `</div>`;

    if(phase === 'source') html += this.analysisCard(cfg, srcRef, L);
    html += this.refSummaryTable(o, map, visible);
    html += `</div>`;
    $('#stage').innerHTML = html;
  },

  analysisCard(cfg, srcRef, L){
    const p = this.parseRef(srcRef);
    const horizontal = L.dc(1) !== 0;
    const rows = cfg.ana.map((a,i)=>{
      const isCol = i === 0;
      const val = isCol ? p.col : p.row;
      const token = a.lock
        ? `<span class="ref-lock">$${val}${this.lockSVG()}</span>`
        : `<span class="ref-move">${val}</span>`;
      let note;
      if(a.lock){
        note = `<span class="ana-note" style="color:#15803D">${isCol ? '$ 锁定 → 复制后列标不动' : '$ 锁定 → 复制后行号不动'}</span>`;
      }else if(isCol){
        note = horizontal
          ? `<span class="ana-note" style="color:#B45309">相对 → 向${L.label}复制时列标变</span>`
          : `<span class="ana-note" style="color:var(--text-3)">同列复制，列标不偏移</span>`;
      }else{
        note = horizontal
          ? `<span class="ana-note" style="color:var(--text-3)">同行复制，行号不偏移</span>`
          : `<span class="ana-note" style="color:#B45309">相对 → 向${L.label}复制时行号变</span>`;
      }
      return `<div class="ana-row"><span class="ana-label">${a.label}</span>${token}${note}</div>`;
    }).join('');
    return `<div class="ana-card">
      <div style="font-size:clamp(12px,1.5vw,14px);font-weight:700;color:var(--text-3);margin-bottom:6px">引用类型拆解</div>${rows}
    </div>`;
  },

  refSummaryTable(o, map, visible){
    const { srcRef, anchor, L } = o;
    let rows = `<tr><td>${anchor}</td><td>原公式（起点）</td><td>=${this.renderRefSource(srcRef)}</td><td class="note">复制的起点单元格</td></tr>`;
    Object.values(map).slice(0, visible).forEach(t=>{
      rows += `<tr><td>${t.addr}</td><td>向${L.label}复制 ${t.k} 格</td><td>=${this.renderRefTarget(srcRef, t.dc, t.dr)}</td><td class="note">${t.note}</td></tr>`;
    });
    return `<table class="ref-tbl">
      <colgroup><col style="width:14%"><col style="width:22%"><col style="width:22%"><col style="width:42%"></colgroup>
      <thead><tr><th>单元格</th><th>复制方向</th><th>复制后公式</th><th>变化说明</th></tr></thead>
      <tbody>${rows}</tbody></table>`;
  },

  analysisDesc(anchor, srcRef, L){
    return `先拆解 <b class="c-op">${anchor}</b> 中公式 =${srcRef} 的列标、行号两个部分，判断谁会在本次向${L.label}复制时移动、谁保持不动。`;
  },

  finalDesc(cfg, anchor, srcRef, targets, L){
    const p = this.parseRef(srcRef);
    const parts = [];
    if(p.colLock) parts.push('列标被 $ 锁定，始终不变');
    else if(L.dc(1) === 0) parts.push('列标同列复制，不偏移');
    else parts.push('列标随目标位置横向偏移');
    if(p.rowLock) parts.push('行号被 $ 锁定，始终不变');
    else if(L.dr(1) === 0) parts.push('行号同行复制，不偏移');
    else parts.push('行号随目标位置纵向偏移');
    const verify = targets.map(t=>`${t.addr}=${t.formula}`).join('、');
    return `${cfg.title}复制完成：${parts.join('；')}。验证：${verify}。`;
  },

  /* ---------- 单个引用类型：源公式 → 所选方向逐格复制 → 汇总 ---------- */
  genRefCase(type){
    const cfg = REF_CONFIG[type];
    const { N, L } = this._refLayout();
    const colLock = cfg.ana[0].lock, rowLock = cfg.ana[1].lock;
    const anchor = this.colLetter(L.anchorCol) + L.anchorRow;
    const srcRef = this.buildRef(colLock, this.colLetter(L.refCol), rowLock, String(L.refRow));
    const targets = [];
    for(let k=1; k<=N; k++){
      const addr = this.colLetter(L.tCol(k)) + L.tRow(k);
      const dc = L.dc(k), dr = L.dr(k);
      const meta = this.describeTarget(srcRef, dc, dr, addr, k, L);
      targets.push({ addr, dc, dr, k, formula:this.offsetRef(srcRef, dc, dr), desc:meta.desc, note:meta.note });
    }

    const snap = (activeIdx)=>{
      const map = {};
      targets.forEach((t,i)=>{
        let state = 'pending';
        if(activeIdx >= targets.length) state = 'done';
        else if(activeIdx < 0) state = 'pending';
        else if(i < activeIdx) state = 'done';
        else if(i === activeIdx) state = 'cur';
        map[t.addr] = {...t, state};
      });
      return map;
    };

    const steps = [];
    /* 第一步：原公式 + 引用类型分析 */
    steps.push({
      desc: cfg.intro + ' ' + this.analysisDesc(anchor, srcRef, L),
      draw: ()=>{ this.drawRefStage({ cfg, srcRef, anchor, L, N, targets, map:snap(-1), visible:0, phase:'source' }); }
    });
    /* 逐个方向复制 */
    targets.forEach((t,i)=>{
      steps.push({
        desc: t.desc,
        draw: ()=>{ this.drawRefStage({ cfg, srcRef, anchor, L, N, targets, map:snap(i), visible:i+1, phase:'copy' }); }
      });
    });
    /* 汇总完成 */
    steps.push({
      desc: this.finalDesc(cfg, anchor, srcRef, targets, L),
      draw: ()=>{ this.drawRefStage({ cfg, srcRef, anchor, L, N, targets, map:snap(targets.length), visible:targets.length, phase:'done' }); }
    });
    return steps;
  },

  /* ========== ① 相对引用 ========== */
  genRefRel(){ return this.genRefCase('rel'); },
  /* ========== ② 绝对引用 ========== */
  genRefAbs(){ return this.genRefCase('abs'); },
  /* ========== ③ 混合引用：$A1 与 A$1 两组对比 ========== */
  genRefMix(){ return this.genRefCase('mixcol').concat(this.genRefCase('mixrow')); },

  /* ---------- 函数演示网格 ---------- */
  classify(f, cell){
    if(cell.type === 'empty') return {counted:false, reason:'空单元格：无内容，忽略'};
    if(f.accept.includes(cell.type)){
      if(cell.type === 'num')  return {counted:true, reason:'数字：参与本函数计算'};
      if(cell.type === 'text') return {counted:true, reason:'文本：非空，计入 COUNTA'};
      if(cell.type === 'bool') return {counted:true, reason:'逻辑值：非空，计入 COUNTA'};
    }
    if(cell.type === 'text') return {counted:false, reason:'文本：数值函数不参与，忽略'};
    if(cell.type === 'bool') return {counted:false, reason:'逻辑值：区域引用中被忽略'};
    return {counted:false, reason:'忽略'};
  },
  /* A1:D4 中全部空单元格地址 */
  allEmptyAddrs(judged){
    const filled = judged.filter(x=>x.type !== 'empty').map(x=>x.addr);
    const empty = [];
    ['A','B','C','D'].forEach(col=>{ for(let r=1; r<=4; r++){ const a = col + r; if(!filled.includes(a)) empty.push(a); } });
    return empty;
  },
  funcGrid(judged){
    const cols = ['A','B','C','D'];
    const byAddr = {};
    const srcCells = judged || FUNC_CELLS;
    srcCells.forEach(c=>{ byAddr[c.addr] = c; });
    // 仅显示有数据的行（A1:D4 中数据占第 1 行和 C2），避免空行留白
    let maxRow = 2;
    srcCells.forEach(c=>{ if(c.type!=='empty'){ const rr=parseInt(c.addr.slice(1),10); if(rr>maxRow) maxRow=rr; } });
    let html = `<div class="xl-grid" style="grid-template-columns:38px repeat(4,1fr)">
      <div class="xl-cell hd"></div>${cols.map(c=>`<div class="xl-cell hd">${c}</div>`).join('')}`;
    for(let r=1; r<=maxRow; r++){
      html += `<div class="xl-cell hd">${r}</div>`;
      for(let c=1; c<=4; c++){
        const addr = this.colLetter(c) + r;
        const cell = byAddr[addr];
        let cls = '', content = '';
        if(!cell || cell.type === 'empty'){
          cls = 'empty-cell'; content = '<span style="font-size:.65em">空</span>';
        }else{
          if(judged) cls = cell.verdict.counted ? 'done' : 'ignored';
          content = `<div>${cell.disp}</div><span class="type-tag ${cell.type}">${TYPE_META[cell.type].label}</span>`;
        }
        html += `<div class="xl-cell ${cls}">${content}</div>`;
      }
    }
    html += `</div>`;
    return html;
  },

  funcStepDesc(f, judged){
    const counted = judged.filter(x=>x.verdict.counted).map(x=>x.addr);
    const ignored = judged.filter(x=>!x.verdict.counted && x.type !== 'empty').map(x=>x.addr);
    return `函数 <b class="c-op">${f.name}(A1:D4)</b>：${f.verdict} 计入单元格 ${counted.join('、')}${ignored.length ? `；忽略 ${ignored.join('、')} 与所有空单元格` : ''}。`;
  },

  /* ========== ④ 统计函数与数据类型 ========== */
  genFunc(){
    const steps = [];

    /* 0. 区域总览 + 类型图例 */
    steps.push({
      desc:`先认识数据区域 <b class="c-op">A1:D4</b> 中的四类数据：<b>数字</b> 10、20、30；<b>文本</b> "abc"；<b>逻辑值</b> TRUE；以及若干<b>空单元格</b>。不同函数对这些类型的计入规则不同。`,
      draw:()=>{
        let html = `<div class="excel-stage">
          <div class="stage-hd"><span>统计函数与数据类型</span><span class="state">先认识 A1:D4 中的数据类型</span></div>
          <div class="step-title"><span class="st-dot"></span>四类数据：数字 · 文本 · 逻辑值 · 空单元格</div>
          <div class="legend">
            <span class="lg"><span class="swatch" style="background:var(--green-soft);border:1px solid var(--green)"></span>数字：SUM/AVERAGE/COUNT/MAX/MIN 计入</span>
            <span class="lg"><span class="swatch" style="background:#F1F5F9;border:1px solid #CBD5E1"></span>文本：数值函数忽略，COUNTA 计入</span>
            <span class="lg"><span class="swatch" style="background:#F3E8FF;border:1px solid #8B5CF6"></span>逻辑值：区域引用中被数值函数忽略，COUNTA 计入</span>
            <span class="lg"><span class="swatch" style="background:#F8FAFC;border:1px dashed #CBD5E1"></span>空单元格：所有函数都忽略</span>
          </div>
          ${this.funcGrid(null)}
          <div class="annot" style="text-align:center;margin-top:8px">接下来依次演示 SUM、AVERAGE、COUNT、COUNTA、MAX、MIN 六个函数如何识别这些类型。</div>
        </div>`;
        $('#stage').innerHTML = html;
      }
    });

    const results = {};
    FUNCS.forEach(f=>{
      const judged = FUNC_CELLS.map(c=>({...c, verdict:this.classify(f, c)}));
      const counted = judged.filter(x=>x.verdict.counted);
      const res = f.result(counted);
      results[f.name] = { res, counted };
      steps.push({
        desc: this.funcStepDesc(f, judged),
        draw: ()=>this.drawFuncStep(f, judged, res)
      });
    });

    /* 汇总对比 */
    steps.push({
      desc:`六个函数在同一区域 <b>A1:D4</b> 上的结果对比完成。注意 <b>COUNT</b> 只数数字（3 个），<b>COUNTA</b> 数所有非空（5 个）；SUM/AVERAGE/MAX/MIN 只在数字中计算。`,
      draw:()=>this.drawFuncSummary(results)
    });
    return steps;
  },

  drawFuncStep(f, judged, res){
    const counted = judged.filter(x=>x.verdict.counted);
    const emptyAddrs = this.allEmptyAddrs(judged);
    const judgeRows = judged.filter(x=>x.type !== 'empty').map(x=>`
      <div class="judge-row">
        <span class="judge-addr">${x.addr}</span>
        <span class="judge-val">${x.disp}</span>
        <span class="type-tag ${x.type}">${TYPE_META[x.type].label}</span>
        ${x.verdict.counted ? '<span class="chip-ok">计入</span>' : '<span class="chip-no">忽略</span>'}
        <span class="judge-reason">${x.verdict.reason}</span>
      </div>`).join('');
    let html = `<div class="excel-stage">
      <div class="stage-hd"><span>${f.name} ${f.title}</span><span class="state">数据区域 A1:D4</span></div>
      <div class="func-split">
        <div class="func-left">
          ${this.funcGrid(judged)}
          <div class="xl-formula">=${f.name}(A1:D4) = <b style="color:#86EFAC">${this.fmtNum(res)}</b></div>
          <div class="write-result">${f.name}(A1:D4) = ${this.fmtNum(res)}</div>
        </div>
        <div class="func-right">
          <div class="cp-label">逐个判断（绿色 = 计入，灰色删除线 = 忽略）</div>
          ${judgeRows}
          <div class="judge-row">
            <span class="judge-addr">空单元格</span>
            <span class="judge-val">∅</span>
            <span class="type-tag empty">空单元格</span>
            <span class="chip-no">忽略</span>
            <span class="judge-reason">${emptyAddrs.join('、')}：无内容，所有函数都忽略</span>
          </div>
          <div class="cp-sum-line">${f.process(counted)}</div>
        </div>
      </div>
    </div>`;
    $('#stage').innerHTML = html;
  },

  drawFuncSummary(results){
    const rows = FUNCS.map(f=>{
      const r = results[f.name];
      const tags = r.counted.map(x=>`<span class="type-tag ${x.type}" style="margin:1px 2px">${x.addr}</span>`).join(' ');

      draw: () => {

            + this.opGrid(allIdx, focus, focus ? 'done' : null)
            + `<div class="tbl-wrap" style="margin-top:8px"><table class="tbl">
                <colgroup><col style="width:18%"><col style="width:34%"><col style="width:24%"><col style="width:24%"></colgroup>

                  `<tr><td><b class="py-op">${esc(r[0])}</b></td><td class="l">${r[1]}</td><td class="l" style="font-family:var(--mono)">${esc(r[2])}</td><td><b>${esc(r[3])}</b></td></tr>`).join('')}</tbody>

  /* ==================== 子页面三：运算符优先级介绍 ==================== */
  _rank(op) {
    const map = { '**': 8, '*': 7, '/': 7, '//': 7, '%': 7, '+': 6, '-': 6, '>': 5, '<': 5, '>=': 5, '<=': 5, '==': 5, '!=': 5, 'not': 4, 'and': 3, 'or': 2 };
    return map[op] || 0;
  },
  _needsParen(child, parent) {
    if (!child || child.type !== 'bin') return false;
    const cr = this._rank(child.op), pr = this._rank(parent.op);
    if (cr < pr) return true;
    if (cr === pr && parent.op === '**' && parent.right === child) return true;
    return false;
  },
  _fmtVal(v) {
    if (typeof v === 'boolean') return v ? 'True' : 'False';
    if (typeof v === 'number') {
      if (Number.isInteger(v)) return String(v);
      return String(Math.round(v * 100000) / 100000);
    }
    return String(v);
  },
  _exprSrc(node) {
    if (node.type === 'lit') return this._fmtVal(node.v);
    if (node.type === 'unary') return `${node.op} ${this._exprSrc(node.operand)}`;
    const lp = this._needsParen(node.left, node) ? '(' : '';
    const lq = lp ? ')' : '';
    const rp = this._needsParen(node.right, node) ? '(' : '';
    const rq = rp ? ')' : '';
    return `${lp}${this._exprSrc(node.left)}${lq} ${node.op} ${rp}${this._exprSrc(node.right)}${rq}`;
  },
  /* 把已完成子节点替换为结果后的当前子表达式文本（用于化简行与说明） */
  _subExpr(node, doneSet) {
    if (node.type === 'lit') return this._fmtVal(node.v);
    if (doneSet.has(node)) return this._fmtVal(node.value);
    if (node.type === 'unary') return `${node.op} ${this._subExpr(node.operand, doneSet)}`;
    const lp = this._needsParen(node.left, node) ? '(' : '';
    const lq = lp ? ')' : '';
    const rp = this._needsParen(node.right, node) ? '(' : '';
    const rq = rp ? ')' : '';
    return `${lp}${this._subExpr(node.left, doneSet)}${lq} ${node.op} ${rp}${this._subExpr(node.right, doneSet)}${rq}`;
  },
  _renderExpr(node, doneSet, curNode) {
    if (node.type === 'lit') return `<span class="expr-lit">${this._fmtVal(node.v)}</span>`;
    if (node === curNode) return `<span class="expr-cur">${esc(this._exprSrc(node))}</span>`;
    if (doneSet.has(node)) return `<span class="expr-done">${this._fmtVal(node.value)}</span>`;
    if (node.type === 'unary') {
      return `<span class="expr-op">${esc(node.op)}</span> ${this._renderExpr(node.operand, doneSet, curNode)}`;
    }
    const lp = this._needsParen(node.left, node) ? '(' : '';
    const lq = lp ? ')' : '';
    const rp = this._needsParen(node.right, node) ? '(' : '';
    const rq = rp ? ')' : '';
    return `${lp}${this._renderExpr(node.left, doneSet, curNode)}${lq} <span class="expr-op">${esc(node.op)}</span> ${rp}${this._renderExpr(node.right, doneSet, curNode)}${rq}`;
  },
  _binNote(op) {
    const map = {
      '**': '幂运算优先级最高，先算 **（乘方）',
      '*': '乘法优先级高于加法，先算 *',
      '/': '除法优先级高于加法，先算 /',
      '//': '整除与乘法同级，先算 //',
      '%': '取余与乘法同级，先算 %',
      '+': '乘法算完后，再算 +（加法）',
      '-': '乘法算完后，再算 -（减法）',
      '==': '比较运算优先级低于加减，先判断 ==（等于）',
      '!=': '比较运算，先判断 !=（不等于）',
      '>': '比较运算，先判断 >（大于）',
      '<': '比较运算，先判断 <（小于）',
      '>=': '比较运算，先判断 >=（大于等于）',
      '<=': '比较运算，先判断 <=（小于等于）',
      'and': '比较与 not 算完后，最后算逻辑 and（两边都真才真）',
      'or': 'and 算完后，最后算逻辑 or（一边为真即为真）'
    };
    return map[op] || '按优先级完成本步运算';
  },
  _unaryNote(op) {
    if (op === 'not') return '比较运算之后，先算 not（取反）';
    if (op === '-') return '负号优先，先取负号';
    return '按优先级完成本步运算';
  },
  _tokenize(src) {
    const s = String(src).trim();
    const toks = [];
    let i = 0;
    while (i < s.length) {
      const c = s[i];
      if (/\s/.test(c)) { i++; continue; }
      let m = s.slice(i).match(/^\d+(\.\d+)?/);
      if (m) { toks.push({ t: 'num', v: parseFloat(m[0]) }); i += m[0].length; continue; }
      m = s.slice(i).match(/^[A-Za-z_][A-Za-z0-9_]*/);
      if (m) {
        const w = m[0];
        if (w === 'and') toks.push({ t: 'kw', v: 'and' });
        else if (w === 'or') toks.push({ t: 'kw', v: 'or' });
        else if (w === 'not') toks.push({ t: 'kw', v: 'not' });
        else if (w === 'True') toks.push({ t: 'bool', v: true });
        else if (w === 'False') toks.push({ t: 'bool', v: false });
        else throw new Error('无法识别的标识符：' + w);
        i += w.length; continue;
      }
      const two = s.slice(i, i + 2);
      if (two === '**' || two === '//' || two === '==' || two === '!=' || two === '>=' || two === '<=') {
        toks.push({ t: 'op', v: two }); i += 2; continue;
      }
      if ('+-*/%<>()'.includes(c)) { toks.push({ t: 'op', v: c }); i++; continue; }
      throw new Error('无法识别的字符：' + c);
    }
    if (!toks.length) throw new Error('表达式为空，请输入一个简单表达式');
    return toks;
  },
  _parse(src) {
    const toks = this._tokenize(src);
    let p = 0;
    const peek = () => toks[p];
    const next = () => toks[p++];

    const parseOr = () => {
      let node = parseAnd();
      while (peek() && peek().t === 'kw' && peek().v === 'or') { next(); const r = parseAnd(); node = { type: 'bin', op: 'or', left: node, right: r }; }
      return node;
    };
    const parseAnd = () => {
      let node = parseNot();
      while (peek() && peek().t === 'kw' && peek().v === 'and') { next(); const r = parseNot(); node = { type: 'bin', op: 'and', left: node, right: r }; }
      return node;
    };
    const parseNot = () => {
      if (peek() && peek().t === 'kw' && peek().v === 'not') { next(); const o = parseNot(); return { type: 'unary', op: 'not', operand: o }; }
      return parseCmp();
    };
    const parseCmp = () => {
      let node = parseAdd();
      if (peek() && peek().t === 'op' && ['==', '!=', '>', '<', '>=', '<='].includes(peek().v)) {
        const op = next().v; const r = parseAdd(); node = { type: 'bin', op, left: node, right: r };
      }
      return node;
    };
    const parseAdd = () => {
      let node = parseMul();
      while (peek() && peek().t === 'op' && (peek().v === '+' || peek().v === '-')) {
        const op = next().v; const r = parseMul(); node = { type: 'bin', op, left: node, right: r };
      }
      return node;
    };
    const parseMul = () => {
      let node = parsePow();
      while (peek() && peek().t === 'op' && ['*', '/', '//', '%'].includes(peek().v)) {
        const op = next().v; const r = parsePow(); node = { type: 'bin', op, left: node, right: r };
      }
      return node;
    };
    const parsePow = () => {
      const node = parseUnary();
      if (peek() && peek().t === 'op' && peek().v === '**') { next(); const r = parsePow(); return { type: 'bin', op: '**', left: node, right: r }; }
      return node;
    };
    const parseUnary = () => {
      if (peek() && peek().t === 'op' && peek().v === '-') { next(); const o = parsePow(); return { type: 'unary', op: '-', operand: o }; }
      return parsePrimary();
    };
    const parsePrimary = () => {
      const tk = next();
      if (!tk) throw new Error('表达式不完整');
      if (tk.t === 'num') return { type: 'lit', v: tk.v };
      if (tk.t === 'bool') return { type: 'lit', v: tk.v };
      if (tk.t === 'op' && tk.v === '(') {
        const node = parseOr();
        const close = next();
        if (!close || close.t !== 'op' || close.v !== ')') throw new Error('括号不匹配');
        return node;
      }
      throw new Error('表达式格式不正确');
    };

    const root = parseOr();
    if (p < toks.length) throw new Error('表达式格式不正确');
    return root;
  },
  _eval(node, trace) {
    if (node.type === 'lit') return node.v;
    if (node.type === 'unary') {
      const v = this._eval(node.operand, trace);
      const r = node.op === 'not' ? !v : -v;
      node.value = r;
      trace.push({ node, kind: node.type, op: node.op, result: r });
      return r;
    }
    const lv = this._eval(node.left, trace);
    const rv = this._eval(node.right, trace);
    let r;
    switch (node.op) {
      case '+': r = lv + rv; break;
      case '-': r = lv - rv; break;
      case '*': r = lv * rv; break;
      case '/': r = lv / rv; break;
      case '//': r = Math.floor(lv / rv); break;
      case '%': r = lv % rv; break;
      case '**': r = Math.pow(lv, rv); break;
      case '==': r = lv === rv; break;
      case '!=': r = lv !== rv; break;
      case '>': r = lv > rv; break;
      case '<': r = lv < rv; break;
      case '>=': r = lv >= rv; break;
      case '<=': r = lv <= rv; break;
      case 'and': r = lv && rv; break;
      case 'or': r = lv || rv; break;
      default: throw new Error('不支持的运算符：' + node.op);
    }
    node.value = r;
