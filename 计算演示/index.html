<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>教学计算演示台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234F6BFF' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M4 17l6-6-6-6M12 19h8'/></svg>">
<style>
/* ============ 基础 & 变量 ============ */
:root{
  --bg:linear-gradient(160deg,#E7EDFF 0%,#DDEFFF 40%,#ECE9FF 100%);
  --surface:#FFFFFF;--surface-2:#F6F9FF;--surface-3:#EEF3FF;
  --accent:#4F6BFF;--accent-hover:#3D56E0;--accent-soft:rgba(79,107,255,.09);
  --cyan:#38BDF8;--green:#22C55E;--green-soft:#E8FBF0;--orange:#F59E0B;--orange-soft:#FFF4DB;
  --red:#EF4444;--red-soft:#FDEEEE;--violet:#8B5CF6;--pink:#EC4899;
  --text:#0F172A;--text-2:#334155;--text-3:#64748B;
  --border:rgba(79,107,255,.14);
  --code-bg:#161B2E;--code-line:#DFE6F5;
  --radius-lg:18px;--radius:12px;--radius-sm:8px;
  --shadow:0 3px 16px rgba(79,107,255,.07),0 1px 3px rgba(0,0,0,.03);
  --shadow-hover:0 10px 30px rgba(79,107,255,.16),0 2px 6px rgba(0,0,0,.05);
  --font:"Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--font);color:var(--text-2);background:var(--bg);background-attachment:fixed;
  min-height:100vh;position:relative;overflow-x:hidden;-webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(circle at 12% 18%,rgba(79,107,255,.07) 0,transparent 42%),
                   radial-gradient(circle at 88% 72%,rgba(56,189,248,.06) 0,transparent 42%);
}
.wrap{position:relative;z-index:1;max-width:1160px;margin:0 auto;padding:clamp(8px,1.5vw,14px) clamp(10px,2vw,20px) clamp(10px,2vw,18px)}
.view{display:none}
.view.active{display:block;animation:viewIn .32s ease}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ============ 按钮 / 徽章 ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;
  border:1px solid var(--border);background:#fff;color:var(--text-2);
  padding:clamp(5px,1vw,7px) clamp(9px,1.8vw,13px);border-radius:8px;
  font-size:clamp(11px,1.4vw,12.5px);font-weight:600;
  cursor:pointer;font-family:var(--font);transition:all .15s;text-decoration:none;
}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(79,107,255,.25)}
.btn.primary:hover:not(:disabled){background:var(--accent-hover);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-3)}
.btn.ghost:hover:not(:disabled){background:var(--accent-soft);color:var(--accent);border-color:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn svg{width:15px;height:15px;flex-shrink:0}

/* ============ 静态 Hero ============ */
.hero{text-align:center;margin:clamp(4px,1vw,10px) 0 clamp(16px,3vw,28px)}
.capsule{
  display:inline-flex;align-items:center;gap:7px;background:#fff;border-radius:999px;
  padding:5px 14px;box-shadow:var(--shadow);font-size:clamp(10px,1.3vw,12px);letter-spacing:1.4px;
  color:var(--accent);font-weight:700;margin-bottom:clamp(10px,2vw,16px);
}
.capsule .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.hero h1{
  font-size:clamp(22px,5vw,42px);font-weight:800;color:var(--text);letter-spacing:-.5px;line-height:1.22;
}
.hero h1 .grad{
  background:linear-gradient(90deg,#4F6BFF,#38BDF8);-webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero .subtitle{margin:clamp(6px,1.5vw,10px) auto 0;max-width:560px;color:var(--text-3);
  font-size:clamp(12px,1.8vw,14.5px);line-height:1.7}
.hero .hint-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:clamp(10px,2vw,16px)}
.hero .hint-row .pill{
  background:#fff;border:1px solid var(--border);color:var(--text-3);
  border-radius:999px;padding:4px 12px;font-size:clamp(11px,1.4vw,12.5px);font-weight:600;
}

/* ============ 区块标题 & 过滤 ============ */
.section-head{text-align:center;margin:clamp(4px,1vw,8px) 0 4px}
.section-head h2{font-size:clamp(17px,3vw,22px);font-weight:800;color:var(--text)}
.section-head p{color:var(--text-3);font-size:clamp(11.5px,1.6vw,13px);margin-top:4px}
.filters{display:flex;justify-content:center;gap:6px;margin:clamp(10px,2vw,16px) 0;flex-wrap:wrap}
.filter-btn{
  border:1px solid var(--border);background:#fff;color:var(--text-3);
  padding:clamp(5px,1.2vw,7px) clamp(11px,2vw,15px);border-radius:999px;
  font-size:clamp(11px,1.5vw,13px);font-weight:600;
  cursor:pointer;font-family:var(--font);transition:all .15s;
}
.filter-btn:hover{border-color:var(--accent);color:var(--accent)}
.filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ============ 首页卡片网格 ============ */
.grid{display:grid;grid-template-columns:1fr;gap:clamp(8px,1.5vw,12px);margin-top:4px}
.card{
  background:var(--surface);border-radius:var(--radius-lg);padding:clamp(12px,2vw,16px);
  box-shadow:var(--shadow);display:flex;flex-direction:column;position:relative;overflow:hidden;
  cursor:pointer;text-decoration:none;color:inherit;
  transition:transform .18s ease,box-shadow .18s ease;
}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover)}
.card .card-accent{position:absolute;inset:0 0 auto 0;height:3px;background:var(--card-c,#4F6BFF);opacity:.85}
.card .top{display:flex;align-items:flex-start;gap:clamp(8px,1.5vw,12px);margin-bottom:8px}
.card .icon-box{
  width:clamp(36px,5vw,44px);height:clamp(36px,5vw,44px);border-radius:12px;background:var(--card-soft,#EEF3FF);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--card-c,#4F6BFF);
}
.card .icon-box svg{width:clamp(18px,2.5vw,23px);height:clamp(18px,2.5vw,23px)}
.card .title-area{flex:1;min-width:0}
.card h3{font-size:clamp(13.5px,2vw,16px);font-weight:700;color:var(--text);display:flex;align-items:center;gap:6px;line-height:1.3}
.card h3 .tag{
  font-size:clamp(9px,1.1vw,10.5px);font-weight:700;color:#fff;background:var(--card-c,#4F6BFF);
  padding:2px 7px;border-radius:999px;letter-spacing:.3px;flex-shrink:0;
}
.card .type{font-size:clamp(10.5px,1.4vw,12px);color:var(--text-3);margin-top:3px}
.card p{font-size:clamp(11.5px,1.5vw,12.5px);color:var(--text-3);line-height:1.6;margin-bottom:10px;flex:1;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .enter{
  align-self:flex-start;display:inline-flex;align-items:center;gap:5px;
  background:var(--card-c,#4F6BFF);color:#fff;border:none;border-radius:9px;
  padding:clamp(5px,1vw,7px) clamp(10px,2vw,14px);font-size:clamp(11px,1.4vw,12.5px);font-weight:600;cursor:pointer;
}
.card .enter svg{width:12px;height:12px}
.card:hover .enter{filter:brightness(1.06)}
footer{margin-top:clamp(18px,3vw,30px);text-align:center;color:var(--text-3);font-size:clamp(11px,1.4vw,12.5px);line-height:1.8}
footer .power{font-weight:600;color:var(--text-2)}
footer a{color:var(--accent);text-decoration:none;font-weight:600}

/* ============ 模块页通用骨架 ============ */
.demo-top{
  display:flex;align-items:center;gap:clamp(6px,1vw,10px);margin-bottom:clamp(6px,1vw,10px);flex-wrap:nowrap;overflow-x:auto;
}
.back-btn{
  display:inline-flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--border);
  color:var(--text-2);border-radius:8px;padding:clamp(4px,.8vw,6px) clamp(8px,1.5vw,11px);
  font-size:clamp(10.5px,1.3vw,12px);font-weight:600;
  cursor:pointer;text-decoration:none;transition:all .15s;flex-shrink:0;
}
.back-btn:hover{color:var(--accent);border-color:var(--accent)}
.back-btn svg{width:15px;height:15px}
.demo-top .m-title{flex:1;min-width:120px}
.demo-top .m-title h2{font-size:clamp(14px,2.5vw,18px);font-weight:800;color:var(--text);line-height:1.2}
.demo-top .m-title .m-sub{font-size:clamp(10px,1.2vw,11.5px);color:var(--text-3);margin-top:1px;line-height:1.3}
.demo-top .m-badge{font-size:clamp(9px,1.1vw,10.5px);font-weight:700;color:#fff;background:var(--card-c,#4F6BFF);padding:3px 9px;border-radius:999px;flex-shrink:0}

.panel-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:clamp(6px,1.2vw,9px) clamp(8px,1.5vw,12px) clamp(8px,1.5vw,10px);margin-bottom:clamp(6px,1vw,8px);box-shadow:var(--shadow);
}
.panel-card > h3{
  font-size:clamp(11px,1.4vw,12.5px);font-weight:700;color:var(--text);display:flex;align-items:center;gap:5px;margin-bottom:2px;
}
.panel-card > h3 .n{
  width:clamp(15px,1.8vw,18px);height:clamp(15px,1.8vw,18px);border-radius:5px;background:var(--accent-soft);color:var(--accent);
  display:inline-flex;align-items:center;justify-content:center;font-size:clamp(9px,1.1vw,10.5px);flex-shrink:0;
}
.panel-card .desc{font-size:clamp(10.5px,1.3vw,12px);color:var(--text-3);line-height:1.5;margin-bottom:clamp(4px,.8vw,6px)}
.panel-card .desc b{color:var(--accent)}

/* 理论卡可折叠 */
details.theory{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface-2);padding:clamp(6px,1vw,9px) clamp(8px,1.5vw,12px);margin-bottom:clamp(6px,1vw,10px)}
details.theory summary{
  cursor:pointer;font-size:clamp(11.5px,1.5vw,13px);font-weight:700;color:var(--text);list-style:none;
  display:flex;align-items:center;gap:8px;
}
details.theory summary::before{
  content:"";width:7px;height:7px;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);
  transform:rotate(-45deg);transition:.2s;margin-right:2px;flex-shrink:0;
}
details.theory[open] summary::before{transform:rotate(45deg)}
details.theory .t-body{padding-top:10px;font-size:clamp(12px,1.6vw,13.5px);color:var(--text-2);line-height:1.85;border-top:1px dashed var(--border);margin-top:10px}
details.theory .t-body .rule{background:#fff;border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:7px 12px;margin-bottom:7px}
details.theory .t-body code,.mono{font-family:var(--mono);background:var(--surface-3);padding:1px 6px;border-radius:5px;color:var(--accent);font-size:clamp(11.5px,1.4vw,12.5px)}
details.theory .t-body table{width:100%;border-collapse:collapse;margin:8px 0;font-size:clamp(11px,1.4vw,12.5px)}
details.theory .t-body th,details.theory .t-body td{border:1px solid var(--border);padding:5px 8px;text-align:center}
details.theory .t-body td.l{text-align:left}
details.theory .t-body .note{font-size:clamp(10.5px,1.3vw,12px);color:var(--text-3);line-height:1.7;margin-top:6px}
details.theory .t-body th{background:var(--surface-3);color:var(--accent);font-weight:700}

/* 设置区 */
.settings-row{display:flex;gap:clamp(6px,1.2vw,10px);flex-wrap:wrap;align-items:flex-end}
.setting{display:flex;flex-direction:column;gap:3px}
.setting label{font-size:clamp(10px,1.2vw,11px);font-weight:600;color:var(--text-3)}
.inline-setting{flex-shrink:0;margin-right:4px}
.inline-setting .settings-row{gap:4px}
.inline-setting select,.inline-setting input{
  padding:3px 6px;min-height:26px;font-size:clamp(10px,1.2vw,11px);border-radius:6px;
}
.setting select,.setting input{
  padding:clamp(5px,1vw,7px) clamp(7px,1.2vw,10px);border:1.5px solid var(--border);border-radius:8px;
  font-size:clamp(11px,1.4vw,12.5px);font-family:var(--font);background:#fff;outline:none;color:var(--text);
  min-height:clamp(30px,4vw,36px);transition:border-color .15s;
}
.setting select:focus,.setting input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.setting input[type=number]{width:clamp(90px,14vw,120px)}
.setting .val{font-family:var(--mono);font-size:clamp(11px,1.4vw,13px);color:var(--text-3);margin-top:3px}

/* 演示画布 */
.stage{background:var(--surface-2);border:1px dashed var(--border);border-radius:var(--radius);padding:clamp(5px,1vw,8px) clamp(7px,1.2vw,10px);margin:2px 0 5px;position:relative;min-height:95px}
.stage .stage-hd{
  display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;
  font-size:clamp(10.5px,1.3vw,12px);font-weight:700;color:var(--text-2);margin-bottom:6px;letter-spacing:.3px;
}
.stage .stage-hd .state{color:var(--text-3);font-weight:600;font-family:var(--mono)}

/* 控制条 */
.ctrl{
  display:flex;align-items:center;gap:6px;flex-wrap:nowrap;overflow-x:auto;margin:6px 0 3px;
  padding:clamp(5px,1vw,8px) clamp(8px,1.5vw,10px);background:#fff;border:1px solid var(--border);border-radius:10px;
  -webkit-overflow-scrolling:touch;scrollbar-width:thin;
}
.ctrl::-webkit-scrollbar{height:4px}
.ctrl::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:2px}
.ctrl .grp{display:flex;gap:5px;flex-wrap:nowrap;flex-shrink:0}
.ctrl .spacer{flex:1}
.ctrl .speed{display:flex;align-items:center;gap:4px;font-size:clamp(10px,1.2vw,11.5px);color:var(--text-3)}
.ctrl .speed button{
  border:1px solid var(--border);background:#fff;color:var(--text-3);border-radius:6px;
  padding:2px 7px;font-size:clamp(10px,1.2vw,11.5px);font-weight:700;cursor:pointer;font-family:var(--mono);
}
.ctrl .speed button.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* 步骤条 */
.stepbar{margin:5px 0 3px}
.stepbar .bar{height:5px;background:var(--surface-3);border-radius:999px;overflow:hidden}
.stepbar .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--cyan));transition:width .2s;border-radius:999px}
.stepbar .lbl{display:flex;justify-content:space-between;margin-top:3px;font-size:clamp(10px,1.2vw,11.5px);color:var(--text-3);font-family:var(--mono)}

.explain{
  background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:clamp(4px,.8vw,6px) clamp(7px,1.2vw,10px);
  font-size:clamp(10.5px,1.3vw,12px);line-height:1.5;color:var(--text-2);min-height:16px;animation:exIn .25s;
}
@keyframes exIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.explain b{color:var(--accent)}
.explain .ok{color:var(--green);font-weight:700}
.explain .c-op{color:var(--accent);font-weight:700}

/* ============ 各模块画布元素 ============ */
.chip{
  background:var(--accent);color:#fff;border-radius:7px;padding:clamp(3px,.7vw,5px) clamp(7px,1.4vw,10px);font-weight:700;
  font-family:var(--mono);font-size:clamp(11px,1.4vw,13px);flex:none;display:inline-flex;align-items:center;justify-content:center;
  animation:pop .18s;
}
.chip.g{background:var(--green)}.chip.o{background:var(--orange)}.chip.r{background:var(--red)}.chip.cy{background:var(--cyan)}.chip.v{background:var(--violet)}.chip.pk{background:var(--pink)}.chip.dim{opacity:.35;background:#C3CEEB}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.flow-line{font-family:var(--mono);font-size:clamp(12px,1.6vw,14px);margin:4px 0;display:flex;flex-wrap:wrap;align-items:center;gap:5px;line-height:1.9}
.flow-line .part{padding:2px 7px;border-radius:6px;background:#fff;border:1px solid transparent;transition:all .15s}
.flow-line .part.cur{background:var(--orange-soft);border-color:var(--orange);color:#B45309;font-weight:700}
.flow-line .part.done{background:var(--green-soft);border-color:var(--green);color:#15803D}
.flow-line .res{font-weight:700;color:var(--accent)}
.result-box{font-family:var(--mono);font-size:clamp(14px,2vw,18px);font-weight:700;color:var(--accent);background:var(--surface-3);border-radius:10px;padding:clamp(8px,1.5vw,12px) clamp(12px,2vw,16px);text-align:center;margin-top:10px}

/* 公式逐步 */
.fml{background:var(--code-bg);color:#8FD3FF;border-radius:10px;padding:clamp(8px,1.5vw,12px);font-family:var(--mono);font-size:clamp(11.5px,1.5vw,13.5px);line-height:1.9;overflow-x:auto}
.fml .f-line{white-space:nowrap;padding:2px 8px;border-radius:6px}
.fml .f-line.cur{background:rgba(79,107,255,.32);color:#fff}
.fml .f-line.done{opacity:.72}
.fml .hl{color:#FFD666;font-weight:700}

/* IP 二进制网格 */
.bin-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;min-width:0}
.bin-grid .bd{background:#fff;border:1px solid var(--border);border-radius:6px;text-align:center;font-family:var(--mono);font-size:clamp(13px,1.9vw,18px);font-weight:700;padding:clamp(5px,1vw,9px) 0;color:var(--text-2);transition:all .15s}
.bin-grid .bd.cur{background:var(--orange);color:#fff;border-color:var(--orange);transform:scale(1.06)}
.bin-grid .bd.mask{color:var(--accent)}
.bin-grid .bd.mask.cur{background:var(--accent)}
.bin-grid .bd.net{background:var(--green-soft);color:#15803D;border-color:var(--green)}
.bin-grid .bd.zero{color:#CBD5E1}
.bin-grid .bd.one{color:var(--accent);background:var(--accent-soft)}
.bin-grid .bd.weight{background:var(--surface-3);color:var(--accent);font-size:clamp(10px,1.3vw,12px);border-style:dashed}
.bin-grid .bd.and-result{background:var(--orange-soft);color:#B45309;border-color:var(--orange)}

/* 计算过程重点卡片 */
.calc-process{background:linear-gradient(135deg,#FFF8EE 0%,#FFF 100%);border:2px solid var(--orange);border-radius:12px;padding:clamp(10px,1.8vw,16px);margin:clamp(8px,1.5vw,14px) 0;position:relative;overflow:hidden}
.calc-process::before{content:'计算过程';position:absolute;top:0;right:0;background:var(--orange);color:#fff;font-size:clamp(9px,1.1vw,10.5px);font-weight:700;padding:3px 10px;border-radius:0 10px 0 10px;letter-spacing:.5px}
.calc-process .cp-label{font-size:clamp(11px,1.4vw,13px);color:var(--text-3);font-weight:600;margin-bottom:8px;letter-spacing:.3px}
.calc-process .cp-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-family:var(--mono);font-size:clamp(13px,1.8vw,17px);font-weight:700;line-height:2.2}
.calc-process .cp-row .w{color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:1px 6px;min-width:28px;text-align:center}
.calc-process .cp-row .w.active{background:var(--orange);color:#fff;transform:scale(1.1)}
.calc-process .cp-row .plus{color:#94A3B8;font-weight:400}
.calc-process .cp-row .eq{color:var(--accent);margin:0 4px}
.calc-process .cp-row .sum{color:var(--orange);background:#FFF4DB;border-radius:6px;padding:2px 10px;border:1.5px solid var(--orange)}
.calc-process .cp-bit-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;margin:6px 0}
.calc-process .cp-bit-grid .cb{text-align:center;font-family:var(--mono);font-weight:700;font-size:clamp(12px,1.7vw,16px);padding:clamp(4px,.9vw,7px) 0;border-radius:5px}
.calc-process .cp-bit-grid .cb.ip{background:#EEF3FF;color:#4F6BFF}
.calc-process .cp-bit-grid .cb.mk{background:#E6F9FE;color:#0891B2}
.calc-process .cp-bit-grid .cb.rs{background:#FFF4DB;color:#B45309;border:1.5px solid var(--orange)}
.calc-process .cp-bit-grid .cb.lb{background:transparent;color:var(--text-3);font-size:clamp(9px,1.1vw,11px);font-weight:600;padding:2px 0}
.calc-process .cp-sum-line{font-family:var(--mono);font-size:clamp(13px,1.8vw,16px);font-weight:700;color:var(--text);margin-top:8px;text-align:center;background:#fff;border-radius:8px;padding:8px;border:1px solid var(--border)}
.ip-row{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(4px,1vw,8px);margin-bottom:10px}
.ip-row .seg{background:#fff;border:1px solid var(--border);border-radius:9px;padding:clamp(5px,1vw,8px);text-align:center}
.ip-row .seg .seg-hd{font-size:clamp(9px,1.1vw,10.5px);color:var(--text-3);margin-bottom:3px;font-weight:600}
.ip-row .seg.cur{background:var(--orange-soft);border-color:var(--orange)}
.ip-row .seg .val{font-family:var(--mono);font-weight:700;font-size:clamp(12px,1.6vw,15px);color:var(--text);margin-top:4px}
.ip-row .seg.cur .val{color:#B45309}
.ip-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:10px}
.ip-info .ii{background:#fff;border:1px solid var(--border);border-radius:8px;padding:7px 10px}
.ip-info .ii .ii-hd{font-size:10.5px;color:var(--text-3);font-weight:600;margin-bottom:3px}
.ip-info .ii .ii-val{font-family:var(--mono);font-size:clamp(11.5px,1.5vw,13px);font-weight:700;color:var(--accent);word-break:break-all}

/* Excel 表格 */
.xl-grid{display:grid;gap:3px;font-family:var(--mono);font-size:clamp(10.5px,1.3vw,12px);margin-bottom:10px}
.xl-grid .xl-cell{background:#fff;border:1px solid var(--border);border-radius:5px;display:flex;align-items:center;justify-content:center;padding:clamp(5px,.8vw,8px) 2px;font-weight:600;color:var(--text-2);transition:all .15s;min-height:clamp(28px,4vw,36px)}
.xl-grid .xl-cell.hd{background:var(--surface-3);color:var(--accent);font-weight:700}
.xl-grid .xl-cell.sel{background:var(--orange-soft);border-color:var(--orange);color:#B45309}
.xl-grid .xl-cell.cur{background:var(--orange);color:#fff;border-color:var(--orange)}
.xl-grid .xl-cell.done{background:var(--green-soft);border-color:var(--green);color:#15803D}
.xl-grid .xl-cell.src{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.xl-formula{font-family:var(--mono);background:var(--code-bg);color:#8FD3FF;border-radius:8px;padding:8px 12px;font-size:clamp(11.5px,1.5vw,13px);margin-bottom:8px;overflow-x:auto}

/* 代码块（Python） */
.code-block{background:var(--code-bg);color:var(--code-line);border-radius:10px;padding:clamp(8px,1.5vw,12px) clamp(6px,1vw,10px);font-family:var(--mono);font-size:clamp(11.5px,1.5vw,13.5px);line-height:1.95;overflow-x:auto;margin-bottom:10px}
.code-block .l{white-space:pre;padding:1px 10px;border-radius:6px;transition:all .15s}
.code-block .l.cur{background:var(--accent);color:#fff;font-weight:700}
.code-block .l.done{opacity:.55}
.code-block .kw{color:#C792EA}.code-block .fn{color:#82AAFF}.code-block .str{color:#C3E88D}.code-block .cm{color:#546E7A;font-style:italic}.code-block .num{color:#F78C6C}
.var-rack{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;min-height:38px}
.var-pill{background:#fff;border:1px solid var(--border);border-radius:9px;padding:clamp(5px,1vw,8px) clamp(9px,1.5vw,13px);font-family:var(--mono);font-size:clamp(11.5px,1.5vw,13px);font-weight:600;animation:pop .18s}
.var-pill b{color:var(--accent)}
.var-pill.hot{background:var(--orange-soft);border-color:var(--orange)}
.var-pill.hot b{color:#B45309}
.console{background:#0C1120;color:#5EF2A0;font-family:var(--mono);font-size:clamp(11.5px,1.5vw,13px);border-radius:9px;padding:clamp(7px,1.2vw,10px) clamp(10px,1.5vw,14px);min-height:44px;white-space:pre-wrap;line-height:1.8;margin-bottom:8px}
.console .cl{animation:exIn .2s}

/* 栈 / 队列 */
.stack-area{display:flex;flex-direction:column-reverse;gap:6px;min-height:clamp(140px,25vw,180px);padding:10px;background:#fff;border-radius:10px;border:1px solid var(--border);justify-content:flex-start;align-items:center}
.stack-area .chip{width:clamp(56px,9vw,70px)}
.queue-area{display:flex;flex-direction:row;gap:6px;min-height:clamp(48px,8vw,60px);align-items:center;padding:10px;background:#fff;border-radius:10px;border:1px solid var(--border);overflow-x:auto}
.queue-area .chip{flex-shrink:0}
.deque-area{display:flex;flex-direction:row;gap:6px;min-height:clamp(48px,8vw,60px);align-items:center;padding:10px;background:#fff;border-radius:10px;border:1px solid var(--border);overflow-x:auto;justify-content:center}
.deque-area .chip{flex-shrink:0}
.ds-log{font-family:var(--mono);font-size:clamp(11px,1.4vw,12.5px);color:var(--text-3);line-height:1.8;min-height:20px;margin-top:10px}
.ds-log b{color:var(--accent)}
.zone-label{font-size:clamp(10px,1.2vw,11px);font-weight:700;color:var(--text-3);letter-spacing:.4px;margin-bottom:6px}

/* 树 / 图 SVG */
.svg-box{background:#fff;border-radius:10px;border:1px solid var(--border);overflow:hidden;margin-bottom:10px}
.svg-box svg{display:block;width:100%;height:auto}
.order-rack{display:flex;gap:6px;flex-wrap:wrap;min-height:38px;align-items:center}
.order-rack .order-chip{background:var(--accent);color:#fff;border-radius:8px;padding:clamp(4px,.8vw,6px) clamp(9px,1.5vw,12px);font-weight:700;font-family:var(--mono);font-size:clamp(12px,1.6vw,14px);animation:pop .18s}
.legend{font-size:clamp(11px,1.4vw,12.5px);color:var(--text-3);line-height:1.9}
.legend b{color:var(--accent)}

/* SECTION: 严格校验与错误状态 */
.err{
  background:var(--red-soft);border:1px solid #F6C9C9;border-left:3px solid var(--red);
  border-radius:0 10px 10px 0;padding:clamp(9px,1.6vw,13px) clamp(11px,1.8vw,15px);
  font-size:clamp(12px,1.6vw,13.5px);color:#9B1C1C;line-height:1.75;
}
.err b{color:#7F1D1D}
.err .err-t{font-weight:700;display:flex;align-items:center;gap:6px;margin-bottom:4px}
.err code{font-family:var(--mono);background:#fff;border:1px solid #F0CFCF;border-radius:5px;padding:0 5px;color:#9B1C1C}
.ok-box{
  background:var(--green-soft);border:1px solid #BFE9CF;border-left:3px solid var(--green);
  border-radius:0 10px 10px 0;padding:clamp(8px,1.5vw,12px) clamp(11px,1.8vw,15px);
  font-size:clamp(11.5px,1.5vw,13px);color:#14532D;line-height:1.75;
}
.ok-box b{color:#15803D}
.setting input.bad{border-color:var(--red);background:#FFF8F8}
.chk{font-family:var(--mono);font-size:clamp(11px,1.4vw,12.5px);color:var(--text-3);margin-top:4px;min-height:16px}
.chk.bad{color:var(--red);font-weight:700}
.chk.good{color:#15803D;font-weight:700}

/* SECTION: 数据表格 */
.tbl{width:100%;border-collapse:collapse;font-size:clamp(11px,1.4vw,12.5px);margin:8px 0;background:#fff;border-radius:8px;overflow:hidden}
.tbl th,.tbl td{border:1px solid var(--border);padding:clamp(4px,.8vw,7px) clamp(5px,1vw,9px);text-align:center;font-family:var(--mono)}
.tbl th{background:var(--surface-3);color:var(--accent);font-weight:700;font-family:var(--font)}
.tbl td.l,.tbl th.l{text-align:left;font-family:var(--font)}
.tbl tr.cur td{background:var(--orange-soft);color:#92400E;font-weight:700}
.tbl tr.done td{background:var(--green-soft);color:#166534}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* SECTION: 点阵字形 */
.dot-matrix{display:grid;gap:2px;justify-content:center;margin:8px 0}
.dot-matrix i{width:clamp(6px,1.1vw,10px);height:clamp(6px,1.1vw,10px);border-radius:2px;background:#E2E8F0;display:block}
.dot-matrix i.on{background:var(--text);border-radius:1px}
.dot-matrix i.rowhd{background:transparent}
.byte-tag{display:inline-block;font-family:var(--mono);font-size:clamp(10px,1.2vw,11.5px);background:var(--surface-3);color:var(--accent);border-radius:5px;padding:1px 6px;margin:2px 3px 0 0;font-weight:700}

/* SECTION: 指针 / 结构标注 */
.ptr{font-size:clamp(9.5px,1.2vw,11px);font-weight:700;letter-spacing:.3px;color:var(--violet);font-family:var(--mono);text-align:center}
.ptr.head{color:#0F766E}.ptr.tail{color:#B45309}
.struct-note{font-size:clamp(11px,1.4vw,12.5px);color:var(--text-3);line-height:1.8;margin-top:8px}
.struct-note b{color:var(--accent)}
.struct-note code{font-family:var(--mono);background:var(--surface-3);padding:1px 5px;border-radius:4px;color:var(--accent)}
.two-col{display:flex;gap:clamp(10px,2vw,18px);align-items:flex-start;flex-wrap:wrap}
.two-col>div{flex:1;min-width:min(100%,190px)}
.kbd-hint{display:none;font-size:clamp(10.5px,1.3vw,12px);color:var(--text-3);font-family:var(--mono)}
.kbd-hint kbd{background:var(--surface-3);border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:1px 5px;font-family:var(--mono);font-size:.95em;color:var(--text-2)}

/* 响应式 */
@media (min-width:520px){
  .grid{grid-template-columns:repeat(2,1fr)}
}
@media (min-width:800px){
  .grid{grid-template-columns:repeat(3,1fr)}
  .wrap{padding:26px 26px 40px}
  .panel-card{padding:20px 22px}
}
@media (min-width:1060px){
  .grid{grid-template-columns:repeat(4,1fr)}
}
/* 11张卡: 4列→3+4+4, 3列→4+4+3, 2列→6+5, 1列→11 均无孤行 */

/* ============ 书写动画（全模块通用手写演示体系） ============ */
/* 纸张质感画布 */
.stage.paper{
  background:#FFFEF7;
  background-image:
    linear-gradient(#E8F0FE 1px, transparent 1px),
    linear-gradient(90deg, #E8F0FE 1px, transparent 1px);
  background-size:24px 24px;
  background-position:-1px -1px;
  border:1px solid #D4DEEF;
  border-radius:12px;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.04), 0 2px 8px rgba(79,107,255,.06);
}
/* 手写字体 */
.handwrite{
  font-family:"Comic Sans MS","Segoe Print","Bradley Hand","Kaiti SC","KaiTi","楷体",cursive;
  letter-spacing:.5px;
}
/* 逐字出现 */
@keyframes charIn{from{opacity:0;transform:translateY(3px) scale(.9)}to{opacity:1;transform:none}}
.char-in{display:inline-block;animation:charIn .18s ease-out both}
/* 笔写入动画 */
@keyframes writeIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.write-in{animation:writeIn .38s ease-out both}
@keyframes penIn{from{opacity:0;transform:translateX(-4px) scale(.92)}to{opacity:1;transform:none}}
.pen-in{animation:penIn .3s ease-out both}
/* 光标闪烁 */
@keyframes blinkCaret{0%,100%{opacity:1}50%{opacity:0}}
.caret{display:inline-block;width:2px;height:1.15em;background:#4F6BFF;margin-left:2px;vertical-align:text-bottom;animation:blinkCaret .7s infinite;border-radius:1px}
.caret.pen{width:3px;height:1.2em;background:linear-gradient(180deg,#4F6BFF,#38BDF8);box-shadow:0 0 4px rgba(79,107,255,.4)}
/* 下划线生长 */
@keyframes lineGrow{from{width:0}to{width:100%}}
.uline{position:relative;display:inline-block}
.uline::after{content:"";position:absolute;left:0;bottom:-2px;height:2px;background:#4F6BFF;border-radius:1px;animation:lineGrow .35s ease-out both}
/* 竖式除法 */
.div-vertical{
  font-family:var(--mono);
  font-size:clamp(10px,1.2vw,12px);
  line-height:1.5;
  display:inline-block;
  text-align:left;
  padding:2px 6px;
}
.div-vertical .dv-row{
  display:flex;
  align-items:baseline;
  gap:0;
  white-space:nowrap;
  position:relative;
}
.div-vertical .dv-num{min-width:1.8em;text-align:right;font-weight:600}
.div-vertical .dv-op{color:#94A3B8;margin:0 .35em}
.div-vertical .dv-eq{color:#94A3B8;margin:0 .2em}
.div-vertical .dv-q{min-width:1.8em;text-align:left;color:#334155;font-weight:600}
.div-vertical .dv-rem{margin-left:1em;color:#F59E0B;font-weight:700}
.div-vertical .dv-rem::before{content:"余 ";color:#94A3B8;font-weight:400;font-size:.82em}
.div-vertical .dv-row.cur .dv-num,.div-vertical .dv-row.cur .dv-q{color:#F59E0B;font-weight:700}
.div-vertical .dv-row.cur .dv-rem{color:#D97706}
.div-vertical .dv-row.done{opacity:.65}
.div-vertical .dv-arrow{color:#22C55E;font-size:.82em;margin-left:.6em;font-weight:700}
/* 除号括号 */
.div-bracket{
  display:inline-flex;align-items:center;
  font-family:var(--mono);font-size:clamp(14px,2vw,17px);
  margin:6px 0;
}
.div-bracket .db-divisor{padding:0 6px;color:#4F6BFF;font-weight:700}
.div-bracket .db-body{
  border-left:2px solid #4F6BFF;
  border-top:2px solid #4F6BFF;
  border-top-left-radius:6px;
  padding:2px 10px 2px 8px;
  min-width:3em;text-align:center;
  position:relative;
}
.div-bracket .db-quotient{position:absolute;top:-1.4em;left:50%;transform:translateX(-50%);color:#22C55E;font-weight:700}
/* 位权展开表 */
.exp-table{
  width:100%;
  border-collapse:collapse;
  font-family:var(--mono);
  font-size:clamp(10.5px,1.3vw,12px);
  margin:4px 0;
  background:#fff;
  border-radius:8px;
  overflow:hidden;
  box-shadow:0 1px 4px rgba(0,0,0,.04);
}
.exp-table th,.exp-table td{
  border:1px solid #E2E8F0;
  padding:2px 4px;
  text-align:center;
  transition:all .2s;
  font-size:clamp(10px,1.2vw,11.5px);
}
.exp-table th{
  background:#EEF3FF;
  color:#4F6BFF;
  font-weight:700;
  font-size:.9em;
}
.exp-table td.cur{background:#FFF4DB;color:#B45309;font-weight:700;transform:scale(1.04)}
.exp-table td.done{background:#E8FBF0;color:#15803D}
.exp-table td.sum{background:#EEF3FF;color:#4F6BFF;font-weight:700}
.exp-table td.empty{background:#F8FAFC;color:#CBD5E1}
/* 展开式横写 */
.exp-inline{
  font-family:var(--mono);
  font-size:clamp(10px,1.2vw,11.5px);
  line-height:1.5;
  padding:3px 8px;
  background:#fff;
  border-radius:6px;
  border:1px solid #E2E8F0;
  margin:3px 0 0;
}
.exp-inline .term{display:inline-block;margin:0 2px}
.exp-inline .term.cur{color:#F59E0B;font-weight:700}
.exp-inline .term.done{color:#22C55E}
.exp-inline .op{color:#94A3B8;margin:0 4px}
.exp-inline .eq{color:#4F6BFF;font-weight:700;margin:0 6px}
/* 分组转换 */
.group-box{
  display:inline-flex;
  align-items:center;
  gap:3px;
  font-family:var(--mono);
  font-size:clamp(11px,1.4vw,14px);
  margin:2px 0;
}
.group-box .grp{
  border:2px solid #4F6BFF;
  border-radius:5px;
  padding:2px 6px;
  background:#EEF3FF;
  font-weight:700;
  position:relative;
}
.group-box .grp.cur{border-color:#F59E0B;background:#FFF4DB;color:#B45309;transform:scale(1.08)}
.group-box .grp.done{border-color:#22C55E;background:#E8FBF0;color:#15803D}
.group-box .grp .grp-label{
  position:absolute;top:-16px;left:50%;transform:translateX(-50%);
  font-size:.65em;color:#94A3B8;font-weight:600;white-space:nowrap;
}
.group-box .arrow{color:#94A3B8;font-size:.8em;margin:0 4px}
/* 结果框 */
.write-result{
  font-family:var(--mono);
  font-size:clamp(12px,1.6vw,15px);
  font-weight:700;
  color:#4F6BFF;
  background:linear-gradient(135deg,#EEF3FF,#E0F2FE);
  border-radius:8px;
  padding:5px 12px;
  text-align:center;
  margin-top:6px;
  border:1px solid #C7D2FE;
  box-shadow:0 1px 4px rgba(79,107,255,.08);
}
/* 步骤标题条 */
.step-title{
  display:inline-flex;
  align-items:center;
  gap:5px;
  font-size:clamp(10px,1.2vw,11.5px);
  font-weight:700;
  color:#4F6BFF;
  background:#EEF3FF;
  padding:2px 8px;
  border-radius:999px;
  margin-bottom:5px;
}
.step-title .st-dot{width:6px;height:6px;border-radius:50%;background:#4F6BFF}
/* 子页面 tab 导航 */
.sub-tabs{
  display:flex;
  flex-wrap:nowrap;
  overflow-x:auto;
  gap:4px;
  margin-bottom:8px;
  padding:4px;
  background:var(--surface-2);
  border-radius:10px;
  border:1px solid var(--border);
  -webkit-overflow-scrolling:touch;
  scrollbar-width:thin;
}
.sub-tabs::-webkit-scrollbar{height:4px}
.sub-tabs::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:2px}
.sub-tab{
  padding:4px 10px;
  border-radius:7px;
  font-size:clamp(10.5px,1.3vw,12px);
  font-weight:600;
  color:var(--text-3);
  cursor:pointer;
  transition:all .15s;
  border:1px solid transparent;
  white-space:nowrap;
  user-select:none;
}
.sub-tab:hover{color:var(--accent);background:#fff}
.sub-tab.active{
  background:var(--accent);
  color:#fff;
  border-color:var(--accent);
  box-shadow:0 2px 8px rgba(79,107,255,.25);
}
.sub-tab .method{font-size:.78em;opacity:.75;margin-left:4px;font-weight:400}
.sub-tab.active .method{opacity:.85}
/* 子页面分组标题 */
.sub-group-label{
  font-size:clamp(10px,1.2vw,11px);
  font-weight:700;
  color:#94A3B8;
  letter-spacing:.5px;
  padding:4px 8px;
  align-self:center;
}
/* 标注箭头 */
.annot{
  font-size:clamp(10.5px,1.3vw,12px);
  color:#64748B;
  font-family:var(--font);
  line-height:1.6;
}
.annot b{color:#4F6BFF}
.annot .up-arrow{color:#22C55E;font-weight:700}
</style>

<script>
/* ================================================================
 *  教学计算演示台 · 核心脚本
 *  模块元数据 + 首页 + hash 路由 + 统一逐步演示引擎
 * ================================================================ */
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const randInt=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* ---------- 模块元数据 ---------- */
const MOD = {};

/* ---------- SECTION: 统一演示引擎 ---------- */
const Engine = {
  key:null, i:-1, timer:null, ms:1500, error:null,

  /* 载入模块：渲染外壳 → 生成步骤 → 复位播放状态 */
  load(key, keepSettings){
    const m = MOD[key];
    if(!m) return;
    Engine.stop();
    Engine.key = key;
    $('#modTitle').textContent = m.name;
    $('#modSub').textContent  = m.sub;
    $('#modBadge').textContent= m.badge;
    $('#modBadge').style.setProperty('--card-c', m.color);
    $('#theoryBody').innerHTML = m.theory();
    // setDesc 已合并到控制条，参数label由settingsHTML提供
    // 子页面 tab 导航
    const tabsEl = $('#subTabs');
    if(m.subTabs && m.subTabs.length){
      tabsEl.style.display = 'flex';
      if(!m.currentSub) m.currentSub = m.subTabs[0].id;
      tabsEl.innerHTML = m.subTabs.map(t=>
        `<div class="sub-tab ${t.id===m.currentSub?'active':''}" data-sub="${t.id}">${t.label}${t.method?`<span class="method">${t.method}</span>`:''}</div>`
      ).join('');
      tabsEl.querySelectorAll('.sub-tab').forEach(el=>{
        el.onclick = ()=>{
          tabsEl.querySelectorAll('.sub-tab').forEach(x=>x.classList.remove('active'));
          el.classList.add('active');
          m.currentSub = el.dataset.sub;
          if(m.onSubChange) m.onSubChange(el.dataset.sub);
          Engine.reload();
        };
      });
    }else{
      tabsEl.style.display = 'none';
      tabsEl.innerHTML = '';
    }
    if(!keepSettings) $('#settingsRow').innerHTML = m.settingsHTML();
    if(m.afterSettings) m.afterSettings();
    if($('#stageDesc')) $('#stageDesc').textContent = m.stageDesc;
    Engine.regenerate();
  },

  /* 重新生成题目；生成过程出错时进入错误态而不是留下半截步骤 */
  regenerate(){
    const m = MOD[Engine.key];
    Engine.stop();
    Engine.error = null;
    m.steps = [];
    try{
      m.generate();
    }catch(err){
      Engine.error = (err && err.message) ? err.message : String(err);
      m.steps = [];
    }
    if(!Array.isArray(m.steps)) m.steps = [];
    Engine.i = -1;
    Engine.renderAll();
  },

  /* 只重算步骤、保留当前设置项的取值（供参数变更后调用） */
  reload(){
    const m = MOD[Engine.key];
    if(!m) return;
    $('#settingsRow').innerHTML = m.settingsHTML();
    if(m.restoreSettings) m.restoreSettings();
    if(m.afterSettings) m.afterSettings();
    Engine.regenerate();
  },

  atEnd(){ const m=MOD[Engine.key]; return !m || !m.steps || Engine.i >= m.steps.length-1; },
  atStart(){ return Engine.i <= -1; },

  syncButtons(){
    const mk = MOD[Engine.key];
    const noSteps = Engine.error || !mk || !mk.steps || mk.steps.length===0;
    $('#btnStep').disabled = noSteps || Engine.atEnd();
    $('#btnPrev').disabled = noSteps || Engine.atStart();
    $('#btnAuto').disabled = noSteps;
    $('#btnNew').disabled  = !MOD[Engine.key] || !MOD[Engine.key].canRegenerate;
    $('#btnAuto').textContent = Engine.timer ? '暂停' : (Engine.atEnd() ? '重新播放' : '自动演示');
  },

  step(){
    if(Engine.error || Engine.atEnd()) { Engine.syncButtons(); return; }
    Engine.i++;
    Engine.renderStep();
  },
  prev(){
    if(Engine.error || Engine.atStart()) { Engine.syncButtons(); return; }
    Engine.i--;
    if(Engine.i < 0) Engine.renderAll(); else Engine.renderStep();
  },
  renderStep(){
    const m = MOD[Engine.key];
    const s = m.steps[Engine.i];
    if(!s) return;
    s.draw();
    $('#explainBox').innerHTML = s.desc;
    const N = m.steps.length;
    $('#stepLbl').textContent = `第 ${Engine.i+1} / ${N} 步`;
    $('#stepDone').textContent = `已完成 ${Math.round((Engine.i+1)/N*100)}%`;
    $('#stepFill').style.width = ((Engine.i+1)/N*100)+'%';
    Engine.syncButtons();
  },
  renderAll(){
    const m = MOD[Engine.key];
    if(Engine.error){
      $('#explainBox').innerHTML = `<div class="err"><div class="err-t">参数不合法，无法生成演示</div>${Engine.error}</div>`;
      $('#stage').innerHTML = `<div class="err"><div class="err-t">请修正上方参数后重试</div>修正后点击「换一题」或改动任一参数即可重新生成演示步骤。</div>`;
      $('#stepLbl').textContent = '共 0 步';
      $('#stepDone').textContent = '参数待修正';
      $('#stepFill').style.width = '0%';
      Engine.syncButtons();
      return;
    }
    const N = m ? m.steps.length : 0;
    $('#explainBox').innerHTML = N ? (m.initDesc || '点击「自动演示」或「下一步」，逐步观看计算过程。')
                                   : '当前参数下没有可演示的步骤，请调整参数。';
    $('#stepLbl').textContent = `共 ${N} 步`;
    $('#stepDone').textContent = '尚未开始';
    $('#stepFill').style.width = '0%';
    if(N && m.initStage) m.initStage();
    Engine.syncButtons();
  },
  /* 用 setTimeout 链而非 setInterval：切换倍速时不会残留旧节拍 */
  auto(){
    if(Engine.error) return;
    if(Engine.timer){ Engine.stop(); return; }
    if(Engine.atEnd()){ Engine.i = -1; Engine.renderAll(); }
    $('#btnAuto').textContent = '暂停';
    Engine.syncButtons();
    const tick = ()=>{
      if(Engine.i >= MOD[Engine.key].steps.length-1){ Engine.stop(); return; }
      Engine.step();
      if(Engine.i >= MOD[Engine.key].steps.length-1){ Engine.stop(); return; }
      Engine.timer = setTimeout(tick, Engine.ms);
    };
    Engine.timer = setTimeout(tick, Engine.ms);
  },
  stop(){
    if(Engine.timer){ clearTimeout(Engine.timer); Engine.timer=null; }
    const b=$('#btnAuto'); if(b) b.textContent = Engine.atEnd() ? '重新播放' : '自动演示';
    Engine.syncButtons();
  },
  reset(){
    Engine.stop();
    Engine.i = -1;
    Engine.renderAll();
  },
  /* 倍速实时生效：清掉旧定时器按新间隔续播 */
  setSpeed(ms){
    Engine.ms = ms;
    if(Engine.timer){ clearTimeout(Engine.timer); Engine.timer=null; Engine.auto(); }
  }
};
$('#btnAuto').onclick = () => Engine.auto();
$('#btnStep').onclick = () => Engine.step();
$('#btnPrev').onclick = () => Engine.prev();
$('#btnReset').onclick = () => Engine.reset();
$('#btnNew').onclick = () => Engine.regenerate();
$$('#speedGrp button').forEach(b=>{
  b.onclick=()=>{
    $$('#speedGrp button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    Engine.setSpeed(parseInt(b.dataset.ms,10));
  };
});
/* 键盘快捷键：忽略输入框内的按键，避免干扰参数录入 */
document.addEventListener('keydown', e=>{
  if(!$('#view-demo').classList.contains('active')) return;
  const t=e.target;
  if(t && (t.tagName==='INPUT'||t.tagName==='SELECT'||t.tagName==='TEXTAREA')) return;
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const k=e.key;
  if(k===' '||k==='Spacebar'){ e.preventDefault(); Engine.auto(); }
  else if(k==='ArrowRight'){ e.preventDefault(); Engine.step(); }
  else if(k==='ArrowLeft'){ e.preventDefault(); Engine.prev(); }
  else if(k==='r'||k==='R'){ e.preventDefault(); Engine.reset(); }
  else if(k==='n'||k==='N'){ e.preventDefault(); if(!$('#btnNew').disabled) Engine.regenerate(); }
});

/* ---------- hash 路由 ---------- */
function route(){
  const h = location.hash.replace('#/','').replace('#','');
  const demo = $('#view-demo'), home = $('#view-home');
  if(h && h!=='home' && MOD[h]){
    home.classList.remove('active'); demo.classList.add('active');
    Engine.load(h);
    window.scrollTo(0,0);
  }else{
    demo.classList.remove('active'); home.classList.add('active');
    Engine.stop();
    window.scrollTo(0,0);
  }
}
window.addEventListener('hashchange', route);

/* ---------- 首页卡片生成 ---------- */
const MOD_ORDER = ['base','enc','media','ip','excel','pyexpr','pystruct','stack','queue','tree','graph'];
function renderHome(){
  $('#homeGrid').innerHTML = MOD_ORDER.map(k=>{
    const m = MOD[k];
    return `
    <a class="card" data-cat="${m.cat}" href="#${k}" style="--card-c:${m.color};--card-soft:${m.soft}">
      <span class="card-accent"></span>
      <div class="top">
        <div class="icon-box">${m.icon}</div>

          <h3>${m.name}<span class="tag">${m.tag}</span></h3>
          <div class="type">${m.type}</div>
        </div>
      </div>
      <p>${m.desc}</p>
      <span class="enter">开始演示
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </span>
    </a>`;
  }).join('');
}
$('#homeFilters').addEventListener('click', e=>{
  const b = e.target.closest('.filter-btn');
  if(!b) return;
  $$('#homeFilters .filter-btn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');

    c.style.display = (f==='all'||c.dataset.cat===f) ? '' : 'none';
  });

/* ================================================================
 * ① 进制转换（含进制基本概念：位权 / 基数 / 数码）
 * ================================================================ */
const B={2:'二进制',8:'八进制',10:'十进制',16:'十六进制'};
const DIGITS='0123456789ABCDEF';
function toBase(n,b){ if(n===0)return'0'; let r=''; while(n>0){r=DIGITS[n%b]+r;n=Math.floor(n/b);} return r; }
function fromBase(s,b){ let v=0; for(const ch of s.toUpperCase()){v=v*b+DIGITS.indexOf(ch);} return v; }
function randDigits(b,len){ let s=''; for(let i=0;i<len;i++) s+=DIGITS[randInt(0,b-1)]; return s; }

MOD.base = {
  name:'进制转换', sub:'二 / 八 / 十 / 十六进制互转 · 手写逐步演示',
  badge:'数制 · 互转', tag:'进制', cat:'bit',
  color:'#4F6BFF', soft:'#EEF3FF', type:'二八十六进制互转 · 按权展开 · 除基取余 · 分组转换',
  desc:'支持二、八、十、十六进制之间互转，每个转换方向独立子页面，用手写动画逐步演示推导过程。',
  icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l6-6-6-6M12 19h8"/></svg>',
  setDesc:'',
  stageDesc:'',
  initDesc:'点击「自动演示」或「下一步」，观看进制转换的手写推导过程。',
  currentSub:'bin2dec',
  subTabs:[
    {id:'bin2dec',label:'二转十',method:'按权展开'},
    {id:'dec2bin',label:'十转二',method:'除基取余'},
    {id:'bin2hex',label:'二转十六',method:'4位分组'},
    {id:'hex2bin',label:'十六转二',method:'逐位展开'},
    {id:'bin2oct',label:'二转八',method:'3位分组'},
    {id:'oct2bin',label:'八转二',method:'逐位展开'},
    {id:'oct2dec',label:'八转十',method:'按权展开'},
    {id:'dec2oct',label:'十转八',method:'除基取余'},
    {id:'dec2hex',label:'十转十六',method:'除基取余'},
    {id:'hex2dec',label:'十六转十',method:'按权展开'}
  ],
  theory(){
    return `<div class="rule"><b>数码</b>：进制中使用的符号。二进制用 0、1；八进制用 0~7；十进制用 0~9；十六进制用 0~9、A~F。</div>
    <div class="rule"><b>基数</b>：进制中数码的个数。二进制基数=2，八进制=8，十进制=10，十六进制=16。</div>
    <div class="rule"><b>位权</b>：每一位的权重 = 基数<sup>位序</sup>。例如十进制 123 中，3 的位权是 10⁰=1，2 是 10¹=10，1 是 10²=100。</div>
    <div class="rule"><b>按权展开</b>（其他进制→十进制）：每一位数码 × 对应位权，再求和。</div>
    <div class="rule"><b>除基取余</b>（十进制→其他进制）：不断除以目标基数，记录余数，最后<b>逆序</b>读取余数即为结果。</div>
    <div class="rule">非十进制之间互转：先转十进制（按权展开），再转目标进制（除基取余）。</div>`;
  },
  settingsHTML(){
    const sub=this.currentSub;
    const isExpand = sub.endsWith('2dec');
    const isDivide = sub.startsWith('dec2');
    const isGroup = sub==='bin2oct'||sub==='bin2hex';
    const isExpandBin = sub==='oct2bin'||sub==='hex2bin';
    let lenOptions = '';
    if(isExpand){
      const max = sub==='hex2dec'?3:4;
      for(let i=2;i<=max;i++) lenOptions+=`<option value="${i}" ${i===3?'selected':''}>${i} 位</option>`;
    }else if(isDivide){
      lenOptions = `<option value="small" selected>较小数</option><option value="medium">中等数</option><option value="large">较大数</option>`;
    }else if(isGroup){
      const gs = sub==='bin2oct'?3:4;
      lenOptions = `<option value="${gs+1}" selected>${gs+1} 位</option><option value="${gs*2}">${gs*2} 位</option><option value="${gs*3}">${gs*3} 位</option>`;
    }else{
      lenOptions = `<option value="2" selected>2 位</option><option value="3">3 位</option>`;
    }
    return `<div class="setting"><label>${isDivide?'数字大小':'数字位数'}</label>
      <select id="b-len">${lenOptions}</select></div>`;
  },
  afterSettings(){
    $('#b-len').onchange=()=>Engine.regenerate();
  },
  /* 逐字出现动画辅助 */
  typeChars(text){
    return [...String(text)].map((ch,i)=>`<span class="char-in" style="animation-delay:${i*0.06}s">${esc(ch)}</span>`).join('');
  },
  /* 写出原数的通用画布 */
  drawNumber(num, subLabel, stateText){
    return `<div class="stage-hd"><span>${subLabel}</span><span class="state">${stateText}</span></div>
      <div style="text-align:center;padding:clamp(16px,3vw,28px) 0">
        <span style="font-family:var(--mono);font-size:clamp(22px,4vw,34px);font-weight:700;color:var(--text)">
          ${this.typeChars(num)}<sub style="font-size:.45em;color:var(--text-3)">${subLabel.split('→')[0].trim()}</sub>
        </span>
        <span class="caret pen"></span>
      </div>`;
  },
  /* ========== 按权展开法（其他进制 → 十进制） ========== */
  genExpand(srcB){
    const len=+$('#b-len').value || 3;
    let digits=randDigits(srcB,len);
    if(digits[0]==='0') digits=DIGITS[randInt(1,srcB-1)]+digits.slice(1);
    const dec=fromBase(digits,srcB);
    const steps=[];
    const label=`${B[srcB]} → 十进制`;
    // 步骤1：写出原数
    steps.push({desc:`写出要转换的${B[srcB]}数：<b class="c-op">${digits}</b>`,
      draw:()=>{$('#stage').innerHTML=this.drawNumber(digits,label,'准备');}});
    // 步骤2：画表头
    steps.push({desc:`用<b>按权展开法</b>：每一位数码 × 位权（${srcB}<sup>位序</sup>），再求和。`,
      draw:()=>{
        $('#stage').innerHTML=`<div class="stage-hd"><span>${label}</span><span class="state">按权展开</span></div>
          <div class="step-title"><span class="st-dot"></span>位权展开表</div>
          <table class="exp-table">
            <tr><th>位序</th>${[...digits].map((_,i)=>`<th class="write-in" style="animation-delay:${i*0.08}s">${digits.length-1-i}</th>`).join('')}</tr>
            <tr><th>数码</th>${[...digits].map((d,i)=>`<td class="write-in" style="animation-delay:${i*0.08}s">${d}</td>`).join('')}</tr>
            <tr><th>位权</th>${[...digits].map(()=>`<td class="empty">?</td>`).join('')}</tr>
            <tr><th>贡献</th>${[...digits].map(()=>`<td class="empty">?</td>`).join('')}</tr>
          </table>`;
      }});
    // 步骤3-N：逐位计算
    let sum=0;
    for(let i=0;i<digits.length;i++){
      const d=DIGITS.indexOf(digits[i].toUpperCase());
      const power=digits.length-1-i;
      const weight=Math.pow(srcB,power);
      const contrib=d*weight;
      sum+=contrib;
      const idx=i, stepSum=sum, dSnap=d, wSnap=weight, cSnap=contrib, pSnap=power;
      steps.push({desc:`第 ${i+1} 位：数码 <b class="c-op">${digits[i]}</b>，位序 <b>${power}</b>，位权 = ${srcB}<sup>${power}</sup> = <b>${weight}</b>，贡献 = ${d} × ${weight} = <b class="c-op">${contrib}</b>${i>0?`，累计 ${stepSum}`:''}`,
        draw:()=>{
          $('#stage').innerHTML=`<div class="stage-hd"><span>${label}</span><span class="state">第 ${idx+1}/${digits.length} 位</span></div>
            <div class="step-title"><span class="st-dot"></span>位权展开表</div>
            <table class="exp-table">
              <tr><th>位序</th>${[...digits].map((_,j)=>`<th>${digits.length-1-j}</th>`).join('')}</tr>
              <tr><th>数码</th>${[...digits].map((d,j)=>`<td class="${j<=idx?'done':''}">${d}</td>`).join('')}</tr>
              <tr><th>位权</th>${[...digits].map((_,j)=>`<td class="${j<idx?'done':j===idx?'cur':'empty'}">${j<=idx?Math.pow(srcB,digits.length-1-j):'?'}</td>`).join('')}</tr>
              <tr><th>贡献</th>${[...digits].map((d,j)=>{
                const dd=DIGITS.indexOf(d.toUpperCase());
                return `<td class="${j<idx?'done':j===idx?'cur':'empty'}">${j<=idx?dd*Math.pow(srcB,digits.length-1-j):'?'}</td>`;
              }).join('')}</tr>
            </table>
            <div class="exp-inline">
              <span class="term done">${dSnap} × ${srcB}<sup>${pSnap}</sup></span>
              <span class="op">=</span>
              <span class="term cur">${cSnap}</span>
              ${idx>0?`<span class="op">→</span><span class="term">累计 <b class="res">${stepSum}</b></span>`:''}
            </div>`;
        }});
    }
    // 最后：求和
    const contribs=[...digits].map((d,i)=>DIGITS.indexOf(d.toUpperCase())*Math.pow(srcB,digits.length-1-i));
    steps.push({desc:`所有位贡献相加：${contribs.join(' + ')} = <b class="c-op">${dec}</b>`,
      draw:()=>{
        $('#stage').innerHTML=`<div class="stage-hd"><span>${label}</span><span class="state">完成</span></div>
          <div class="step-title"><span class="st-dot"></span>位权展开表</div>
          <table class="exp-table">
            <tr><th>位序</th>${[...digits].map((_,j)=>`<th>${digits.length-1-j}</th>`).join('')}</tr>
            <tr><th>数码</th>${[...digits].map(d=>`<td class="done">${d}</td>`).join('')}</tr>
            <tr><th>位权</th>${[...digits].map((_,j)=>`<td class="done">${Math.pow(srcB,digits.length-1-j)}</td>`).join('')}</tr>
            <tr><th>贡献</th>${contribs.map(c=>`<td class="done">${c}</td>`).join('')}</tr>
          </table>
          <div class="write-result">${digits}<sub>${B[srcB]}</sub> = ${dec}<sub>十进制</sub></div>`;
      }});
    return steps;
  },
  /* ========== 除基取余法（十进制 → 其他进制） ========== */
  genDivide(dstB){
    const size=$('#b-len').value || 'small';
    const range={small:[10,99],medium:[100,499],large:[500,999]}[size]||[10,99];
    const dec=randInt(range[0],range[1]);
    const steps=[];
    const label=`十进制 → ${B[dstB]}`;
    // 预计算所有行
    const allRows=[];
    let temp=dec;
    while(temp>0){
      const tq=Math.floor(temp/dstB), tr=temp%dstB;
      allRows.push({n:temp,q:tq,r:DIGITS[tr]});
      temp=tq;
    }
    if(allRows.length===0) allRows.push({n:0,q:0,r:'0'});
    const ans=allRows.map(r=>r.r).reverse().join('');
    // 步骤1：写出原数
    steps.push({desc:`写出要转换的十进制数：<b class="c-op">${dec}</b>`,
      draw:()=>{$('#stage').innerHTML=this.drawNumber(dec,label,'准备');}});
    // 步骤2：写标题
    steps.push({desc:`用<b>除基取余法</b>：不断除以 ${dstB}，记录余数，最后<b>逆序</b>（从下往上）读取余数。`,
      draw:()=>{
        $('#stage').innerHTML=`<div class="stage-hd"><span>${label}</span><span class="state">除基取余</span></div>
          <div class="step-title"><span class="st-dot"></span>竖式除法（基数 = ${dstB}）</div>
          <div class="div-vertical">
            <div class="dv-row write-in"><span class="dv-num">${dec}</span><span class="dv-op">÷</span><span class="dv-num">${dstB}</span><span class="dv-eq">=</span><span class="dv-q">?</span><span class="dv-rem">?</span></div>
          </div>`;
      }});
    // 步骤3-N：逐次除法
    const rems=[];
    for(let i=0;i<allRows.length;i++){
      const row=allRows[i];
      rems.push(row.r);
      const remsSnap=[...rems];
      const idx=i;
      steps.push({desc:`<b>${row.n}</b> ÷ ${dstB} = <b>${row.q}</b>，余数 <b class="c-op">${row.r}</b>`,
        draw:()=>{
          const rowsHtml=allRows.map((rd,j)=>`<div class="dv-row ${j===idx?'cur':j<idx?'done':''} ${j<=idx?'write-in':''}" style="${j<=idx?`animation-delay:${j*0.04}s`:''}">
            <span class="dv-num">${j<=idx?rd.n:'?'}</span><span class="dv-op">÷</span><span class="dv-num">${dstB}</span><span class="dv-eq">=</span><span class="dv-q">${j<=idx?rd.q:'?'}</span><span class="dv-rem">${j<=idx?rd.r:'?'}</span>
          </div>`).join('');
          $('#stage').innerHTML=`<div class="stage-hd"><span>${label}</span><span class="state">第 ${idx+1}/${allRows.length} 次</span></div>
            <div class="step-title"><span class="st-dot"></span>竖式除法（基数 = ${dstB}）</div>
            <div class="div-vertical" style="margin-bottom:10px">${rowsHtml}</div>
            <div class="annot" style="padding:6px 10px;background:#F8FAFC;border-radius:8px;display:inline-block">
              <b>余数收集</b>：${remsSnap.map(r=>`<span class="chip o" style="margin:0 2px;font-size:clamp(12px,1.6vw,15px)">${r}</span>`).join('')}
              ${remsSnap.length>0?'<span class="up-arrow" style="margin-left:8px">↑ 从下往上读（逆序）</span>':'<span style="color:#CBD5E1">（暂无）</span>'}
            </div>`;
        }});
    }
    // 最后：逆序读出
    steps.push({desc:`余数<b>逆序</b>读取（从下往上）：${rems.slice().reverse().join('')} → 结果 <b class="c-op">${ans}</b>`,
      draw:()=>{
        const rowsHtml=allRows.map((rd,j)=>`<div class="dv-row done">
          <span class="dv-num">${rd.n}</span><span class="dv-op">÷</span><span class="dv-num">${dstB}</span><span class="dv-eq">=</span><span class="dv-q">${rd.q}</span><span class="dv-rem">${rd.r}</span>
          ${j===allRows.length-1?'<span class="dv-arrow">↑ 最低位</span>':j===0?'<span class="dv-arrow">↑ 最高位</span>':''}
        </div>`).join('');
        $('#stage').innerHTML=`<div class="stage-hd"><span>${label}</span><span class="state">完成</span></div>
          <div class="step-title"><span class="st-dot"></span>竖式除法（基数 = ${dstB}）· 余数从下往上读</div>
          <div class="div-vertical" style="margin-bottom:6px">${rowsHtml}</div>
          <div class="write-result">${dec}<sub>十进制</sub> = ${ans}<sub>${B[dstB]}</sub></div>`;
      }});
    return steps;
  },
  /* ========== 二进制分组转换（二 → 八/十六） ========== */
  genBinGroup(groupSize,dstB){
    const len=+$('#b-len').value || (groupSize+1);
    let digits=randDigits(2,len);
    if(digits[0]==='0') digits='1'+digits.slice(1);
    const dec=fromBase(digits,2);
    const ans=toBase(dec,dstB);
    const padded=digits.padStart(Math.ceil(digits.length/groupSize)*groupSize,'0');
    const groups=[];
    for(let i=0;i<padded.length;i+=groupSize) groups.push(padded.slice(i,i+groupSize));
    const groupVals=groups.map(g=>fromBase(g,2));
    const groupDigits=groupVals.map(v=>DIGITS[v]);
    const steps=[];
    const label=`二进制 → ${B[dstB]}`;
    const groupName=groupSize===3?'三位一组':'四位一组';
    // 步骤1：写出原数
    steps.push({desc:`写出要转换的二进制数：<b class="c-op">${digits}</b>`,
      draw:()=>{$('#stage').innerHTML=this.drawNumber(digits,label,'准备');}});
    // 步骤2：分组
    steps.push({desc:`从右往左每 <b>${groupSize}</b> 位分一组，左侧不足补 <b>0</b>：<b class="c-op">${padded}</b>，共 ${groups.length} 组。`,
      draw:()=>{
        $('#stage').innerHTML=`<div class="stage-hd"><span>${label}</span><span class="state">${groupName}</span></div>
          <div style="text-align:center;padding:clamp(14px,2.5vw,22px) 0">
            <div class="group-box">
              ${groups.map((g,i)=>`<span class="grp write-in" style="animation-delay:${i*0.12}s">${g}</span>`).join('')}
            </div>
            <div style="margin-top:10px;font-size:clamp(11px,1.4vw,12.5px);color:#94A3B8">补零后：${padded}（原数 ${digits}）</div>
          </div>`;
      }});
    // 步骤3-N：逐组转换
    for(let i=0;i<groups.length;i++){
      const idx=i;
      steps.push({desc:`第 ${i+1} 组 <b class="c-op">${groups[i]}</b> = ${groupVals[i]} → ${B[dstB]}数码 <b class="c-op">${groupDigits[i]}</b>`,
        draw:()=>{
          $('#stage').innerHTML=`<div class="stage-hd"><span>${label}</span><span class="state">第 ${idx+1}/${groups.length} 组</span></div>
            <div style="text-align:center;padding:clamp(12px,2vw,18px) 0">
              <div class="group-box">
                ${groups.map((g,j)=>`<span class="grp ${j<idx?'done':j===idx?'cur':''}">${g}</span>`).join('')}
              </div>
              <div style="margin:14px 0;font-size:clamp(14px,2vw,18px);color:#94A3B8">↓ 逐组转换 ↓</div>
              <div class="group-box">
                ${groups.map((g,j)=>`<span class="grp ${j<idx?'done':j===idx?'cur':''}" style="${j>=idx?'opacity:.35':''}">${j<=idx?groupDigits[j]:'?'}</span>`).join('')}
              </div>
              <div class="exp-inline" style="margin-top:12px;display:inline-block">
                <span class="term ${idx===0?'cur':'done'}">${groups[idx]}</span>
                <span class="op">=</span>
                <span class="term cur">${groupVals[idx]}</span>
                <span class="op">→</span>
                <span class="term cur">${groupDigits[idx]}</span>
              </div>
            </div>`;
        }});
    }
    // 最后：拼接
    steps.push({desc:`各组结果拼接：${groupDigits.join('')} → <b class="c-op">${ans}</b>`,
      draw:()=>{
        $('#stage').innerHTML=`<div class="stage-hd"><span>${label}</span><span class="state">完成</span></div>
          <div style="text-align:center;padding:clamp(12px,2vw,18px) 0">
            <div class="group-box">${groups.map(g=>`<span class="grp done">${g}</span>`).join('')}</div>
            <div style="margin:12px 0;font-size:clamp(14px,2vw,18px);color:#22C55E">↓ 拼接 ↓</div>
            <div class="group-box">${groupDigits.map(d=>`<span class="grp done" style="border-color:#22C55E;background:#E8FBF0">${d}</span>`).join('')}</div>
          </div>
          <div class="write-result">${digits}<sub>二进制</sub> = ${ans}<sub>${B[dstB]}</sub></div>`;
      }});
    return steps;
  },
  /* ========== 逐位展开（八/十六 → 二） ========== */
  genToBin(srcB){
    const groupSize=srcB===8?3:4;
    const len=+$('#b-len').value || 2;
    let digits=randDigits(srcB,len);
    if(digits[0]==='0') digits=DIGITS[randInt(1,srcB-1)]+digits.slice(1);
    const dec=fromBase(digits,srcB);
    const ans=toBase(dec,2);
    const bitGroups=[...digits].map(d=>{
      const v=DIGITS.indexOf(d.toUpperCase());
      return v.toString(2).padStart(groupSize,'0');
    });
    const steps=[];
    const label=`${B[srcB]} → 二进制`;
    // 步骤1：写出原数
    steps.push({desc:`写出要转换的${B[srcB]}数：<b class="c-op">${digits}</b>`,
      draw:()=>{$('#stage').innerHTML=this.drawNumber(digits,label,'准备');}});
    // 步骤2：说明
    steps.push({desc:`每位${B[srcB]}数码展开为 <b>${groupSize}</b> 位二进制（0→${'0'.repeat(groupSize)}，${srcB-1}→${(srcB-1).toString(2)}）。`,
      draw:()=>{
        $('#stage').innerHTML=`<div class="stage-hd"><span>${label}</span><span class="state">逐位展开</span></div>
          <div style="text-align:center;padding:clamp(14px,2.5vw,22px) 0">
            <div class="group-box">
              ${[...digits].map((d,i)=>`<span class="grp write-in" style="animation-delay:${i*0.1}s">${d}</span>`).join('')}
            </div>
            <div style="margin-top:12px;font-size:clamp(11px,1.4vw,12.5px);color:#94A3B8">每位展开为 ${groupSize} 位二进制</div>
          </div>`;
      }});
    // 步骤3-N：逐位展开
    for(let i=0;i<digits.length;i++){
      const idx=i;
      const v=DIGITS.indexOf(digits[i].toUpperCase());
      steps.push({desc:`第 ${i+1} 位 <b class="c-op">${digits[i]}</b> = ${v} → 二进制 <b class="c-op">${bitGroups[i]}</b>`,
        draw:()=>{
          $('#stage').innerHTML=`<div class="stage-hd"><span>${label}</span><span class="state">第 ${idx+1}/${digits.length} 位</span></div>
            <div style="text-align:center;padding:clamp(12px,2vw,18px) 0">
              <div class="group-box">
                ${[...digits].map((d,j)=>`<span class="grp ${j<idx?'done':j===idx?'cur':''}">${d}</span>`).join('')}
              </div>
              <div style="margin:12px 0;font-size:clamp(14px,2vw,18px);color:#94A3B8">↓ 逐位展开 ↓</div>
              <div class="group-box">
                ${bitGroups.map((bg,j)=>`<span class="grp ${j<idx?'done':j===idx?'cur':''}" style="${j>=idx?'opacity:.35':''};min-width:${groupSize*1.2}em">${j<=idx?bg:'?'}</span>`).join('')}
              </div>
              <div class="exp-inline" style="margin-top:12px;display:inline-block">
                <span class="term cur">${digits[idx]}</span><span class="op">=</span>
                <span class="term cur">${v}</span><span class="op">→</span>
                <span class="term cur">${bitGroups[idx]}</span>
              </div>
            </div>`;
        }});
    }
    // 最后：拼接去前导零
    const combined=bitGroups.join('');
    steps.push({desc:`拼接后为 <b>${combined}</b>，去掉前导零得 <b class="c-op">${ans}</b>`,
      draw:()=>{
        $('#stage').innerHTML=`<div class="stage-hd"><span>${label}</span><span class="state">完成</span></div>
          <div style="text-align:center;padding:clamp(12px,2vw,18px) 0">
            <div class="group-box">${[...digits].map(d=>`<span class="grp done">${d}</span>`).join('')}</div>
            <div style="margin:12px 0;font-size:clamp(14px,2vw,18px);color:#22C55E">↓ 拼接 ↓</div>
            <div style="font-family:var(--mono);font-size:clamp(16px,2.5vw,22px);font-weight:700;color:#334155;letter-spacing:2px">${combined}</div>
            <div style="margin-top:8px;font-size:clamp(11px,1.4vw,12.5px);color:#94A3B8">去掉前导零</div>
          </div>
          <div class="write-result">${digits}<sub>${B[srcB]}</sub> = ${ans}<sub>二进制</sub></div>`;
      }});
    return steps;
  },
  /* 初始化演示画布（切换子页面时清空旧内容） */
  initStage(){
    const sub=this.currentSub;
    const labelMap={
      bin2dec:'二进制 → 十进制',oct2dec:'八进制 → 十进制',hex2dec:'十六进制 → 十进制',
      dec2bin:'十进制 → 二进制',dec2oct:'十进制 → 八进制',dec2hex:'十进制 → 十六进制',
      bin2oct:'二进制 → 八进制',bin2hex:'二进制 → 十六进制',
      oct2bin:'八进制 → 二进制',hex2bin:'十六进制 → 二进制'
    };
    const methodMap={
      bin2dec:'按权展开法',oct2dec:'按权展开法',hex2dec:'按权展开法',
      dec2bin:'除基取余法',dec2oct:'除基取余法',dec2hex:'除基取余法',
      bin2oct:'三位分组法',bin2hex:'四位分组法',
      oct2bin:'逐位展开法',hex2bin:'逐位展开法'
    };
    $('#stage').innerHTML=`<div class="stage-hd"><span>${labelMap[sub]||'进制转换'}</span><span class="state">准备就绪</span></div>
      <div style="text-align:center;padding:clamp(20px,4vw,36px) 0;color:#94A3B8">
        <div style="font-size:clamp(14px,2vw,17px);margin-bottom:8px">使用 <b style="color:#4F6BFF">${methodMap[sub]||''}</b></div>
        <div style="font-size:clamp(12px,1.5vw,14px)">点击「自动演示」或「下一步」开始手写推导</div>
      </div>`;
  },
  generate(){
    const sub=this.currentSub;
    switch(sub){
      case 'bin2dec': this.steps=this.genExpand(2); break;
      case 'oct2dec': this.steps=this.genExpand(8); break;
      case 'hex2dec': this.steps=this.genExpand(16); break;
      case 'dec2bin': this.steps=this.genDivide(2); break;
      case 'dec2oct': this.steps=this.genDivide(8); break;
      case 'dec2hex': this.steps=this.genDivide(16); break;
      case 'bin2oct': this.steps=this.genBinGroup(3,8); break;
      case 'bin2hex': this.steps=this.genBinGroup(4,16); break;
      case 'oct2bin': this.steps=this.genToBin(8); break;
      case 'hex2bin': this.steps=this.genToBin(16); break;
      default: this.steps=this.genExpand(2);
    }
  }
};

  afterSettings(){

  /* 逐字出现动画辅助 */

  /* ========== ASCII 码值：字符 → 十进制 → 二进制 → 十六进制 ========== */
  genAscii(){
    const el=$('#e-ascii');
    const group=el?el.value:'upper';
    const pools={
      upper:'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
      lower:'abcdefghijklmnopqrstuvwxyz',
      digit:'0123456789',
      symbol:'!?#@%&*()/-'
    };
    const pool=pools[group]||pools.upper;
    const ch=pick([...pool]);
    const code=ch.charCodeAt(0);
    const bin=code.toString(2).padStart(8,'0');
    const hex=code.toString(16).toUpperCase().padStart(2,'0');
    const label='字符 → ASCII 码值';
    /* 预计算除 2 取余竖式 */
    const rows=[];
    let temp=code;
    if(temp===0) rows.push({n:0,q:0,r:'0'});
    while(temp>0){
      const q=Math.floor(temp/2), r=temp%2;
      rows.push({n:temp,q,r}); temp=q;
    }
    const steps=[];
    /* 步骤1：写出字符 */
    steps.push({desc:`写出要查询的字符 <b class="c-op">"${ch}"</b>，准备对照 ASCII 码表求码值。`,
      draw:()=>{
        $('#stage').innerHTML=`<div class="stage-hd"><span>${label}</span><span class="state">准备</span></div>
          <div style="text-align:center;padding:clamp(18px,3.5vw,30px) 0">
            <span style="font-family:var(--mono);font-size:clamp(26px,5vw,38px);font-weight:700;color:var(--text)">
              "${this.typeChars(ch)}"
            </span>
            <span class="caret pen"></span>
          </div>`;
      }});
    /* 步骤2：查表得十进制码值 */
    steps.push({desc:`查 ASCII 码表：字符 <b class="c-op">${ch}</b> 对应的十进制码值 = <b class="c-op">${code}</b>。`,
      draw:()=>{
        $('#stage').innerHTML=`<div class="stage-hd"><span>${label}</span><span class="state">查码表</span></div>
          <div class="step-title"><span class="st-dot"></span>对照 ASCII 码表</div>
          <div class="exp-inline" style="display:inline-flex;align-items:center;gap:8px;margin-top:8px">
            <span class="term cur" style="font-size:clamp(15px,2.2vw,19px)">"${esc(ch)}"</span>
            <span class="op">→</span>
            <span class="term write-in" style="animation-delay:.25s;color:#22C55E;font-weight:700;font-size:clamp(15px,2.2vw,19px)">${code}<sub style="font-size:.55em;color:#94A3B8">十进制</sub></span>
            <span class="caret pen" style="margin-left:6px"></span>
          </div>
          <div class="annot" style="margin-top:10px;padding:6px 10px;background:#F8FAFC;border-radius:8px;display:inline-block">
            常见对照：A=65，a=97，0=48；本字符查表得 <b>${code}</b>。
          </div>`;
      }});
    /* 步骤3：除 2 取余竖式求二进制 */
    steps.push({desc:`十进制 <b class="c-op">${code}</b> 连续除以 2 并记录余数，余数<b>从下往上逆序</b>读出，得到 8 位二进制 <b class="c-op">${bin}</b>。`,
      draw:()=>{
        const rowsHtml=rows.map((rd,i)=>`<div class="dv-row write-in ${i===rows.length-1?'cur':''}" style="animation-delay:${i*0.09}s">
          <span class="dv-num">${rd.n}</span><span class="dv-op">÷</span><span class="dv-num">2</span><span class="dv-eq">=</span><span class="dv-q">${rd.q}</span><span class="dv-rem">${rd.r}</span>
        </div>`).join('');
        $('#stage').innerHTML=`<div class="stage-hd"><span>${label}</span><span class="state">除 2 取余</span></div>
          <div class="step-title"><span class="st-dot"></span>竖式除法（基数 = 2）</div>
          <div class="div-vertical" style="margin-bottom:10px">${rowsHtml}</div>
          <div class="annot" style="padding:6px 10px;background:#F8FAFC;border-radius:8px;display:inline-block">
            <b>余数收集</b>（从下往上读）：
            ${rows.slice().reverse().map(rd=>`<span class="chip g" style="margin:0 2px;font-size:clamp(12px,1.6vw,15px)">${rd.r}</span>`).join('')}
            <span class="up-arrow" style="margin-left:8px">↑ 逆序 = ${bin}</span>
          </div>`;
      }});
    /* 步骤4：十六进制 + 最终结果 */
    steps.push({desc:`十进制 <b>${code}</b> 对应的十六进制为 <b class="c-op">${hex}H</b>；ASCII 码在计算机中占 <b>1 字节</b>（8 位二进制）。`,
      draw:()=>{
        $('#stage').innerHTML=`<div class="stage-hd"><span>${label}</span><span class="state">完成</span></div>
          <div class="step-title"><span class="st-dot"></span>三种进制对照</div>
          <div class="exp-inline" style="display:flex;flex-wrap:wrap;align-items:center;gap:6px;justify-content:center;margin:10px 0">
            <span class="term done">"${esc(ch)}"</span><span class="op">=</span>
            <span class="term">${code}<sub style="font-size:.55em">10</sub></span><span class="op">=</span>
            <span class="term">${bin}<sub style="font-size:.55em">2</sub></span><span class="op">=</span>
            <span class="term cur">${hex}<sub style="font-size:.55em">16</sub></span>
          </div>
          <div class="write-result">"${esc(ch)}" → 十进制 ${code} → 二进制 ${bin} → 十六进制 ${hex}H（1 字节）</div>`;

  /* ========== BCD 编码：十进制数逐位转 4 位二进制 ========== */
  genBcd(){
    const el=$('#e-bcd-len');
    const len=el?+el.value:3;
    const num=randInt(Math.pow(10,len-1),Math.pow(10,len)-1);
    const digits=String(num).split('');
    const bits=digits.map(d=>parseInt(d).toString(2).padStart(4,'0'));
    const bcd=bits.join('');
    const label='BCD 编码';
    const steps=[];
    /* 步骤1：写出十进制数 */
    steps.push({desc:`写出十进制数 <b class="c-op">${num}</b>；BCD 编码规定：每位十进制数用 <b>4 位二进制</b>表示。`,
      draw:()=>{
        $('#stage').innerHTML=`<div class="stage-hd"><span>${label}</span><span class="state">${num}</span></div>
          <div class="step-title"><span class="st-dot"></span>待编码的十进制数</div>
          <div style="text-align:center;padding:clamp(12px,2vw,18px) 0">
            <div class="group-box">
              ${digits.map((d,i)=>`<span class="grp write-in" style="animation-delay:${i*0.1}s">${d}</span>`).join('')}
            </div>
            <div style="margin-top:10px;font-size:clamp(11px,1.4vw,12.5px);color:#94A3B8">每位 → 4 位二进制</div>
          </div>`;
      }});
    /* 步骤2：列出数位对照表 */
    steps.push({desc:`列出每一位十进制数码，逐位转换为 4 位二进制（0→0000，9→1001）。`,
      draw:()=>{
        $('#stage').innerHTML=`<div class="stage-hd"><span>${label}</span><span class="state">列出数位</span></div>
          <div class="step-title"><span class="st-dot"></span>数位对照</div>
          <table class="exp-table">
            <tr><th>十进制位</th>${digits.map((d,i)=>`<th class="write-in" style="animation-delay:${i*0.08}s">${d}</th>`).join('')}</tr>
            <tr><th>BCD(4位)</th>${digits.map(()=>`<td class="empty">?</td>`).join('')}</tr>
          </table>
          <div class="annot" style="margin-top:8px;padding:6px 10px;background:#F8FAFC;border-radius:8px;display:inline-block">
            参考对照：0→0000，1→0001，…，9→1001
          </div>`;
      }});
    /* 步骤3~N：逐位转换 */
    let bcdSnap='';
    digits.forEach((d,i)=>{
      bcdSnap+=bits[i];
      const snap=bcdSnap, idx=i;
      steps.push({desc:`第 ${i+1} 位 <b class="c-op">${d}</b> → 4 位二进制 <b class="c-op">${bits[i]}</b>；当前已拼接 BCD 码 = <b class="c-op">${snap}</b>${i<digits.length-1?' …':''}。`,
        draw:()=>{
          $('#stage').innerHTML=`<div class="stage-hd"><span>${label}</span><span class="state">第 ${idx+1}/${digits.length} 位</span></div>
            <div class="step-title"><span class="st-dot"></span>逐位编码</div>
            <table class="exp-table">
              <tr><th>十进制位</th>${digits.map(x=>`<th>${x}</th>`).join('')}</tr>
              <tr><th>BCD(4位)</th>${digits.map((x,j)=>`<td class="${j<idx?'done':j===idx?'cur':'empty'}">${j<=idx?bits[j]:'?'}</td>`).join('')}</tr>
            </table>
            <div class="exp-inline" style="display:inline-block;margin-top:8px">
              <span class="term cur">${d}</span><span class="op">=</span><span class="term cur">${bits[idx]}</span>
              <span class="op">→</span><span class="term">BCD = <b style="color:#4F6BFF">${snap}</b>${idx<digits.length-1?' …':''}</span>
            </div>`;
        }});
    });
    /* 最后：拼接完成 */
    steps.push({desc:`拼接完成：<b class="c-op">${num}</b><sub>十进制</sub> = <b class="c-op">${bcd}</b><sub>BCD</sub>，共 ${digits.length}×4 = <b>${digits.length*4}</b> 位二进制，占 <b>${Math.ceil(digits.length*4/8)}</b> 字节存储。`,
      draw:()=>{
        $('#stage').innerHTML=`<div class="stage-hd"><span>${label}</span><span class="state">完成</span></div>
          <div class="step-title"><span class="st-dot"></span>编码结果</div>
          <div class="group-box" style="margin:10px 0;justify-content:center">
            ${digits.map(d=>`<span class="grp done">${d}</span>`).join('')}
          </div>
          <div style="text-align:center;font-size:clamp(12px,1.6vw,14px);color:#22C55E;margin:8px 0">↓ 逐位转 4 位二进制 ↓</div>
          <div class="group-box" style="justify-content:center">
            ${bits.map(b=>`<span class="grp done" style="border-color:#22C55E;background:#E8FBF0">${b}</span>`).join('')}
          </div>
          <div class="write-result">${num}<sub>十进制</sub> = ${bcd}<sub>BCD</sub>（${digits.length*4} 位 = ${Math.ceil(digits.length*4/8)} 字节）</div>`;
      }});
    return steps;
  },
  /* ========== 区位码 → 国标码 → 机内码 ========== */
  genHanzi(){
    const el=$('#e-hanzi-level');
    const lv=el?el.value:'common';
    const qh=lv==='rare'?randInt(56,87):randInt(16,55);

    const whHex=wh.toString(16).toUpperCase().padStart(2,'0');
    const gbQ=(qh+0x20).toString(16).toUpperCase().padStart(2,'0');
    const gbW=(wh+0x20).toString(16).toUpperCase().padStart(2,'0');
    const neiQ=(qh+0xA0).toString(16).toUpperCase().padStart(2,'0');

        $('#stage').innerHTML=`<div class="stage-hd"><span>${label}</span><span class="state">区位 ${qh} ${wh}</span></div>

              <span class="grp write-in" style="animation-delay:.25s">位号 ${wh}</span>
            </div>

      }});
    /* 步骤2：区、位分别转十六进制 */
    steps.push({desc:`区号、位号分别换算为十六进制：<b class="c-op">${qh}</b> → ${qhHex}H，<b class="c-op">${wh}</b> → ${whHex}H。`,
      draw:()=>{
        $('#stage').innerHTML=`<div class="stage-hd"><span>${label}</span><span class="state">转十六进制</span></div>
          <div class="step-title"><span class="st-dot"></span>区位码（十进制 → 十六进制）</div>
          <table class="exp-table" style="max-width:420px;margin:0 auto">
            <tr><th>项</th><th>十进制</th><th>十六进制</th></tr>

          </table>
          <div class="exp-inline" style="display:inline-block;margin-top:10px">

            <span class="term done">${wh} → ${whHex}H</span>
          </div>`;
      }});
    /* 步骤3：+2020H 得国标码 */
    steps.push({desc:`国标码 = 区位码 + 2020H：区 ${qhHex}H + 20H = <b class="c-op">${gbQ}H</b>，位 ${whHex}H + 20H = <b class="c-op">${gbW}H</b>，国标码为 <b class="c-op">${gbQ} ${gbW}H</b>。`,

          <div class="exp-inline" style="display:block;margin:6px 0">
            <span class="term done">${qhHex}H</span><span class="op">+ 20H =</span>
            <span class="term cur write-in" style="animation-delay:.2s">${gbQ}H</span>
          </div>
          <div class="exp-inline" style="display:block;margin:6px 0">
            <span class="term done">${whHex}H</span><span class="op">+ 20H =</span>
            <span class="term cur write-in" style="animation-delay:.4s">${gbW}H</span>

          <div class="write-result">国标码 = ${gbQ} ${gbW}H</div>`;
      }});
    /* 步骤4：+8080H 得机内码 */
    steps.push({desc:`机内码 = 国标码 + 8080H：区 ${gbQ}H + 80H = <b class="c-op">${neiQ}H</b>，位 ${gbW}H + 80H = <b class="c-op">${neiW}H</b>；汉字在机内占 <b>2 字节</b>。`,
      draw:()=>{

          <div class="step-title"><span class="st-dot"></span>求机内码（国标码 + 8080H）</div>
          <div class="exp-inline" style="display:block;margin:6px 0">

          </div>
          <div class="exp-inline" style="display:block;margin:6px 0">
            <span class="term done">${gbW}H</span><span class="op">+ 80H =</span>

  /* ========== 字形码容量：点阵位数 → 字节数 → 总容量 ========== */
  genFont(){

    const count=elCount?+elCount.value:1000;
    const w=size, h=size;

    steps.push({desc:`总容量 = 每字字节数 × 汉字数 = ${bytes} × ${count} = <b class="c-op">${total.toLocaleString()}</b> 字节 ≈ <b class="c-op">${kb.toFixed(1)} KB</b>（1 KB = 1024 B）。`,
      draw:()=>{
        $('#stage').innerHTML=`<div class="stage-hd"><span>${label}</span><span class="state">完成</span></div>
          <div class="step-title"><span class="st-dot"></span>字库总容量</div>
          <div class="exp-inline" style="display:block;margin:6px 0">
            <span class="term cur">${bytes}</span><span class="op">×</span><span class="term cur">${count}</span>

function ipToArr(ip){return ip.split('.').map(Number);}
function arrToIp(a){return a.join('.');}
function ipAnd(a,b){return a.map((v,i)=>v&b[i]);}
function ipOr(a,b){return a.map((v,i)=>v|b[i]);}
function ipNot(a){return a.map(v=>255-v);}
function ipAdd(a,n){let v=a[0]*16777216+a[1]*65536+a[2]*256+a[3]+n;return [(v>>>24)&255,(v>>>16)&255,(v>>>8)&255,v&255];}
function prefixToMask(p){const m=[];for(let i=0;i<4;i++){const s=Math.max(0,Math.min(8,p-i*8));m.push(s===8?255:s===0?0:256-Math.pow(2,8-s));}return m;}
function ipClass(a){const f=a[0];if(f>=1&&f<=126)return['A','255.0.0.0','/8'];if(f===127)return['A(回环)','255.0.0.0','/8'];if(f>=128&&f<=191)return['B','255.255.0.0','/16'];if(f>=192&&f<=223)return['C','255.255.255.0','/24'];if(f>=224&&f<=239)return['D(组播)','—','—'];return['E(保留)','—','—'];}
