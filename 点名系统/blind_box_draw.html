<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>盲盒抽取系统</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%234F6BFF'/%3E%3Cpath d='M8 12l3 3 5-6' stroke='white' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<style>
:root{
  --bg-gradient: linear-gradient(135deg,#E6ECFF 0%,#DCEEFF 45%,#EDE8FF 100%);
  --surface:#FFFFFF; --surface-2:#F8FAFF;
  --radius-lg:20px; --radius:14px; --radius-sm:10px;
  --shadow-card:0 4px 24px rgba(79,107,255,.08),0 1px 3px rgba(0,0,0,.04);
  --shadow-hover:0 8px 32px rgba(79,107,255,.14),0 2px 6px rgba(0,0,0,.05);
  --accent:#4F6BFF; --accent-hover:#3D56E0; --accent-soft:rgba(79,107,255,.08);
  --cyan:#38BDF8; --green:#22C55E; --orange:#F59E0B; --red:#EF4444;
  --text:#0F172A; --text-2:#334155; --text-3:#64748B;
  --border:rgba(79,107,255,.12);
  --grad-text:linear-gradient(90deg,#4F6BFF,#38BDF8);
  --font:"Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg-gradient);color:var(--text);line-height:1.55;min-height:100vh;display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 12% 18%,rgba(79,107,255,.08),transparent 32%),radial-gradient(circle at 88% 82%,rgba(56,189,248,.08),transparent 32%);pointer-events:none;z-index:0}

.topbar{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.topbar-inner{max-width:1040px;margin:0 auto;padding:8px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700}
.brand .brand-icon{width:32px;height:32px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.brand .brand-icon svg{width:18px;height:18px}
.topnav{display:flex;gap:8px}
.topnav a{font-size:13px;color:var(--text-2);text-decoration:none;padding:7px 14px;border:1px solid var(--border);border-radius:999px;min-height:44px;display:inline-flex;align-items:center;transition:.2s ease;background:#fff;font-weight:600}
.topnav a:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}

.wrap{position:relative;z-index:1;max-width:1040px;width:100%;margin:0 auto;padding:24px 20px 32px;flex:1;display:flex;flex-direction:column;gap:14px}

.page-head{text-align:center;margin-bottom:2px}
.capsule{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:4px 12px;font-size:11px;letter-spacing:1.5px;color:var(--text-3);box-shadow:var(--shadow-card);margin-bottom:8px}
.capsule::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
.page-head h1{font-size:27px;font-weight:800;margin-bottom:3px}
.page-head p{font-size:13px;color:var(--text-3)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);padding:18px}
.card h2{font-size:14.5px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:9px;color:var(--text)}
.card h2::before{content:"";width:4px;height:15px;border-radius:2px;background:var(--grad-text)}
.card h2 svg{width:16px;height:16px;color:var(--accent)}

.upload-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:700px){.upload-grid{grid-template-columns:1fr 1fr}}
.upload-item label.up-label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text)}
.file-input{display:block;width:100%;font-size:15px;padding:8px;border:1.5px dashed var(--border);border-radius:var(--radius-sm);background:var(--surface-2);color:var(--text-2);cursor:pointer;font-family:var(--font)}
.file-input::-webkit-file-upload-button{background:var(--accent-soft);color:var(--accent);border:none;border-radius:8px;padding:7px 12px;margin-right:10px;font-size:13px;cursor:pointer;font-family:var(--font);font-weight:600}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);font-size:12.5px;font-weight:600;padding:4px 12px;border-radius:999px;margin-top:6px}

.draw-row{margin-top:14px;padding-top:14px;border-top:1px dashed var(--border);display:flex;justify-content:center}
.btn{font-family:var(--font);font-size:13px;font-weight:600;min-height:44px;padding:8px 22px;border-radius:11px;cursor:pointer;border:1px solid transparent;transition:.2s ease;display:inline-flex;align-items:center;gap:8px}
.btn-primary{background:linear-gradient(135deg,#4F6BFF,#38BDF8);color:#fff;box-shadow:0 4px 14px rgba(79,107,255,.25)}
.btn-primary:hover{background:var(--accent-hover);transform:translateY(-1px)}
.btn svg{width:18px;height:18px}

.result{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);padding:18px;min-height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px}
.result .placeholder{font-size:14px;color:var(--text-3)}
.r-name{font-size:13.5px;color:var(--text-3)}
.r-name b{font-size:30px;font-weight:800;background:var(--grad-text);-webkit-background-clip:text;background-clip:text;color:transparent;margin:0 4px;display:block;line-height:1.3}
.r-topic{font-size:13.5px;color:var(--text-3)}
.r-topic .topic-box{display:inline-block;margin-top:5px;font-size:15px;font-weight:700;color:var(--text);background:var(--surface-2);border:1.5px solid var(--border);border-radius:var(--radius);padding:8px 14px;max-width:100%}
.r-punish{font-size:13px;color:var(--text-3);border-top:1px dashed var(--border);padding-top:10px;width:100%}
.r-punish .p-box{display:inline-block;margin-top:5px;font-size:13.5px;font-weight:600;color:var(--orange);background:rgba(245,158,11,.1);border-radius:999px;padding:5px 14px}
.status{font-size:13px;min-height:18px;margin-top:8px;text-align:center}
.status.ok{color:var(--green)}
.status.err{color:var(--red)}

@media(max-width:600px){
  .page-head h1{font-size:23px}
  .r-name b{font-size:26px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.27 6.96L12 12.01l8.73-5.05"/><path d="M12 22.08V12"/></svg></span>
      盲盒抽取系统
    </div>
    <nav class="topnav">
      <a href="./index.html">返回首页</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="page-head">
    <span class="capsule">BLIND BOX · SURPRISE DRAW</span>
    <h1>盲盒 <span style="background:var(--grad-text);-webkit-background-clip:text;background-clip:text;color:transparent">抽取</span>系统</h1>
    <p>学生 + 知识点，一次抽中</p>
  </div>

  <section class="card">
    <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>导入素材</h2>
    <div class="upload-grid">
      <div class="upload-item">
        <label class="up-label" for="nameFile">学生名单（每行一个姓名）</label>
        <input type="file" id="nameFile" class="file-input" accept=".txt" />
        <span class="badge" id="nameBadge">尚未导入名单</span>
      </div>
      <div class="upload-item">
        <label class="up-label" for="topicFile">知识点清单（每行一个知识点）</label>
        <input type="file" id="topicFile" class="file-input" accept=".txt" />
        <span class="badge" id="topicBadge">尚未导入知识点</span>
      </div>
    </div>
    <div class="draw-row">
      <button class="btn btn-primary" onclick="draw()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        开始抽奖
      </button>
    </div>
    <p class="status" id="status"></p>
  </section>

  <section class="result" id="result-container">
    <span class="placeholder">等待抽奖……</span>
  </section>

</main>

<script>
let nameList = [];
let topicList = [];
const resultEl = document.getElementById('result-container');
const statusEl = document.getElementById('status');

const punishList = [
  "原地转10圈",
  "做5个俯卧撑",
  "唱一首歌",
  "模仿一个动物叫",
  "绕教室跑一圈",
  "值日劳动",
  "作业激怒计划（增加作业）",
  "知识点图表",
  "表情包配音背诵"
];

function setStatus(msg, type){
  statusEl.textContent = msg || '';
  statusEl.className = 'status' + (type ? ' ' + type : '');
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.getElementById('nameFile').addEventListener('change', function (event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function (e) {
    const content = e.target.result;
    nameList = content.split('\n').map(name => name.trim()).filter(name => name.length > 0);
    document.getElementById('nameBadge').textContent = '已导入 ' + nameList.length + ' 名学生';
    setStatus('成功导入 ' + nameList.length + ' 名学生', 'ok');
  };
  reader.readAsText(file);
});

document.getElementById('topicFile').addEventListener('change', function (event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function (e) {
    const content = e.target.result;
    topicList = content.split('\n').map(topic => topic.trim()).filter(topic => topic.length > 0);
    document.getElementById('topicBadge').textContent = '已导入 ' + topicList.length + ' 个知识点';
    setStatus('成功导入 ' + topicList.length + ' 个知识点', 'ok');
  };
  reader.readAsText(file);
});

function draw() {
  if (nameList.length === 0 || topicList.length === 0) {
    setStatus('请先上传学生名单和知识点文件！', 'err');
    return;
  }
  const randomName = nameList[Math.floor(Math.random() * nameList.length)];
  const randomTopic = topicList[Math.floor(Math.random() * topicList.length)];
  const randomPunish = punishList[Math.floor(Math.random() * punishList.length)];

  resultEl.innerHTML =
    '<div class="r-name">恭喜同学抽到<b>' + escapeHtml(randomName) + '</b></div>' +
    '<div class="r-topic">抽到的知识点<div class="topic-box">' + escapeHtml(randomTopic) + '</div></div>' +
    '<div class="r-punish">若未完成，请完成：<div class="p-box">' + escapeHtml(randomPunish) + '</div></div>';
}
</script>

</body>
</html>
